---
# Common variables for both primary and (future) secondary technitium boxes.
# Sensitive values (admin password, vault secrets) live in vars/vault.yml.

# ---- Technitium runtime ----
technitium_install_url: "https://download.technitium.com/dns/install.sh"
technitium_admin_user: admin

# PER-HOST admin passwords. Each box has its own — Technitium accounts are local
# to a server, so a single shared value was wrong (fixed 2026-08-25, after
# dns-slave's first run failed to authenticate with dns-master's password).
#
# vars/vault.yml (vault-encrypted) defines the dict:
#     technitium_admin_passwords:
#       dns-master: "..."
#       dns-slave:  "..."
#
# Resolved per host below, so every task in the roles keeps using the familiar
# `technitium_admin_password` name. Kept as ONE vault file rather than per-host
# host_vars so the operator still types the vault password exactly once.
# A missing key is caught by an explicit assert at the top of
# roles/technitium-config, which gives a readable message instead of a raw
# Jinja KeyError.
technitium_admin_password: "{{ technitium_admin_passwords[inventory_hostname] }}"
technitium_api_base: "http://127.0.0.1:5380"   # always call the API on the local box

# Web UI / API port (Technitium default 5380)
technitium_http_port: 5380

# ---- Time sync ----
# ALL of these go in NTP=, never FallbackNTP= — see the header of
# roles/base/templates/10-ntp.conf.j2 for why that split is a trap and how it
# caused the 2026-07-25 outage.
#
# IPs, not hostnames: this box is the LAN resolver, so a hostname would make
# NTP depend on the DNS that a correct clock is required to validate.
#
# Order is preference — timesyncd walks the list until one answers.
ntp_servers:
  - 192.168.1.1        # MikroTik CCR2004, LAN gateway — lowest latency, first choice
  - 194.146.251.100    # tempus1.gum.gov.pl — Główny Urząd Miar (PL national metrology)
  - 194.146.251.101    # tempus2.gum.gov.pl — SAME operator, adjacent IP: correlated
  - 162.159.200.123    # time.cloudflare.com — anycast, independent operator
  - 195.176.26.215     # carried over from the old hand-written drop-in; PTR is
                       # delegated so the operator is unconfirmed. Candidate for
                       # removal once the Cloudflare entry has proven itself.
#
# On diversity: .100 and .101 are adjacent addresses at one organisation, so
# "three public servers" was really two independent failure domains. Cloudflare
# anycast adds a genuinely separate one. (Cloudflare leap-SMEARS and GUM does
# not; sub-second disagreement around a leap second is irrelevant here, where
# the accuracy that matters is "within the DNSSEC signature window".)

# ---- Authoritative split-horizon zone for okd.sudops.pl ----
# Records that technitium serves authoritatively to LAN clients.
# These mirror the on-host CoreDNS templates inside the cluster — same answers,
# different authoritative server. The cluster's internal DNS path is unchanged.
okd_zone_name: okd.sudops.pl
okd_api_vip: 192.168.1.240
okd_ingress_vip: 192.168.1.241
okd_nodes:
  - { name: node4, ip: 192.168.1.7 }
  - { name: node5, ip: 192.168.1.8 }
  - { name: node6, ip: 192.168.1.9 }

# ---- Authoritative LAN-only zone for homelab.sudops.pl ----
# Real LAN-appliance hostnames with valid public TLS certs, without ever
# publishing the LAN IPs to Cloudflare. Technitium serves these records
# authoritatively to LAN clients; external queries for *.homelab.sudops.pl
# return NXDOMAIN because Cloudflare doesn't carry any. The DNS-01
# challenge for the wildcard cert (shipped 2026-05-24, lives in
# cert-manager namespace as homelab-wildcard-tls) still works because LE
# only needs the parent sudops.pl zone on Cloudflare. Full design in
# blog/blog-homelab-sudops-zone-draft.md.
homelab_zone_name: homelab.sudops.pl
homelab_records:
  - { name: nas, ip: 192.168.1.2  }
  - { name: dns, ip: 192.168.1.12 }

# ---- Blocked zones (return NXDOMAIN locally, never recurse) ----
# Carry-over from pi-hole's `local=/.../` dnsmasq directives.
# `cluster.local` catches any host-side process that tries to resolve a
# `<svc>.cluster.local` name through the LAN resolver.
# `svc.cluster.local.okd.sudops.pl` catches the search-suffix-leak shape from
# cluster pods with ndots:5 (until/unless `tests/mc-nm-strip-okd-search.yaml`
# lands and removes the search suffix at the source).
technitium_blocked_zones:
  - cluster.local
  - svc.cluster.local.okd.sudops.pl

# ---- Conditional forwarder zones (LAN-local zones the MikroTik serves) ----
# Pre-cutover, pi-hole forwarded `home.lab` and `homelab.net` to gw.home.lab
# (192.168.1.1), which had static A records like `kube-cp.homelab.net →
# 192.168.1.200` (old-cluster API VIP). Technitium does recursive resolution
# by default, so without these Forwarder zones the LAN's local names hit
# public Cloudflare and return NXDOMAIN — broke the old cluster's kubelet
# discovery 2026-05-12 evening.
technitium_forwarder_zones:
  - { zone: "homelab.net", forwarder: "192.168.1.1", protocol: "Udp" }
  - { zone: "home.lab",    forwarder: "192.168.1.1", protocol: "Udp" }

# ---- Rate limiting ----
# Technitium rate-limits by client subnet (QPM = queries per minute, per-prefix).
# Pi-hole's per-client REFUSE storm bit node6 in April; technitium's approach
# is different — we use the bypass list to exempt the LAN entirely from QPM
# limits. The cluster nodes generate bursty DNS during memberlist re-resolution
# after pod restarts; bypassing makes that a non-issue. Narrow this CIDR later
# if specific noisy clients show up that *should* be rate-limited.
technitium_qpm_bypass_list: "192.168.1.0/24"

# ---- Recursion + DNSSEC ----
technitium_recursion_mode: "AllowOnlyForPrivateNetworks"  # not "Allow" — don't be an open resolver
technitium_dnssec_validation: true

# ---- Block lists ----
# URLs in files/blocked.urls (one per line, # for comments). Currently:
# StevenBlack/hosts only (validated 2026-05-12, ~82k blocked domains).
# Add more lists there over time.
# Technitium re-fetches from each URL every N hours; 24 is the upstream default.
technitium_blocklist_update_interval_hours: 24

# ---- Primary/slave replication (roles/technitium-replication) ----
# Only RECORD-BEARING authoritative zones are replicated. The blocked zones
# (cluster.local, svc.cluster.local.okd.sudops.pl) and the conditional
# forwarder zones are configuration rather than data — technitium-config
# creates those independently on every box, so they need no transfer.
technitium_replicated_zones:
  - "{{ okd_zone_name }}"
  - "{{ homelab_zone_name }}"

# The slave's address, used on the PRIMARY to build the zone-transfer ACL and
# the NOTIFY target list. Kept here (not in inventory) so the primary can be
# configured before the slave box physically exists.
technitium_slave_ip: 192.168.1.13

# Zone transfer over plain TCP. Tls/Quic are supported by Technitium but need
# a cert on the primary; on a trusted LAN segment between two boxes we own,
# TCP + an IP ACL is proportionate. Revisit if DNS ever crosses an untrusted hop.
technitium_zone_transfer_protocol: Tcp
