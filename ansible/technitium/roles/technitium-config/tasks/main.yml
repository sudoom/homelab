---
# Configure Technitium DNS Server via its HTTP API.
# All API calls go to 127.0.0.1:5380 (the local box) — no need to expose the
# admin port externally. API param names are taken from the canonical doc:
# https://github.com/TechnitiumSoftware/DnsServer/blob/master/APIDOCS.md
#
# Workflow:
#   1. Login with admin credentials → register session token, build Bearer header
#   2. /api/settings/set with: recursion, DNSSEC, rate-limit bypass, block-list
#      URLs (read from files/blocked.urls), block-list update interval
#   3. /api/zones/create for okd.sudops.pl (authoritative split-horizon)
#   4. /api/zones/records/add for each record in the okd zone (overwrite=true → idempotent)
#   5. /api/zones/create for each blocked zone (cluster.local + svc.cluster.local.okd.sudops.pl)
#      — empty authoritative zone → NXDOMAIN by default
#   6. /api/settings/forceUpdateBlockLists to refresh the block list cache now
#   7. /api/user/logout

# ---- Login + Bearer header --------------------------------------------------
# Tagged `always` so authentication runs regardless of which --tags filter the
# operator picks (e.g. --tags forwarders). Without this, narrow-scoped re-runs
# fail with "technitium_auth_headers is undefined".
- name: Assert this host has an admin password in the vault
  ansible.builtin.assert:
    that:
      - technitium_admin_passwords is defined
      - inventory_hostname in technitium_admin_passwords
    fail_msg: >-
      No Technitium admin password for '{{ inventory_hostname }}' in
      vars/vault.yml. Expected key:
      technitium_admin_passwords['{{ inventory_hostname }}'].
      See vars/vault.yml.example. Changed 2026-08-25 from a single shared
      `technitium_admin_password` — Technitium user accounts are LOCAL to each
      server, so two boxes need two passwords.
    quiet: true
  tags: [config, always]

# THE BODY-STATUS TRAP, applied to login itself. Technitium answers a WRONG
# PASSWORD with HTTP 200 and {"status":"error","errorMessage":"..."} — so a
# plain `status_code: 200` task reports `ok` on a failed login, and the failure
# only surfaces one task later as an inscrutable
#   "object of type 'dict' has no attribute 'token'"
# on the token extraction. Hit for real on dns-slave's first run, 2026-08-25.
# `failed_when: false` here is deliberate: we branch on the BODY below.
- name: Login to Technitium API
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ technitium_admin_user }}"
      pass: "{{ technitium_admin_password }}"
      includeInfo: "false"
    status_code: 200
    return_content: true
  register: technitium_login
  failed_when: false
  no_log: true
  tags: [config, always]

# ---- First-boot bootstrap --------------------------------------------------
# A freshly installed Technitium still has the documented installer default
# (admin/admin), so the managed password cannot work yet. Rather than making
# that a manual "go set it in the web UI" step — which would not survive an SD
# reimage, the same class of drift as the hand-written NTP drop-in that caused
# the 2026-07-25 outage — adopt the box: log in with the default, change the
# password to the managed one, and continue. Idempotent by construction: on
# every subsequent run the first login succeeds and this whole block skips.
- name: Adopt a freshly installed Technitium (default credentials still in place)
  when: (technitium_login.json.status | default('error')) != 'ok'
  tags: [config, always]
  block:
    - name: Login with the installer default credentials
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: admin
          includeInfo: "false"
        status_code: 200
        return_content: true
      register: technitium_default_login
      failed_when: (technitium_default_login.json.status | default('error')) != 'ok'
      no_log: true

    - name: Change the admin password to the managed one
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/api/user/changePassword"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_default_login.json.token }}"
        body_format: form-urlencoded
        body:
          pass: admin
          newPass: "{{ technitium_admin_password }}"
        status_code: 200
        return_content: true
      register: technitium_pwchange
      failed_when: (technitium_pwchange.json.status | default('error')) != 'ok'
      no_log: true

    - name: Re-login with the managed password
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ technitium_admin_password }}"
          includeInfo: "false"
        status_code: 200
        return_content: true
      register: technitium_login
      failed_when: (technitium_login.json.status | default('error')) != 'ok'
      no_log: true

  rescue:
    - name: Explain why authentication failed
      ansible.builtin.fail:
        msg: >-
          Could not authenticate to Technitium at {{ technitium_api_base }}.
          The managed password (technitium_admin_password, from vars/vault.yml)
          was rejected, AND so was the installer default (admin/admin), so this
          box is neither freshly installed nor set to the managed password.
          Most likely: the admin password was changed by hand to a third value.
          Fix by resetting it — stop dns.service, edit the Technitium config to
          reset the admin user, or reinstall — then re-run. Do NOT work around
          this by changing the vault to match the box: the vault is the source
          of truth for BOTH boxes, and they must share one password.

- name: Assert we actually hold a session token
  ansible.builtin.assert:
    that:
      - technitium_login.json.token is defined
    fail_msg: "Login returned no token — see the task above."
    quiet: true
  tags: [config, always]

- name: Extract session token + build Bearer auth header
  ansible.builtin.set_fact:
    technitium_auth_headers:
      Authorization: "Bearer {{ technitium_login.json.token }}"
  no_log: true
  tags: [config, always]

# ---- Read block list URLs from files/blocked.urls --------------------------
- name: Read block-list URLs from files/blocked.urls
  # Use .splitlines() (a Python string method) rather than .split('\n'),
  # because in YAML scalars '\n' is the literal two-character sequence,
  # not a newline — so .split('\n') returns the whole file as one element
  # and the first-line comment then nukes everything via reject('match','^#').
  # Also tagged `always` so --tags settings (which uses this fact) doesn't fail.
  ansible.builtin.set_fact:
    technitium_block_list_urls: >-
      {{
        lookup('ansible.builtin.file', 'blocked.urls').splitlines()
        | map('trim')
        | reject('match', '^#')
        | reject('equalto', '')
        | list
        | join(',')
      }}
  tags: [config, blocklist, always]

- name: Sanity check — assert the blocklist URLs string is non-empty
  ansible.builtin.assert:
    that:
      - technitium_block_list_urls | length > 0
    fail_msg: |
      files/blocked.urls produced an empty technitium_block_list_urls string.
      Check that the file has at least one non-comment, non-blank line, and
      that the file is at ansible/technitium/files/blocked.urls (lookup is
      relative to the playbook dir, not the role).
  tags: [config, blocklist, always]

# ---- /api/settings/set — server-level settings -----------------------------
- name: Apply server-level DNS settings
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/settings/set"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      recursion: "{{ technitium_recursion_mode }}"
      dnssecValidation: "{{ technitium_dnssec_validation | string | lower }}"
      qpmLimitBypassList: "{{ technitium_qpm_bypass_list }}"
      enableBlocking: "true"                # explicit — Technitium's fresh-install default is false
      blockListUrls: "{{ technitium_block_list_urls }}"
      blockListUpdateIntervalHours: "{{ technitium_blocklist_update_interval_hours }}"
    status_code: 200
  tags: [config, settings]

# ---- /api/zones/create — authoritative okd.sudops.pl -----------------------
# Same body-status quirk as the Forwarder zone task below: Technitium returns
# HTTP 200 with `"status": "error"` for any zone-create problem. Without
# `failed_when`, the task silently succeeds on real failures and only the
# already-exists case is tolerated (via the JSON-body inspection).
- name: Ensure okd.sudops.pl primary zone exists
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/create"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ okd_zone_name }}"
      type: Primary
    status_code: 200
    return_content: true
  register: okd_primary_zone_response
  failed_when:
    - okd_primary_zone_response.json.status != "ok"
    - "'already exists' not in (okd_primary_zone_response.json.errorMessage | default(''))"
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

# ---- /api/zones/records/add — populate okd.sudops.pl records ---------------
- name: Build okd.sudops.pl service-level records list
  ansible.builtin.set_fact:
    okd_records:
      - { domain: "api.{{ okd_zone_name }}",     ipAddress: "{{ okd_api_vip }}" }
      - { domain: "api-int.{{ okd_zone_name }}", ipAddress: "{{ okd_api_vip }}" }
      - { domain: "*.apps.{{ okd_zone_name }}",  ipAddress: "{{ okd_ingress_vip }}" }
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

- name: Add/update okd.sudops.pl service-level A records (idempotent via overwrite=true)
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/records/add"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ okd_zone_name }}"
      domain: "{{ item.domain }}"
      type: A
      ipAddress: "{{ item.ipAddress }}"
      ttl: "60"
      overwrite: "true"
    status_code: 200
  loop: "{{ okd_records }}"
  loop_control:
    label: "{{ item.domain }} → {{ item.ipAddress }}"
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

- name: Add/update okd.sudops.pl node A records (idempotent via overwrite=true)
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/records/add"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ okd_zone_name }}"
      domain: "{{ item.name }}.{{ okd_zone_name }}"
      type: A
      ipAddress: "{{ item.ip }}"
      ttl: "60"
      overwrite: "true"
    status_code: 200
  loop: "{{ okd_nodes }}"
  loop_control:
    label: "{{ item.name }}.{{ okd_zone_name }} → {{ item.ip }}"
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

# ---- /api/zones/create — authoritative homelab.sudops.pl -------------------
# LAN-only zone for non-OKD appliances (NAS, dns-master, future hosts).
# Split-horizon: Cloudflare doesn't carry any A records here; Technitium
# is the only resolver that knows these LAN IPs. Same idempotent shape as
# the okd zone above — Technitium returns HTTP 200 with status="error"
# on real failure, "already exists" tolerated.
- name: Ensure homelab.sudops.pl primary zone exists
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/create"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ homelab_zone_name }}"
      type: Primary
    status_code: 200
    return_content: true
  register: homelab_primary_zone_response
  failed_when:
    - homelab_primary_zone_response.json.status != "ok"
    - "'already exists' not in (homelab_primary_zone_response.json.errorMessage | default(''))"
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

- name: Add/update homelab.sudops.pl A records (idempotent via overwrite=true)
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/records/add"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ homelab_zone_name }}"
      domain: "{{ item.name }}.{{ homelab_zone_name }}"
      type: A
      ipAddress: "{{ item.ip }}"
      ttl: "3600"
      overwrite: "true"
    status_code: 200
  loop: "{{ homelab_records }}"
  loop_control:
    label: "{{ item.name }}.{{ homelab_zone_name }} → {{ item.ip }}"
  # PRIMARY ONLY. On a slave these zones exist as type=Secondary, pulled by
  # AXFR/IXFR (see roles/technitium-replication). Creating them as Primary here
  # would collide with that. Blocked + forwarder zones are NOT guarded --
  # they are config rather than replicated data, so each box owns its own.
  when: technitium_role | default('primary') == 'primary'
  tags: [config, zones]

# ---- Blocked zones (NXDOMAIN locally, never recurse) -----------------------
# An authoritative zone with no records returns NXDOMAIN for any query under it.
# Same body-status quirk: `failed_when` surfaces silent status="error" responses,
# except the already-exists case which is the steady-state on every re-run.
- name: Ensure blocked zones return NXDOMAIN (authoritative empty zones)
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/create"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ item }}"
      type: Primary
    status_code: 200
    return_content: true
  register: blocked_zone_responses
  failed_when:
    - blocked_zone_responses.json.status != "ok"
    - "'already exists' not in (blocked_zone_responses.json.errorMessage | default(''))"
  loop: "{{ technitium_blocked_zones }}"
  loop_control:
    label: "{{ item }}"
  tags: [config, blocked]

# ---- Conditional forwarder zones (delegate LAN-local zones to MikroTik) ----
# NOTE: prior version of this task silently no-op'd because Technitium returns
# HTTP 200 with `"status": "error"` in the body when the zone create has any
# problem — we were checking HTTP status only, not the JSON status field.
# Now register the response and fail if status isn't "ok", except for the
# already-exists case (so re-runs are idempotent).
- name: Ensure conditional forwarder zones exist
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/zones/create"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    body_format: form-urlencoded
    body:
      zone: "{{ item.zone }}"
      type: Forwarder
      protocol: "{{ item.protocol | default('Udp') }}"
      forwarder: "{{ item.forwarder }}"
    status_code: 200
    return_content: true
  register: forwarder_zone_responses
  failed_when:
    - forwarder_zone_responses.json.status != "ok"
    - "'already exists' not in (forwarder_zone_responses.json.errorMessage | default(''))"
  loop: "{{ technitium_forwarder_zones }}"
  loop_control:
    label: "{{ item.zone }} → {{ item.forwarder }} ({{ item.protocol | default('Udp') }})"
  tags: [config, forwarders]

# ---- Force-refresh block list cache now -----------------------------------
- name: Force update of block list cache
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/settings/forceUpdateBlockLists"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    status_code: 200
  changed_when: false   # always fires; not really a "change" in Ansible terms
  tags: [config, blocklist]

# ---- Logout ---------------------------------------------------------------
- name: Logout from Technitium API
  ansible.builtin.uri:
    url: "{{ technitium_api_base }}/api/user/logout"
    method: POST
    headers: "{{ technitium_auth_headers }}"
    status_code: [200, 401]
  no_log: true
  tags: [config]
