---
# Base OS hygiene for the technitium box.
# Keep this minimal — the box's only job is DNS; don't pile on.

# ---- Passwordless sudo for the ansible user --------------------------------
# Codifies what `dns-master` already has. Discovered 2026-08-25: dns-master
# answers `sudo -n true` fine while dns-slave prompts — i.e. the primary's
# passwordless sudo was created out of band (RPi Imager, or by hand) and was
# recorded nowhere. That is exactly the shape of the hand-written NTP drop-in
# that caused the 2026-07-25 outage: working state that would vanish on an SD
# reimage. Making it a role task fixes the drift AND brings the slave in line.
#
# `validate:` is not optional. Ansible writes to a temp file, runs
# `visudo -cf` against it, and only installs it if it parses. A malformed
# sudoers file locks out sudo entirely — recovery is physical console or an SD
# swap. Never write to /etc/sudoers.d without it.
#
# FIRST RUN against a box whose sudo still needs a password requires the become
# password (`ansible_become_password` in vars/vault.yml, or --ask-become-pass).
# After this task lands, subsequent runs no longer need it.
#
# Security note, stated plainly rather than buried: this means an SSH key on
# this box is root on this box, with no second factor. Accepted because SSH is
# key-only with password auth off, and because it was ALREADY true on
# dns-master — this records reality rather than changing it.
- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/010_{{ ansible_user }}-nopasswd"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"          # sudo REFUSES to read a group/world-writable file
    validate: "visudo -cf %s"
  tags: [base, sudo]

- name: Check whether dhcpcd is in use
  ansible.builtin.stat:
    path: /etc/dhcpcd.conf
  register: dhcpcd_conf_stat
  tags: [base, hostname]

- name: Disable dhcpcd's hostname hook (prevents DHCP/PTR from reverting our hostname)
  # Without this, dhcpcd's 30-hostname hook does a reverse lookup on the leased
  # IP and resets `hostname` + `/etc/hostname` + `/etc/hosts` to whatever the
  # DHCP server's lease record says. That's what reverted `dns-master` back to
  # `pi-hole-master` post-cutover. `nohook hostname` tells dhcpcd to leave the
  # hostname alone — our static settings below then stick.
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    line: "nohook hostname"
    state: present
  when: dhcpcd_conf_stat.stat.exists
  tags: [base, hostname]

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [base, hostname]

- name: Ensure /etc/hosts has the canonical 127.0.1.1 entry for our hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ inventory_hostname }}"
    state: present
  tags: [base, hostname]

- name: Read current timezone
  ansible.builtin.command: timedatectl show --value --property=Timezone
  register: current_timezone
  changed_when: false
  check_mode: false
  tags: [base, timezone]

- name: Set timezone to Europe/Warsaw
  ansible.builtin.command: timedatectl set-timezone Europe/Warsaw
  when: current_timezone.stdout != "Europe/Warsaw"
  tags: [base, timezone]

# ---- Time sync ---------------------------------------------------------
# Was unmanaged: /etc/systemd/timesyncd.conf.d/10-router-ntp.conf existed only
# because someone wrote it over SSH. It would not survive an SD-card reimage,
# and it had the servers in the wrong directive. Managed here now so the fix
# is reproducible and the reasoning travels with it.
#
# Deliberately NOT guarded to ARM/RPi: timesyncd is platform-neutral and the
# x86 secondary needs exactly the same config.
- name: Ensure timesyncd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"
  tags: [base, ntp]

- name: Configure NTP servers for systemd-timesyncd
  ansible.builtin.template:
    src: 10-ntp.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/10-ntp.conf
    mode: "0644"
  notify: Restart systemd-timesyncd
  tags: [base, ntp]

- name: Remove the superseded hand-written NTP drop-in
  # 10-router-ntp.conf sorts AFTER 10-ntp.conf, so leaving it in place would
  # let the old single-server config win. Must be deleted, not just replaced.
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d/10-router-ntp.conf
    state: absent
  notify: Restart systemd-timesyncd
  tags: [base, ntp]

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: [base, ntp]

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl                # Technitium installer pulls itself via curl
      - ca-certificates
      - python3             # for Ansible itself
      - python3-requests    # for the uri module's HTTP calls (more robust than urllib)
      - unattended-upgrades # auto-apply security patches
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [base, packages]

- name: Configure unattended-upgrades for security updates only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  tags: [base, packages]

# TODO (when ready): fail2ban for ssh, ssh-key-only auth (PasswordAuthentication no),
# disable root login, etc. Out of scope for the first scaffold pass.

# ---- Pi-hole removal (post-Technitium-cutover cleanup) --------------------
# Codifies the pi-hole purge so that:
#   (a) the cleanup runs on the current dns-master box without a one-off SSH command, and
#   (b) any future reimage that accidentally installs pi-hole gets re-cleaned
#       on the next base-role run.
# Pi-hole's v6 installer registers only `pihole-meta` with apt; the rest of
# the footprint (CLI script, /etc/pihole, /opt/pihole, admin web UI files,
# the FTL systemd unit) is dropped outside dpkg's tracking, so apt purge
# alone doesn't remove it. We purge the meta package first (lets dpkg run
# its postrm), then sweep the installer-managed paths, then daemon-reload
# to drop the now-stale unit file.
# Tasks are state=absent and naturally idempotent — once clean, re-runs no-op.
- name: Remove pihole-meta apt package
  ansible.builtin.apt:
    name: pihole-meta
    state: absent
    purge: true
  tags: [base, pihole-cleanup]

- name: Remove pi-hole installer-managed files and directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/pihole
    - /opt/pihole
    - /var/log/pihole
    - /var/www/html/admin
    - /etc/cron.d/pihole
    - /etc/systemd/system/pihole-FTL.service
    - /usr/local/bin/pihole
  register: pihole_files_removed
  tags: [base, pihole-cleanup]

- name: Reload systemd after removing pihole-FTL unit file
  ansible.builtin.systemd:
    daemon_reload: true
  when: pihole_files_removed.changed
  tags: [base, pihole-cleanup]
