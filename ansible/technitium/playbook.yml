---
# Top-level playbook for the technitium DNS server.
#
# Usage from a workstation with this repo cloned:
#   cd ansible/technitium
#   ansible-playbook -i inventory.yml playbook.yml \
#     --ask-vault-pass \
#     --limit dns-master
#
# (or --limit dns-slave when that lands)
#
# Roles run in order; each is idempotent — re-running converges state.

- name: Configure technitium DNS server
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    # Vault-encrypted file containing technitium_admin_password and any other secrets.
    # Create with: ansible-vault create vars/vault.yml
    - vars/vault.yml

  # Ends the API session ONCE, after every role that needs it. Deliberately not
  # inside technitium-config: that role runs third of five, and logging out
  # there invalidated the token the cluster and replication roles depend on.
  post_tasks:
    - name: Logout from Technitium API
      ansible.builtin.uri:
        url: "{{ technitium_api_base }}/api/user/logout"
        method: POST
        headers: "{{ technitium_auth_headers }}"
        status_code: [200, 401]
      when: technitium_auth_headers is defined
      no_log: true
      tags: [always]

  roles:
    - role: base                  # OS hardening: unattended-upgrades, timezone, ssh-key auth, fail2ban
    - role: technitium-install    # Install (or upgrade in place) Technitium DNS Server
    - role: technitium-config     # Server settings + zones + blocklists via Technitium HTTP API
    - role: technitium-cluster      # Technitium's NATIVE Cluster feature: settings/blocklists/apps/users sync
    - role: technitium-replication  # Classic AXFR/IXFR zone transfer for the two authoritative zones.
                                    # Distinct from the row above — see README "Two mechanisms, one job each".
