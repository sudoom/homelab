---
# ---------------------------------------------------------------------------
# TrueNAS SCALE configuration — declarative inputs
# ---------------------------------------------------------------------------
# Applied via `midclt` over SSH, NOT the REST API. Reason, recorded once here
# because it is the single most consequential design decision in this topic:
#
#   The TrueNAS REST API (/api/v2.0/) was DEPRECATED in 25.04 and is REMOVED in
#   TrueNAS 26 (already at BETA.3 as of 2026-08-25). It still answers on our
#   25.10.6 (verified: GET /api/v2.0/system/info -> 401, i.e. present but
#   unauthenticated; /api/current -> 404), and from 25.10.1 the box raises a
#   DAILY ALERT every time REST is used. Its replacement is JSON-RPC 2.0 over
#   WebSocket, which `ansible.builtin.uri` CANNOT speak (it is HTTP-only).
#
#   `midclt` talks to the middleware over its local UNIX socket, so it is
#   indifferent to that whole transition — it is the same interface the web UI
#   drives. It keeps us inside the all-builtin invariant via
#   ansible.builtin.command, and it does not need an API key at all.
#
# CONSEQUENCE: no `truenas_api_key` anywhere in this topic. SSH access IS the
# credential. Do not add a REST fallback "just in case" — it has an expiry date.
# ---------------------------------------------------------------------------

# ---- Pool -----------------------------------------------------------------
# NOT created by this playbook. `pool.create` is a one-shot destructive job:
# re-running it against an existing name errors, and against wiped disks it
# would silently build a NEW empty pool over the old one. The storage role
# ASSERTS the pool exists and fails loudly if it does not.
# Pool creation is a documented manual step — see README.md.
truenas_pool: tank

# ---- Datasets -------------------------------------------------------------
# recordsize applies to NEW WRITES ONLY, so it must be right before data lands.
# This is the one chance to get it right per dataset.
#
# NAMING NOTE: the vault's two source notes disagreed — the setup runbook had
# `tank/backups` ("targets for other machines' backups", no offsite policy) and
# the migration plan had `tank/backup` (128k/zstd/frequent snapshots, offsite
# YES). One keystroke apart, different purposes; a machine-backup tree that
# accidentally inherits the offsite policy is a borg repo that quietly is not
# the size you think. Resolved by having NO `backups`: `tank/backup` is the
# offsite-replicated tree, and per-machine targets get explicit names.
truenas_datasets:
  - name: media
    recordsize: 1M
    comments: "Bulk media library + servarr /data. Re-downloadable; no offsite."
    quota: 0                        # 0 = no quota; the pool-level 80% ceiling governs
  - name: immich
    recordsize: 1M
    comments: "Immich photo library (NFS to the cluster). Light snapshots."
    quota: 0
    # OWNERSHIP IS LOAD-BEARING HERE, unlike media/keepers.
    #
    # Those two are consumed by pods running as ROOT (the media + keepers
    # namespaces hold the privileged SCC), and the NFS export sets
    # maproot_user=root, so root-on-client writes fine into a root:root dataset.
    #
    # Immich does NOT: its namespace is restricted-v2 (baseline PSA, no
    # privileged binding) and immich-server runs as the OpenShift-injected UID
    # 1000980000. A root:root 0755 dataset root is unwritable by it, so the
    # dataset must be chowned to that UID or the cutover fails at first write.
    #
    # 1000980000 is NOT arbitrary: it is the base of the immich namespace's
    # `openshift.io/sa.scc.uid-range` annotation (1000980000/10000), which is
    # assigned when the namespace is created and stable for its lifetime. All
    # 6,183 files in the current Synology library are already owned by it.
    # COUPLING TO KNOW ABOUT: delete and recreate the immich namespace and
    # OpenShift may assign a different range, orphaning this ownership. Check
    # `oc get ns immich -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.uid-range}'`
    # before assuming this value still matches.
    owner_uid: 1000980000
    owner_gid: 1000980000
  - name: keepers
    recordsize: 1M
    comments: "keepers bulk download volume (RWX to the cluster). Per-app config/state stays on ceph-nvme-block."
    quota: 0
  - name: backup
    recordsize: 128K
    compression: ZSTD
    comments: "pg_dumps, Immich DB dump, configs, docs. OFFSITE = YES."
    quota: 0
  - name: apps
    recordsize: 128K
    comments: "On-pool tooling that must survive TrueNAS updates (NUT script, oc binary, kubeconfig). /root and /etc do NOT survive updates."
    quota: 0
  # ---- garage S3 (Velero BackupStorageLocation) -----------------------
  # Parent MUST be listed before its children: pool.dataset.create will not
  # create intermediate datasets, and this list is applied in order.
  # Separate datasets (not subdirectories) so each gets its own recordsize --
  # and so the app's host_path mountpoints exist without anyone mkdir-ing.
  - name: s3
    recordsize: 128K
    comments: "Parent for the garage S3 server (Velero BSL). Not exported over NFS."
    quota: 0
  - name: s3/config
    recordsize: 128K
    comments: "garage config. Tiny."
    quota: 0
  - name: s3/meta
    recordsize: 128K
    comments: "garage metadata DB. Small random IO."
    quota: 0
  - name: s3/data
    recordsize: 1M
    comments: "garage object blocks. garage's default block size is 1 MiB, so 1M matches."
    quota: 0

  # ---- SMB datasets for humans ---------------------------------------
  # THREE PROPERTIES BELOW ARE CREATE-TIME-ONLY AND CANNOT BE CHANGED LATER.
  #
  # `casesensitivity` above all: ZFS fixes it at create and there is no
  # `zfs set` for it, no rename-in-place, no workaround. Getting it wrong is
  # discovered months later by a Mac that cannot find a file it just wrote.
  # `truenas-storage` therefore ASSERTS these three and fails loudly on drift
  # rather than silently no-op-ing a reconcile it cannot perform. The only
  # remedy is destroy + recreate -- see destroy-empty-dataset.sh.
  #
  # WHY INSENSITIVE FOR SMB: macOS and Windows both treat paths as
  # case-insensitive. A case-SENSITIVE server backing a case-insensitive
  # client lets `Photo.jpg` and `photo.jpg` coexist on disk while the client
  # believes they are one file. TrueNAS's own preset for a pure-SMB dataset is
  # INSENSITIVE + NFSV4 + RESTRICTED, which is what these three encode
  # explicitly. Set as literal properties rather than via `share_type: SMB`
  # because a preset's expansion is version-dependent and invisible in git --
  # this way the review diff shows the actual values.
  #
  # AND WHY NOT EVERYWHERE: media/immich/keepers are NFS-mounted by Linux
  # clients that expect case-sensitive lookup, so SENSITIVE is correct there
  # and they are deliberately left alone.
  # ---- benchmark scratch ----------------------------------------------
  # Consumed ONLY by tests/storage-benchmark/. Exists so that benchmarking the
  # TrueNAS NFS path never writes into a production dataset: csi-driver-nfs
  # creates one subdirectory per PV inside the share, and every NFS class here
  # is Retain, so a benchmark against the media class would litter the live
  # library with pvc-<uuid> directories nobody ever cleans up.
  #
  # QUOTA IS THE POINT, not the recordsize. 200G bounds a runaway or mis-sized
  # run independently of whether anyone ran the harness correctly -- the
  # harness has its own capacity gate, but a backstop that depends on the tool
  # being used properly is not a backstop.
  #
  # recordsize 1M matches media/keepers so that a sequential result measured
  # here is comparable to those datasets rather than to a different layout.
  - name: bench
    recordsize: 1M
    comments: "Scratch dataset for tests/storage-benchmark. Safe to destroy when empty. No offsite, no snapshots."
    # 500 GiB, RAISED FROM 200 GiB on 2026-09-05 for a concrete reason:
    # defeating this box's ARC needs a file LARGER THAN ITS 31.3 GiB OF RAM, so
    # the harness sets min_filesize=64G here. A 3-client run therefore lays out
    # 3 x 64 GiB and the capacity gate wants 2x that = 384 GiB, which a 200 GiB
    # quota refuses. 200 GiB silently capped the benchmark at single-client.
    # (tank has ~8.9 TiB free, so this costs nothing.)
    quota: 536870912000             # 500 GiB
  - name: personal
    recordsize: 128K
    comments: "SMB share for humans (personal side of the personal/work split). Family photos land here; immich imports them over NFS later."
    quota: 0
    # DELIBERATELY LEFT SENSITIVE. This dataset is MULTIPROTOCOL: humans browse
    # it over SMB and immich will read it over NFS during the photo import.
    # TrueNAS's MULTIPROTOCOL/NFS presets both give SENSITIVE for exactly that
    # reason. `acltype` is the only thing that wants changing here, and acltype
    # IS updatable post-create -- so unlike timemachine there is no deadline.
  - name: work
    recordsize: 128K
    comments: "SMB share for humans (work side of the personal/work split)."
    quota: 0
    # ---- OPEN DECISION WITH A SILENT DEADLINE (2026-08-31) ----------------
    # Still empty (191.81 KiB, zero snapshots), so it can still be recreated
    # with any casesensitivity. Pure-SMB would want INSENSITIVE like
    # timemachine; multiprotocol would want SENSITIVE like personal. Nobody has
    # decided which, and no consumer exists yet, so it is deliberately left
    # as-is rather than guessed at.
    #
    # THE DEADLINE IS NOT A DATE, IT IS THE FIRST BYTE WRITTEN. ZFS emits no
    # warning at that moment and the property keeps reporting a valid value
    # forever after. Decide before anything mounts this.
  - name: timemachine
    # Parent container only -- the SHARES point at the two children below, so
    # no Mac ever mounts this path. It exists to hold the total ceiling and to
    # make INSENSITIVE the inherited default, so a future third Mac's dataset
    # is right by construction instead of right by remembering.
    recordsize: 1M
    casesensitivity: INSENSITIVE
    acltype: NFSV4
    aclmode: RESTRICTED
    comments: "Parent for per-Mac Time Machine targets. QUOTA IS MANDATORY - Time Machine expands to fill whatever it is shown."
    quota: 1610612736000            # 1500 GiB = the exact sum of the two children
  # ---- One dataset per Mac, each with its OWN quota ---------------------
  # NOT one share with `auto_dataset_creation`, which is the obvious-looking
  # option: auto-created child datasets inherit NO quota, so the first Mac to
  # run a large backup would consume the other's space and the second Mac's
  # failure would be indistinguishable from a network problem. Pre-creating
  # them is the only way each Mac gets a hard, independent ceiling.
  #
  # RECORDSIZE 1M, NOT THE 128K DEFAULT: Time Machine over SMB writes a
  # sparsebundle whose payload is 8 MiB band files. At 1M that is 8 records per
  # band with no read-modify-write on a full-band write; at 128K it is 64
  # records and 8x the indirect-block metadata, on a 6-wide RAIDZ2 of spinning
  # disks. A backup target is bulk-sequential-write shaped, which is exactly
  # what large records suit. (recordsize IS updatable, but it applies to NEW
  # WRITES ONLY -- so it has to be right before the first backup, not before
  # the first byte. Hence: now.)
  #
  # The quota split is the operator's call, not a derived number: 1000 GiB for
  # the Mac mini (the primary machine, stays), 500 GiB for the MacBook Air.
  - name: timemachine/macmini
    recordsize: 1M
    casesensitivity: INSENSITIVE
    acltype: NFSV4
    aclmode: RESTRICTED
    comments: "Time Machine target for the Mac mini."
    quota: 1073741824000            # 1000 GiB
    # NO owner_uid HERE, deliberately -- unlike tank/immich. That dataset is
    # POSIX-mode, where a numeric chown IS the access control. These two are
    # acltype=NFSV4 + aclmode=RESTRICTED, where the ACL is, and a bare chown
    # would leave the inherited ACL untouched while looking like it had worked.
    # `truenas-smb` sets owner AND ACL in one `filesystem.setacl` call so there
    # is exactly one owner of this concern. See truenas_smb_users[].dataset.
  - name: timemachine/mba
    recordsize: 1M
    casesensitivity: INSENSITIVE
    acltype: NFSV4
    aclmode: RESTRICTED
    comments: "Time Machine target for the MacBook Air."
    quota: 536870912000             # 500 GiB
    # NO owner_uid HERE, deliberately -- unlike tank/immich. That dataset is
    # POSIX-mode, where a numeric chown IS the access control. These two are
    # acltype=NFSV4 + aclmode=RESTRICTED, where the ACL is, and a bare chown
    # would leave the inherited ACL untouched while looking like it had worked.
    # `truenas-smb` sets owner AND ACL in one `filesystem.setacl` call so there
    # is exactly one owner of this concern. See truenas_smb_users[].dataset.

# ---- NFS exports ----------------------------------------------------------
# Restricted to the three OKD node addresses on the CEPH BACKNET (VLAN 10).
# The nodes already hold .2/.3/.4 on enp1s0f0np0, so the mount is on-link and
# needs NO NNCP change — which is what makes this design avoid the
# br-ex.forwarding cascade entirely. See the blog draft for the full reasoning.
truenas_nfs_clients:
  - 192.168.10.2                    # node4
  - 192.168.10.3                    # node5
  - 192.168.10.4                    # node6

# KNOWN GAP: no maproot/mapall set yet. The two current NFS consumers write with
# different UID shapes -- Immich under OpenShift's injected random namespace UID,
# the servarr apps as PUID/PGID 0 -- and both work against the DSM export today.
# Reproducing both against TrueNAS needs deliberate maproot/mapall plus dataset
# ACLs, which depends on users/groups converging first (the middleware resolves
# maproot via user.get_user_obj at validation time). Users are out of scope for
# now, so these exports ship WITHOUT mapping and each write shape must be tested
# before a cutover window, not inside one.
truenas_nfs_exports:
  - dataset: media
  - dataset: immich
  - dataset: keepers
  # Benchmark scratch. Same maproot default as the others: the harness Jobs run
  # as root in the ceph image, so a squashed export would make every run fail
  # at first write rather than measure anything.
  - dataset: bench

# ---- SMB (Time Machine) ---------------------------------------------------
# The whole SMB stack was greenfield as of 2026-08-31: cifs STOPPED and
# disabled, zero shares, zero non-builtin SMB users, aapl_extensions off.
#
# ORDER IS LOAD-BEARING in truenas-smb and it is not obvious from the outside:
# `sharing.smb.create` with `purpose: TIMEMACHINE_SHARE` is REJECTED unless
# global `aapl_extensions` is already true. The middleware says so in its own
# schema ("NOTE: `aapl_extensions` must be set in the global `smb.config`"),
# so the global flag has to be converged before any share is attempted.
truenas_smb_aapl_extensions: true

# TrueNAS 25.10 replaced the old per-share feature booleans (`timemachine:
# true`, `vfsobjects`, ...) with a single `purpose` enum plus a discriminated
# `options` object. Anything written for 24.x or earlier will not apply here --
# the field simply does not exist any more. Verified against this box's own
# `core.get_methods` output, not against documentation.
truenas_smb_shares:
  - name: macmini-tm
    dataset: timemachine/macmini
    purpose: TIMEMACHINE_SHARE
    comment: "Time Machine target for the Mac mini (managed by ansible/truenas)"
    # PINNED, NOT GENERATED. `vuid` is the Time Machine volume UUID TrueNAS
    # puts in its mDNS advertisement, and macOS uses it to recognise a volume
    # as the one it has been backing up to. Passing null makes the middleware
    # MINT A NEW ONE ON EVERY WRITE -- so a null here would hand the Mac a
    # different volume identity after any future playbook run and invite
    # "Time Machine must create a new backup". A literal UUID is stable,
    # reviewable, and not a secret.
    vuid: "5f6d1c2a-3b4e-4d18-9a70-1c8e2f6b4a11"
  - name: mba-tm
    dataset: timemachine/mba
    purpose: TIMEMACHINE_SHARE
    comment: "Time Machine target for the MacBook Air (managed by ansible/truenas)"
    vuid: "9c3a7e40-5d21-4f6b-8e12-77b4d05a3c29"

# Applied to every TIMEMACHINE_SHARE. Both defaults are deliberate:
#
# timemachine_quota: 0 -- the ZFS per-dataset quota IS the enforcement, and it
#   is the honest one. The SMB-level value only lies to the client about the
#   disk size; the middleware's own note says modern macOS sets its quota
#   client-side anyway. Two ceilings that can disagree is worse than one.
#
# auto_snapshot: false -- snapshotting on every completed backup sounds free
#   and is not: each snapshot pins the 8 MiB bands that backup rewrote, against
#   a hard quota, and Time Machine ALREADY keeps its own version history. The
#   failure mode is a quota that fills with snapshots of a backup tool's own
#   versioning. Deliberate no.
#
# auto_dataset_creation: false -- children are pre-created with quotas above.
truenas_smb_timemachine_options:
  timemachine_quota: 0
  auto_snapshot: false
  auto_dataset_creation: false

# One SMB identity per Mac, not one shared account. Each Mac can then only
# reach its own dataset, so neither can read the other's backups and a
# credential rotation on one does not touch the other.
#
# UIDs/GIDs are PINNED so the dataset ACLs above (owner_uid 3001/3002) keep
# meaning what they say. Left unpinned, the middleware allocates the next free
# id and a rebuild in a different order silently rebinds the ACLs.
#
# PASSWORDS LIVE IN THE VAULT, and these tasks are SKIPPED when it is absent --
# same shape as the SMTP vars. That keeps `ansible-playbook playbook.yml`
# runnable with no interactive prompt for every non-secret change, which is the
# property that makes this topic routinely runnable at all.
truenas_smb_users:
  - username: tm-macmini
    uid: 3001
    gid: 3001
    full_name: "Time Machine - Mac mini"
    dataset: timemachine/macmini
    password_var: truenas_smb_password_macmini
  - username: tm-mba
    uid: 3002
    gid: 3002
    full_name: "Time Machine - MacBook Air"
    dataset: timemachine/mba
    password_var: truenas_smb_password_mba

# ---- System ---------------------------------------------------------------
truenas_hostname: truenas
truenas_domain: homelab.sudops.pl
truenas_timezone: Europe/Warsaw

# NTP as IPs, never hostnames. Direct lesson from the 2026-07-25 DNS outage:
# a box whose clock is wrong cannot validate DNSSEC, and a box that needs DNS
# to find its time source cannot recover on its own. Same list as dns-master.
truenas_ntp_servers:
  - 192.168.1.1                     # MikroTik CCR2004
  - 194.146.251.100                 # tempus1.gum.gov.pl
  - 162.159.200.123                 # time.cloudflare.com (anycast, independent operator)

# ---- garage S3 (Velero BackupStorageLocation) ------------------------------
# Bound to 0.0.0.0, NOT the backnet only. This was 192.168.10.10 until
# 2026-08-28, when the Velero BSL failed with `dial tcp 192.168.10.10:30188:
# i/o timeout` and a 90 s socket watch on the NAS saw ZERO inbound SYNs.
#
# Root cause: **pod-network -> storage-backnet egress does not work on this
# cluster, and never has.** Everything that touches 192.168.10.0/24 today does
# so from the HOST stack -- Ceph runs `network.provider: host`, and both
# csi-nfs-node and csi-nfs-controller are `hostNetwork: true`. Velero is the
# first POD-network client to try, and its packets never leave for the backnet.
#
# `app.ip_choices` offers only {0.0.0.0, ::, 192.168.10.10} -- the mgmt address
# is not individually bindable -- so 0.0.0.0 is the only way to also listen on
# 192.168.1.25, which IS a proven pod-egress path (synology-cert-sync reaches
# 192.168.1.2 nightly from a pod).
#
# ACCEPTED COST: garage is now reachable on the frontnet LAN as well. It is
# authenticated by S3 key and holds only backup staging, so this is acceptable
# -- but it is a real widening, so do not extend it further without revisiting.
# NOTE the data path is unaffected: NFS is kernel-mounted by hostNetwork CSI
# pods, so media traffic still rides the 10G backnet. Only Velero's S3 client
# takes the 1G frontnet. Nothing here is secret: admin_token, rpc_secret
# and web_ui_password are generated ON the box at create time and never leave it.
truenas_garage:
  app_name: garage
  train: community
  version: "1.2.5"          # the only version the catalog offers today
  region: garage
  replication_factor: 1     # single node; this is a backup target, not a cluster
  web_ui_username: admin
  run_as_uid: 568           # the TrueNAS apps account
  run_as_gid: 568
  cpus: 2
  memory_mb: 4096
  bind_ip: 0.0.0.0
  # Address the CLUSTER uses to reach garage (pod-network path -> frontnet).
  s3_client_ip: 192.168.1.25
  ports:
    web: 30186
    rpc: 30187
    s3: 30188
    s3_web: 30189
    admin: 30190
  zone: truenas
  capacity_bytes: 8000000000000     # 8 TB advertised; ~7.3 TiB effective at replication_factor 1
  s3_key_name: velero
  s3_bucket: velero
  paths:
    config: /mnt/tank/s3/config
    metadata: /mnt/tank/s3/meta
    data: /mnt/tank/s3/data

# ---- Data protection ------------------------------------------------------
truenas_scrub_day_of_month: "1"     # monthly
truenas_scrub_threshold: 35         # days; skip a scheduled scrub if scrubbed more recently
truenas_scrub_description: "Monthly scrub (managed by ansible/truenas)"
# NOTE: pool.create makes its OWN scrub task (weekly Sun 00:00, empty description).
# truenas-tasks RECONCILES it to this rather than skipping, or the declaration
# below would never take effect. Keep fields unpadded; the role normalizes.
truenas_scrub_schedule:
  minute: "0"
  hour: "3"
  dom: "{{ truenas_scrub_day_of_month }}"
  month: "*"
  dow: "*"
truenas_smart_short_cron:  "0 3 * * 0"   # weekly, Sunday 03:00
truenas_smart_long_cron:   "0 4 1 * *"   # monthly, 1st 04:00
truenas_smart_health_cron: "0 7 * * *"   # daily 07:00 -- reads results, emails only on trouble

# TrueNAS 25.10 "Goldeye" REMOVED smartd, the smart.* API and the SMART test
# scheduler (verified on 25.10.6). smartmontools is still installed, and
# upstream's own upgrade path converts existing SMART schedules into cron
# tasks -- so cron is the sanctioned replacement, not a workaround.
#
# `description` is the idempotency key (middleware identity is an integer id).
# Editing a description creates a SECOND job rather than updating the first.
#
# Commands deliberately contain NO single quotes: they are single-quoted YAML
# scalars that get JSON-encoded into a midclt argv. `cut -d" " -f1` instead of
# `awk "{print $1}"` keeps that true.
truenas_smart_cronjobs:
  - description: "SMART short test, all disks (managed by ansible/truenas)"
    cron: "{{ truenas_smart_short_cron }}"
    hide_stdout: true
    command: 'for d in $(smartctl --scan | cut -d" " -f1); do smartctl -t short "$d"; done'

  - description: "SMART long test, all disks (managed by ansible/truenas)"
    cron: "{{ truenas_smart_long_cron }}"
    hide_stdout: true
    command: 'for d in $(smartctl --scan | cut -d" " -f1); do smartctl -t long "$d"; done'

  # `smartctl -t` only STARTS a test; the result lands hours later. Without
  # smartd nothing ever reads it, so this job is the part that actually closes
  # the monitoring gap. Silent when healthy -- TrueNAS only mails a cron job
  # whose stdout is non-empty, so no output means no mail.
  #
  # Exit status is a bitmask. We alert on 8 (disk failing now), 16 (prefail
  # attribute below threshold now) and 128 (a self-test logged an error) = 152.
  # Deliberately EXCLUDED: 32 ("attribute was below threshold in the past") and
  # 64 ("errors present in the ATA error log") -- on 43k-hour datacenter pulls
  # both are likely set from a previous life and would mail every single day
  # forever, which trains you to ignore the one mail that matters.
  - description: "SMART health report, mail on trouble only (managed by ansible/truenas)"
    cron: "{{ truenas_smart_health_cron }}"
    hide_stdout: false
    command: 'for d in $(smartctl --scan | cut -d" " -f1); do smartctl -H -l selftest "$d" >/dev/null 2>&1; rc=$?; [ $((rc & 152)) -ne 0 ] && echo "SMART ALERT $d rc=$rc"; done; true'

# Snapshot retention, per dataset. media is deliberately minimal (re-downloadable);
# backup is frequent (it is the tree that matters).
truenas_snapshot_tasks:
  - dataset: media
    recursive: true
    lifetime_value: 14
    lifetime_unit: DAY
    schedule: { minute: "0", hour: "2", dom: "*", month: "*", dow: "*" }
  - dataset: immich
    recursive: true
    lifetime_value: 30
    lifetime_unit: DAY
    schedule: { minute: "0", hour: "2", dom: "*", month: "*", dow: "*" }
  - dataset: backup
    recursive: true
    lifetime_value: 90
    lifetime_unit: DAY
    schedule: { minute: "0", hour: "*/6", dom: "*", month: "*", dow: "*" }
