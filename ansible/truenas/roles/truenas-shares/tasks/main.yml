---
# ---------------------------------------------------------------------------
# truenas-shares — NFS exports for the OKD cluster
# ---------------------------------------------------------------------------
# NFS shares are a COLLECTION whose identity is an integer `id` assigned by the
# middleware. There is NO natural key, so nothing structurally prevents creating
# a duplicate export for the same path -- a blind re-run would happily stack
# them. Everything below therefore matches on the export PATH, which we treat
# as the natural key, and creates only when absent.
#
# SMB shares for humans (personal/work/timemachine) are deliberately NOT here
# yet -- they need SMB users, groups and dataset ACLs, which is its own decision
# set. Declared out of scope in README.md rather than half-done.
# ---------------------------------------------------------------------------

- name: Query existing NFS shares
  ansible.builtin.command:
    argv: [midclt, call, sharing.nfs.query]
  register: truenas_nfs_q
  changed_when: false
  check_mode: false

- name: Index existing NFS exports by path
  ansible.builtin.set_fact:
    truenas_nfs_paths: "{{ truenas_nfs_q.stdout | from_json | map(attribute='path') | list }}"

- name: Create missing NFS exports
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - sharing.nfs.create
      - "{{ _nfs_payload | to_json }}"
  vars:
    _nfs_payload:
      path: "/mnt/{{ truenas_pool }}/{{ item.dataset }}"
      comment: "{{ item.dataset }} -> OKD cluster (managed by ansible/truenas)"
      # Restricted to the three node backnet addresses. An unrestricted export
      # on a segment that also carries Ceph replication is not acceptable.
      hosts: "{{ truenas_nfs_clients }}"
      # maproot_user REQUIRED -- do not "harden" this to squash root.
      #
      # Two independent reasons, both verified on this cluster 2026-08-28:
      #  1. csi-driver-nfs provisions by mounting the share and creating one
      #     SUBDIRECTORY per PV, as root. Under the default root squash (root ->
      #     nobody) every CreateVolume fails with permission denied.
      #  2. media/jellyfin runs `runAsUser: 0` outright, so its writes arrive as
      #     uid 0. Squashed, the whole media library becomes unwritable.
      # The export is already restricted to the three node backnet IPs, which is
      # where the actual access control lives.
      maproot_user: "{{ item.maproot_user | default('root') }}"
      maproot_group: "{{ item.maproot_group | default('root') }}"
      enabled: true
  loop: "{{ truenas_nfs_exports }}"
  loop_control:
    label: "/mnt/{{ truenas_pool }}/{{ item.dataset }}"
  when: ("/mnt/" ~ truenas_pool ~ "/" ~ item.dataset) not in truenas_nfs_paths

# Existing exports need reconciling too: the three created on 2026-08-28 predate
# the maproot fix above, and create-if-missing would leave them squashed forever
# -- the same "declared but never applied" trap as the auto-created scrub task.
- name: Reconcile maproot on existing NFS exports
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - sharing.nfs.update
      - "{{ (_live_share.id) | string }}"
      - "{{ {'maproot_user': _want_root, 'maproot_group': _want_group} | to_json }}"
  vars:
    _path: "/mnt/{{ truenas_pool }}/{{ item.dataset }}"
    _want_root: "{{ item.maproot_user | default('root') }}"
    _want_group: "{{ item.maproot_group | default('root') }}"
    _live_share: "{{ (truenas_nfs_q.stdout | from_json | selectattr('path', 'equalto', _path) | list | first) | default({}, true) }}"
  loop: "{{ truenas_nfs_exports }}"
  loop_control:
    label: "/mnt/{{ truenas_pool }}/{{ item.dataset }}"
  when:
    - _live_share | length > 0
    - (_live_share.maproot_user | default(none)) != _want_root
      or (_live_share.maproot_group | default(none)) != _want_group

# Share writes trigger an NFS *reload*, not a restart, so re-asserting an export
# does not drop live client mounts. That is what makes this role safe to run
# against a NAS the cluster is actively mounting.

- name: Query NFS service state
  ansible.builtin.command:
    argv: [midclt, call, service.query, '[["service","=","nfs"]]']
  register: truenas_nfs_state
  changed_when: false
  check_mode: false

# Queried first rather than blind-updated so a converged box reports ok, not
# changed. `service.update` returns the record id regardless of whether anything
# moved, so an unconditional call plus changed_when:false would be quietly
# dishonest -- it would report ok even when it HAD changed something.
- name: Enable the NFS service at boot
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - service.update
      - nfs
      - '{"enable": true}'
  when: not (truenas_nfs_state.stdout | from_json | first).enable

- name: Start the NFS service if it is not running
  ansible.builtin.command:
    argv: [midclt, call, service.start, nfs]
  when: (truenas_nfs_state.stdout | from_json | first).state != "RUNNING"
