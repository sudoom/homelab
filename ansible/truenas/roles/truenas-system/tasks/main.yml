---
# ---------------------------------------------------------------------------
# truenas-system — hostname, timezone, NTP, alert email
# ---------------------------------------------------------------------------
# Mostly SINGLETONS (<ns>.config + <ns>.update), which are naturally idempotent:
# the middleware applies a partial patch and returns the merged config, so
# re-asserting the same values is a genuine no-op. NTP servers are the one
# collection here.
#
# NOT IN SCOPE, deliberately:
#   * Network interfaces / IP / MTU. Automating the network config of a box you
#     reach OVER that network is how you lock yourself out, and TrueNAS's
#     commit-then-confirm rollback does not survive an Ansible run that has
#     already dropped its connection. Manual, documented in README.md.
#   * SSH root-login disable / 2FA. 25.10 already ships root login disabled and
#     an admin account; re-asserting it risks locking out the very account this
#     playbook connects as. Verified in check.yml instead of enforced here.
# ---------------------------------------------------------------------------

- name: Read current system general config
  ansible.builtin.command:
    argv: [midclt, call, system.general.config]
  register: truenas_sysgen
  changed_when: false
  check_mode: false

- name: Set timezone
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - system.general.update
      - "{{ {'timezone': truenas_timezone} | to_json }}"
  when: (truenas_sysgen.stdout | from_json).timezone != truenas_timezone

# Clock correctness is not cosmetic here. Scrub schedules, snapshot retention
# and every log timestamp depend on it -- and this homelab has already had one
# NTP-rooted outage (2026-07-25): dns-master's clock drifted, DNSSEC signatures
# fell outside their validity window, and DNS deadlocked. NTP servers are IPs,
# never hostnames, so time resolution can never depend on name resolution.
- name: Query configured NTP servers
  ansible.builtin.command:
    argv: [midclt, call, system.ntpserver.query]
  register: truenas_ntp_q
  changed_when: false
  check_mode: false

- name: Index NTP servers by address
  ansible.builtin.set_fact:
    truenas_ntp_current: "{{ truenas_ntp_q.stdout | from_json | map(attribute='address') | list }}"

- name: Add missing NTP servers
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - system.ntpserver.create
      - "{{ {'address': item, 'burst': false, 'iburst': true, 'prefer': false, 'force': true} | to_json }}"
  loop: "{{ truenas_ntp_servers }}"
  when: item not in truenas_ntp_current

# The setup runbook's golden rule 5: a drive-failure email you never configured
# is worthless. On a wear-matched 5-year drive cohort this is the highest-value
# task in the whole topic -- it is the difference between "one drive failed" and
# "two drives failed and nobody noticed until the second one".
- name: Read current mail config
  ansible.builtin.command:
    argv: [midclt, call, mail.config]
  register: truenas_mail
  changed_when: false
  check_mode: false

# TRUENAS SENDS ALERTS TO A USER'S EMAIL ATTRIBUTE, NOT TO ANYTHING IN
# mail.config. There is no "alert recipient" field: the destination is whatever
# addresses the local administrator accounts carry. Configure SMTP perfectly and
# the UI still refuses with "No e-mail address is set for root user or any other
# local administrator" (observed 2026-09-07).
#
# `truenas_alert_to` existed in vars/vault.yml.example from the start and was
# consumed NOWHERE -- a variable that read like configuration and was pure
# documentation. Same "declared but never applied" family as the SMTP guard
# below and the SMB passwords the sibling role reports per-account for.
- name: Read alert-recipient users
  ansible.builtin.command:
    argv: [midclt, call, user.query, '[["username","in",{{ truenas_alert_users | default(["root"]) | to_json }}]]']
  register: truenas_alert_users_q
  changed_when: false
  check_mode: false
  when: truenas_alert_to is defined

- name: Set the alert recipient address on the administrator accounts
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - user.update
      - "{{ item.id | string }}"
      - "{{ {'email': truenas_alert_to} | to_json }}"
  loop: "{{ (truenas_alert_users_q.stdout | default('[]') | from_json) }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - truenas_alert_to is defined
    - item.email != truenas_alert_to
  no_log: true

# FROM ADDRESS IS NOT THE SMTP USERNAME. This used to send
# `fromemail: {{ truenas_smtp_user }}`, which is correct only for providers
# where the username IS an email address. On Mailjet the username is an API key
# (a 32-hex string), so fromemail would have been set to that key, and Mailjet
# rejects mail from an unvalidated sender SILENTLY -- the playbook converges,
# the config looks right, and no alert ever arrives. `truenas_smtp_from` is
# separate and falls back to the username so existing setups are unchanged.
- name: Configure alert email
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - mail.update
      - "{{ _mail | to_json }}"
  vars:
    _mail:
      fromemail: "{{ truenas_smtp_from | default(truenas_smtp_user) }}"
      fromname: "{{ truenas_smtp_fromname | default('TrueNAS ' ~ inventory_hostname) }}"
      outgoingserver: "{{ truenas_smtp_server }}"
      port: "{{ truenas_smtp_port | int }}"
      security: "{{ truenas_smtp_security }}"
      smtp: true
      user: "{{ truenas_smtp_user }}"
      pass: "{{ truenas_smtp_password }}"
  # RECONCILES ON EVERY FIELD IT SETS, not just the server. The previous guard
  # compared `outgoingserver` alone, so changing the port, the security mode,
  # the username or the from address would have been declared in the vault and
  # never applied -- the same "declared but never applied" trap the SMB role
  # reports per-account for. `pass` is deliberately excluded: mail.config does
  # not return it, so it cannot be compared and would force a change every run.
  when:
    - truenas_smtp_server is defined
    - >-
      [(truenas_mail.stdout | from_json).outgoingserver,
       (truenas_mail.stdout | from_json).port | int,
       (truenas_mail.stdout | from_json).security,
       (truenas_mail.stdout | from_json).user,
       (truenas_mail.stdout | from_json).fromemail,
       (truenas_mail.stdout | from_json).smtp]
      !=
      [truenas_smtp_server,
       truenas_smtp_port | int,
       truenas_smtp_security,
       truenas_smtp_user,
       truenas_smtp_from | default(truenas_smtp_user),
       true]
  no_log: true
