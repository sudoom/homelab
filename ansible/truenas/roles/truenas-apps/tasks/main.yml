---
# ---------------------------------------------------------------------------
# truenas-apps — the garage S3 server that backs the Velero BackupStorageLocation
#
# WHY AN S3 SERVER ON THE NAS AT ALL: Velero file-system backup writes to object
# storage and nothing else ("Velero FSB supports object storage as the backup
# storage only" -- velero.io). The cluster's only S3 today is Ceph RGW, whose
# data pool is replicated x3 on the same three HDD OSDs a migration would be
# draining -- backing up the 3.21 TiB media PVC there needs 9.63 TiB raw against
# 6.66 TiB available. It does not fit. A BSL on the NAS moves backup data off
# Ceph entirely, which is also what the 2026-06-08 incident asked for (the daily
# Schedule snapshotted Loki's WAL PVCs into the Ceph it was protecting and took
# the cluster to 97% full; the Schedule has been `paused: true` ever since).
#
# WHY garage AND NOT seaweedfs: seaweedfs is in the supported stable train but
# deploys master+volume+filer+admin+worker across ~14 ports and five storage
# volumes, and exposes no S3 config in its schema at all. garage is a single
# binary with replication_factor 1, three storage paths and one S3 port. For a
# rebuild-in-minutes backup target, less surface wins.
# ---------------------------------------------------------------------------

# PREREQUISITE: TrueNAS apps run on Docker, and Docker needs a pool assigned
# before ANY app.create will work -- a fresh install has `pool: null` and every
# deploy fails with "[EFAULT] No pool configured for Docker". Assigning it
# creates the `ix-apps` dataset on that pool.
#
# NOTE on Docker's default address_pools (172.17.0.0/12): that range covers
# 172.16-172.31, which OVERLAPS the cluster's 172.30.0.0/16 service CIDR. It is
# harmless here because traffic is one-way -- the nodes reach TrueNAS at
# 192.168.10.10 and nothing on TrueNAS dials a cluster ClusterIP -- but do not
# "fix" connectivity later by bridging the two without revisiting this.
- name: Read the Docker/apps pool config
  ansible.builtin.command:
    argv: [midclt, call, docker.config]
  register: truenas_docker_cfg
  changed_when: false
  check_mode: false

- name: Assign the apps pool (one-time; every app.create fails without it)
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - docker.update
      - "{{ {'pool': truenas_pool} | to_json }}"
  when: (truenas_docker_cfg.stdout | from_json).pool != truenas_pool

- name: Query installed apps
  ansible.builtin.command:
    argv: [midclt, call, app.query]
  register: truenas_app_q
  changed_when: false
  check_mode: false

- name: Index apps by name
  ansible.builtin.set_fact:
    truenas_app_names: "{{ truenas_app_q.stdout | from_json | map(attribute='name') | list }}"

# garage runs as uid/gid 568 (the apps account) but a freshly created dataset is
# root:root 0755, so the container cannot write. Checked per path and chowned
# only when it is actually wrong, so this stays idempotent.
- name: Stat the garage storage paths
  ansible.builtin.command:
    argv: [midclt, call, filesystem.stat, "{{ item.value }}"]
  register: truenas_garage_stat
  changed_when: false
  check_mode: false
  loop: "{{ truenas_garage.paths | dict2items }}"
  loop_control:
    label: "{{ item.value }}"

- name: Chown the garage storage paths to the apps account
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - filesystem.chown
      - "{{ {'path': item.item.value, 'uid': truenas_garage.run_as_uid, 'gid': truenas_garage.run_as_gid, 'options': {'recursive': true, 'traverse': false}} | to_json }}"
  loop: "{{ truenas_garage_stat.results }}"
  loop_control:
    label: "{{ item.item.value }}"
  when: (item.stdout | from_json).uid != truenas_garage.run_as_uid

# Secrets are generated ON THE BOX and never leave it: no vault entry, nothing in
# git. They are only needed at create time -- on a re-run the app already exists,
# this task is skipped, and the live values are left untouched.
- name: Generate garage secrets (only when the app is absent)
  ansible.builtin.command:
    argv: [openssl, rand, -hex, "32"]
  register: truenas_garage_secrets
  changed_when: false
  loop: [admin_token, rpc_secret, web_ui_password]
  loop_control:
    label: "{{ item }}"
  when: truenas_garage.app_name not in truenas_app_names
  no_log: true

- name: Deploy the garage S3 app
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job          # app.create IS a job method -- without this the call returns
      - app.create     # a job id immediately and any check after it races the deploy
      - "{{ _app | to_json }}"
  vars:
    _sec: "{{ truenas_garage_secrets.results | default([]) | map(attribute='stdout') | list }}"
    _port: "{{ truenas_garage.ports }}"
    _bind: "{{ [truenas_garage.bind_ip] }}"
    _app:
      app_name: "{{ truenas_garage.app_name }}"
      catalog_app: garage
      train: "{{ truenas_garage.train }}"
      version: "{{ truenas_garage.version }}"
      values:
        TZ: "{{ truenas_timezone }}"
        garage:
          admin_token: "{{ _sec[0] | default('') }}"
          rpc_secret: "{{ _sec[1] | default('') }}"
          web_ui_password: "{{ _sec[2] | default('') }}"
          web_ui_username: "{{ truenas_garage.web_ui_username }}"
          enable_web_ui_auth: true
          region: "{{ truenas_garage.region }}"
          replication_factor: "{{ truenas_garage.replication_factor | int }}"
        run_as:
          user: "{{ truenas_garage.run_as_uid | int }}"
          group: "{{ truenas_garage.run_as_gid | int }}"
        network:
          web_port: { bind_mode: published, port_number: "{{ _port.web | int }}", host_ips: "{{ _bind }}" }
          rpc_port: { bind_mode: published, port_number: "{{ _port.rpc | int }}", host_ips: "{{ _bind }}" }
          s3_port: { bind_mode: published, port_number: "{{ _port.s3 | int }}", host_ips: "{{ _bind }}" }
          s3_web_port: { bind_mode: published, port_number: "{{ _port.s3_web | int }}", host_ips: "{{ _bind }}" }
          admin_port: { bind_mode: published, port_number: "{{ _port.admin | int }}", host_ips: "{{ _bind }}" }
        storage:
          config: { type: host_path, host_path_config: { path: "{{ truenas_garage.paths.config }}" } }
          metadata: { type: host_path, host_path_config: { path: "{{ truenas_garage.paths.metadata }}" } }
          data: { type: host_path, host_path_config: { path: "{{ truenas_garage.paths.data }}" } }
        resources:
          limits:
            cpus: "{{ truenas_garage.cpus | int }}"
            memory: "{{ truenas_garage.memory_mb | int }}"
  when: truenas_garage.app_name not in truenas_app_names
  no_log: true       # the payload carries the generated secrets
  register: truenas_garage_deploy
  failed_when: false

# no_log hides the FAILURE as well as the payload, which on the first run meant
# an opaque "Module failed" and a round trip to dig the reason out by hand. The
# job record carries the real error without exposing the arguments, so surface
# that instead of leaving the operator blind.
- name: Read the app.create job record if the deploy failed
  ansible.builtin.command:
    argv: [midclt, call, core.get_jobs, '[["method", "=", "app.create"]]']
  register: truenas_garage_job
  changed_when: false
  when: (truenas_garage_deploy.rc | default(0)) != 0

- name: Fail with the real reason (payload stays hidden)
  ansible.builtin.fail:
    msg: "app.create failed: {{ (truenas_garage_job.stdout | from_json | sort(attribute='id') | last).error | default('no job record found') }}"
  when: (truenas_garage_deploy.rc | default(0)) != 0

- name: Report garage app state
  ansible.builtin.debug:
    msg: "garage {{ 'already present' if truenas_garage.app_name in truenas_app_names else 'DEPLOYED — bootstrap (layout/key/bucket) is the next step' }}"

# ---------------------------------------------------------------------------
# garage bootstrap — layout, key, bucket.
#
# A freshly deployed garage is RUNNING but useless: layoutVersion 0, no node
# role, /health returns 503. It needs a one-time layout assign+apply before it
# will serve S3 at all. Doing that by hand would leave the single most important
# part of this component outside git, so it is converged here like everything
# else. `ansible.builtin.uri` runs ON the TrueNAS host, which is how it reaches
# the backnet-bound admin port.
#
# API is v2 (garage 2.x) — verified by probe: /v2/GetClusterStatus returns 200
# while /v1/status, /v0/status and /status all return 400.
# ---------------------------------------------------------------------------

# The deploy task above only CREATES. Port bindings are the one field that has
# had to change post-deploy (backnet-only -> 0.0.0.0, see group_vars), and a
# create-only role would silently leave the live app on the old binding -- the
# same "declared but never applied" trap as the auto-created scrub task.
- name: Read the current garage app config
  ansible.builtin.command:
    argv: [midclt, call, app.config, "{{ truenas_garage.app_name }}"]
  register: truenas_garage_live
  changed_when: false
  check_mode: false
  no_log: true

- name: Reconcile the garage port bindings
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.update
      - "{{ truenas_garage.app_name }}"
      - "{{ {'values': {'network': _net}} | to_json }}"
  vars:
    # host_ips [] means "all interfaces" -- that is the schema default and the
    # only way to also listen on the mgmt address, which app.ip_choices does not
    # offer individually.
    _want_ips: "{{ [] if truenas_garage.bind_ip == '0.0.0.0' else [truenas_garage.bind_ip] }}"
    _net:
      web_port: { bind_mode: published, port_number: "{{ truenas_garage.ports.web | int }}", host_ips: "{{ _want_ips }}" }
      rpc_port: { bind_mode: published, port_number: "{{ truenas_garage.ports.rpc | int }}", host_ips: "{{ _want_ips }}" }
      s3_port: { bind_mode: published, port_number: "{{ truenas_garage.ports.s3 | int }}", host_ips: "{{ _want_ips }}" }
      s3_web_port: { bind_mode: published, port_number: "{{ truenas_garage.ports.s3_web | int }}", host_ips: "{{ _want_ips }}" }
      admin_port: { bind_mode: published, port_number: "{{ truenas_garage.ports.admin | int }}", host_ips: "{{ _want_ips }}" }
  when: >-
    ((truenas_garage_live.stdout | from_json).network.s3_port.host_ips | default([]))
    != ([] if truenas_garage.bind_ip == '0.0.0.0' else [truenas_garage.bind_ip])
  no_log: true

- name: Read the garage admin token
  ansible.builtin.command:
    argv: [midclt, call, app.config, "{{ truenas_garage.app_name }}"]
  register: truenas_garage_cfg
  changed_when: false
  check_mode: false
  no_log: true

- name: Set the garage admin API facts
  ansible.builtin.set_fact:
    _garage_api: "http://{{ truenas_garage.bind_ip }}:{{ truenas_garage.ports.admin }}"
    _garage_hdr:
      Authorization: "Bearer {{ (truenas_garage_cfg.stdout | from_json).garage.admin_token }}"
  no_log: true

- name: Read the garage cluster status
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/GetClusterStatus"
    headers: "{{ _garage_hdr }}"
    return_content: true
  register: truenas_garage_status
  retries: 12
  delay: 5
  until: truenas_garage_status.status == 200
  no_log: true

- name: Stage the cluster layout (only while unassigned)
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/UpdateClusterLayout"
    method: POST
    headers: "{{ _garage_hdr }}"
    body_format: json
    body:
      roles:
        - id: "{{ truenas_garage_status.json.nodes[0].id }}"
          zone: "{{ truenas_garage.zone }}"
          capacity: "{{ truenas_garage.capacity_bytes | int }}"
          tags: []
  when: (truenas_garage_status.json.layoutVersion | int) == 0
  no_log: true

- name: Apply the cluster layout
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/ApplyClusterLayout"
    method: POST
    headers: "{{ _garage_hdr }}"
    body_format: json
    body:
      version: "{{ (truenas_garage_status.json.layoutVersion | int) + 1 }}"
  when: (truenas_garage_status.json.layoutVersion | int) == 0
  no_log: true

- name: List garage access keys
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/ListKeys"
    headers: "{{ _garage_hdr }}"
  register: truenas_garage_keys
  no_log: true

# The response carries secretAccessKey, hence no_log. The secret is never
# persisted here -- garage keeps it and it can be re-read on demand with
# GetKeyInfo?showSecretKey=true when the cluster-side SealedSecret is minted.
- name: Create missing garage access keys
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/CreateKey"
    method: POST
    headers: "{{ _garage_hdr }}"
    body_format: json
    body: { name: "{{ item.key }}" }
  loop: "{{ truenas_garage.s3_tenants }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key not in (truenas_garage_keys.json | map(attribute='name') | list)
  no_log: true

- name: List garage buckets
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/ListBuckets"
    headers: "{{ _garage_hdr }}"
  register: truenas_garage_buckets
  no_log: true

- name: Create missing garage buckets
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/CreateBucket"
    method: POST
    headers: "{{ _garage_hdr }}"
    body_format: json
    body: { globalAlias: "{{ item.bucket }}" }
  loop: "{{ truenas_garage.s3_tenants }}"
  loop_control:
    label: "{{ item.bucket }}"
  when: item.bucket not in (truenas_garage_buckets.json | map(attribute='globalAliases') | flatten | list)
  no_log: true

# Re-read AFTER creation so newly made keys and buckets have ids to grant with.
- name: Re-read garage keys and buckets
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/{{ item }}"
    headers: "{{ _garage_hdr }}"
  loop: [ListKeys, ListBuckets]
  register: truenas_garage_reread
  no_log: true

# `item.json['keys']` with brackets, NOT `item.json.keys`: Jinja resolves
# attribute access before item lookup, and `keys` is a dict METHOD -- the dotted
# form silently yields a bound method, so every selectattr below would filter an
# empty result and the grant would be skipped for keys that genuinely lack it.
# Bracket form is the only correct one for a field named after a dict method.
- name: Index garage keys and buckets by name
  ansible.builtin.set_fact:
    _gkeys: "{{ dict(truenas_garage_reread.results[0].json | map(attribute='name') | zip(truenas_garage_reread.results[0].json | map(attribute='id'))) }}"
    _gbuckets: "{{ dict(truenas_garage_reread.results[1].json
                        | selectattr('globalAliases', 'defined')
                        | rejectattr('globalAliases', 'equalto', [])
                        | map(attribute='globalAliases.0')
                        | zip(truenas_garage_reread.results[1].json
                              | selectattr('globalAliases', 'defined')
                              | rejectattr('globalAliases', 'equalto', [])
                              | map(attribute='id'))) }}"

# THE GRANT WAS MISSING FROM THIS ROLE UNTIL 2026-09-07 and the live velero
# key had read/write/owner applied out-of-band. A bucket and a key with no
# permission between them is the worst shape of drift: the playbook converges
# clean, every resource exists, and nothing can authenticate. Same failure the
# SMB role reports per-account for exactly this reason.
#
# Idempotent by gating on the permission already being present, so a converged
# run reports no change rather than re-granting every time.
- name: Read garage bucket permissions
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/GetBucketInfo?id={{ _gbuckets[item.bucket] }}"
    headers: "{{ _garage_hdr }}"
  loop: "{{ truenas_garage.s3_tenants }}"
  loop_control:
    label: "{{ item.bucket }}"
  register: truenas_garage_bucketinfo
  no_log: true

- name: Grant each key read/write on its own bucket
  ansible.builtin.uri:
    url: "{{ _garage_api }}/v2/AllowBucketKey"
    method: POST
    headers: "{{ _garage_hdr }}"
    body_format: json
    body:
      bucketId: "{{ _gbuckets[item.item.bucket] }}"
      accessKeyId: "{{ _gkeys[item.item.key] }}"
      permissions: { read: true, write: true, owner: true }
  loop: "{{ truenas_garage_bucketinfo.results }}"
  loop_control:
    label: "{{ item.item.key }} -> {{ item.item.bucket }}"
  when: >-
    (item.json['keys'] | default([])
       | selectattr('accessKeyId', 'equalto', _gkeys[item.item.key])
       | selectattr('permissions.write', 'equalto', true) | list | length) == 0
  no_log: true

- name: Report the garage S3 endpoint
  ansible.builtin.debug:
    msg: >-
      garage S3 endpoint http://{{ truenas_garage.bind_ip }}:{{ truenas_garage.ports.s3 }}
      tenants={{ truenas_garage.s3_tenants | map(attribute='key') | join(', ') }}
      layoutVersion={{ truenas_garage_status.json.layoutVersion }}
      -- secrets are NOT printed; read one with
      GetKeyInfo?id=<id>&showSecretKey=true when minting a SealedSecret.

# ---------------------------------------------------------------------------
# node_exporter — the box's metrics source for the cluster's Grafana.
#
# Deployed as a CUSTOM (compose) app rather than a catalog app because no
# TrueNAS train ships node-exporter. The full rationale — including why not
# netdata, which is already running, and why not a native service — is in
# group_vars/all.yml above `truenas_node_exporter`.
#
# The compose below is upstream node_exporter's own documented Docker
# invocation (host network + pid + `--path.rootfs=/host` over a read-only bind
# of `/`), with two additions: an explicit bind address, and the textfile
# collector directory.
# ---------------------------------------------------------------------------

# NOTE: the textfile directory is NOT created here. It is declared as a dataset
# (`monitoring/textfile`) in group_vars and converged by truenas-storage, which
# runs FIRST -- same reasoning as garage's host_path tree, and the reason this
# role does no mkdir of its own. If the collector logs "failed to read textfile
# directory" on every scrape, the storage role did not run, not this one.
# Defined ONCE and used by both the create and the update below. Keeping two
# copies of a compose payload is how they drift.
- name: Build the node_exporter compose definition
  ansible.builtin.set_fact:
    _ne_compose:
      services:
        node-exporter:
          image: "{{ truenas_node_exporter.image }}"
          # TrueNAS's own Application Info panel shows `App Version: custom` and
          # `Version: 1.0.0` for EVERY custom app and always will -- those are
          # hardcoded constants in catalog_reader/custom_app.py returned by a
          # function its own docstring calls a stub, and the `version` field
          # app.create accepts is honoured only for CATALOG apps. These labels
          # are the closest the box gets to a truthful version: `docker inspect`
          # and the container view show them. The authoritative source stays
          # `node_exporter_build_info`, which reports the running binary rather
          # than the tag that was asked for.
          labels:
            org.opencontainers.image.version: "{{ truenas_node_exporter.image | regex_replace('^.*:', '') }}"
            org.opencontainers.image.source: "https://github.com/prometheus/node_exporter"
            org.opencontainers.image.title: "node_exporter"
            pl.sudops.managed-by: "ansible/truenas/roles/truenas-apps"
          # `unless-stopped`, not `always`: an operator who stops this app
          # from the UI should have it stay stopped across a reboot.
          restart: unless-stopped
          # Both are required for a host-accurate view. Without pid:host the
          # process/context-switch counters describe the container, not the
          # NAS.
          network_mode: host
          pid: host
          command:
            - "--path.rootfs=/host"
            - "--web.listen-address={{ truenas_node_exporter.listen_address }}"
            - "--collector.textfile.directory=/host{{ truenas_node_exporter.textfile_dir }}"
          volumes:
            # rslave so ZFS datasets mounted after the container starts are
            # still visible inside it -- without it, a dataset created later
            # is invisible to the filesystem collector until a restart.
            - "/:/host:ro,rslave"

- name: Deploy the node_exporter custom app
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.create
      - "{{ {'app_name': truenas_node_exporter.app_name, 'custom_app': true, 'custom_compose_config': _ne_compose} | to_json }}"
  when: truenas_node_exporter.app_name not in truenas_app_names
  register: truenas_ne_deploy
  failed_when: false

# Same reasoning as the garage deploy above: surface the real error from the
# job record rather than leaving the operator with an opaque module failure.
- name: Read the app.create job record if the node_exporter deploy failed
  ansible.builtin.command:
    argv: [midclt, call, core.get_jobs, '[["method", "=", "app.create"]]']
  register: truenas_ne_job
  changed_when: false
  when: (truenas_ne_deploy.rc | default(0)) != 0

- name: Fail with the real node_exporter reason
  ansible.builtin.fail:
    msg: "node_exporter app.create failed: {{ (truenas_ne_job.stdout | from_json | sort(attribute='id') | last).error | default('no job record found') }}"
  when: (truenas_ne_deploy.rc | default(0)) != 0

- name: Report node_exporter state
  ansible.builtin.debug:
    msg: >-
      node_exporter {{ 'already present' if truenas_node_exporter.app_name in truenas_app_names else 'DEPLOYED' }}
      -- metrics at http://{{ truenas_node_exporter.listen_address }}/metrics;
      the cluster scrapes it via components/cluster-config/truenas-exporter

# ---------------------------------------------------------------------------
# Image updates for a CUSTOM app.
#
# THIS TASK IS THE WHOLE UPDATE MECHANISM, and without it the role is a trap:
# a create-only role means bumping `truenas_node_exporter.image` in group_vars
# changes NOTHING on the box while the play still reports "ok" and converged.
# That is the same "declared but never applied" shape that hid the auto-created
# scrub task and the un-applied dataset quota.
#
# Why it has to be us: garage is a CATALOG app, so TrueNAS tracks an upstream
# version, sets `upgrade_available`, and offers a button. node-exporter is a
# CUSTOM app -- there is no catalog entry to compare against, `app.query`
# reports `upgrade_available: false` permanently, and `version` is a synthetic
# `1.0.0` that never moves. `app.outdated_docker_images` only detects a MUTABLE
# tag (`:latest`) whose digest changed upstream; against a pinned tag it returns
# `[]` forever. So nothing on the box will ever tell you node_exporter is old.
# Renovate watches the pinned tag instead (see customManagers in renovate.json)
# and opens a PR; merging it makes this task the thing that applies it.
- name: Reconcile the node_exporter image
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.update
      - "{{ truenas_node_exporter.app_name }}"
      - "{{ {'custom_compose_config': _ne_compose} | to_json }}"
  vars:
    _live: "{{ (truenas_app_q.stdout | from_json
                | selectattr('name', 'equalto', truenas_node_exporter.app_name)
                | first).active_workloads.images | default([]) }}"
  when:
    - truenas_node_exporter.app_name in truenas_app_names
    - truenas_node_exporter.image not in _live

- name: Report the node_exporter image in use
  ansible.builtin.debug:
    msg: >-
      node_exporter image declared {{ truenas_node_exporter.image }}
      -- TrueNAS will never flag this as upgradable (custom apps have no catalog);
      Renovate watches the tag, and this role applies the bump.

# ---------------------------------------------------------------------------
# Syncthing — replaces Synology Drive Client for ~/Projects.
#
# A CATALOG app (stable train), deployed the way garage is. It was a custom
# compose app from 2026-09-09 to 09-11; why it moved, and the one cost of the
# catalog app (SYS_ADMIN), sit above `truenas_syncthing` in group_vars.
#
# This box is a RECEIVE-ONLY peer. The folder and device pairing are NOT
# converged here -- Syncthing owns its config.xml. See the README's "Syncthing"
# section for the one-time pairing walkthrough.
# ---------------------------------------------------------------------------

# The container runs as run_as (568) and a freshly created dataset is
# root:root 0755, so ownership is checked per path and fixed only when wrong --
# same as garage. The datasets themselves come from truenas-storage.
- name: Stat the syncthing storage paths
  ansible.builtin.command:
    argv: [midclt, call, filesystem.stat, "{{ item.value }}"]
  register: truenas_st_stat
  changed_when: false
  check_mode: false
  loop: "{{ truenas_syncthing.paths | dict2items }}"
  loop_control:
    label: "{{ item.value }}"

- name: Chown the syncthing storage paths to the apps account
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - filesystem.chown
      - "{{ {'path': item.item.value, 'uid': truenas_syncthing.run_as_uid, 'gid': truenas_syncthing.run_as_gid, 'options': {'recursive': true, 'traverse': false}} | to_json }}"
  loop: "{{ truenas_st_stat.results }}"
  loop_control:
    label: "{{ item.item.value }}"
  when: (item.stdout | from_json).uid != truenas_syncthing.run_as_uid

# Defined ONCE and used by both the create and the reconcile below.
- name: Build the syncthing app values
  ansible.builtin.set_fact:
    _st_values:
      TZ: "{{ truenas_timezone }}"
      syncthing:
        # Without it, first start creates a default ~/Sync folder and offers it
        # to every peer that pairs. STGUIADDRESS is deliberately NOT set: the
        # template sets it to 0.0.0.0:<web port> inside the container, which is
        # what lets its own healthcheck pass, and the bind that matters happens
        # where the port is published.
        additional_envs:
          - { name: STNODEFAULTFOLDER, value: "1" }
      run_as:
        user: "{{ truenas_syncthing.run_as_uid | int }}"
        group: "{{ truenas_syncthing.run_as_gid | int }}"
      network:
        host_network: false
        web_port: { bind_mode: published, port_number: "{{ truenas_syncthing.ports.web | int }}", host_ips: "{{ _ips }}" }
        tcp_port: { bind_mode: published, port_number: "{{ truenas_syncthing.ports.sync | int }}", host_ips: "{{ _ips }}" }
        udp_port: { bind_mode: published, port_number: "{{ truenas_syncthing.ports.sync | int }}", host_ips: "{{ _ips }}" }
      storage:
        config: { type: host_path, host_path_config: { path: "{{ truenas_syncthing.paths.config }}" } }
        additional_storage:
          - { type: host_path, mount_path: "{{ truenas_syncthing.data_mount }}", host_path_config: { path: "{{ truenas_syncthing.paths.data }}" } }
  vars:
    # [] means all interfaces -- see BIND ADDRESS in group_vars for why it is
    # not 192.168.1.25. Same expression garage uses.
    _ips: "{{ [] if truenas_syncthing.bind_ip == '0.0.0.0' else [truenas_syncthing.bind_ip] }}"

# ONE-TIME MIGRATION, and self-limiting: fires only while an app named
# syncthing exists AND is a custom app -- the compose app this role deployed
# until 2026-09-11. Once it is gone the condition can never be true again, and
# a catalog app of the same name is never touched. app.delete removes the app
# and its image; it does not touch host-path storage, so both datasets and
# their snapshots survive (remove_ix_volumes stays false; there are none).
- name: Remove the pre-catalog custom syncthing app
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.delete
      - "{{ truenas_syncthing.app_name }}"
      - '{"remove_images": true, "remove_ix_volumes": false}'
  when: >-
    truenas_app_q.stdout | from_json
    | selectattr('name', 'equalto', truenas_syncthing.app_name)
    | selectattr('custom_app', 'equalto', true)
    | list | length > 0
  register: truenas_st_delete

# truenas_app_names was built before the delete, so it still lists syncthing.
- name: Decide whether the syncthing catalog app already exists
  ansible.builtin.set_fact:
    _st_exists: "{{ truenas_syncthing.app_name in truenas_app_names and truenas_st_delete is not changed }}"

- name: Deploy the syncthing catalog app
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.create
      - "{{ _app | to_json }}"
  vars:
    _app:
      app_name: "{{ truenas_syncthing.app_name }}"
      catalog_app: syncthing
      train: "{{ truenas_syncthing.train }}"
      version: "{{ truenas_syncthing.version }}"
      values: "{{ _st_values }}"
  when: not (_st_exists | bool)
  register: truenas_st_deploy
  failed_when: false

# Same reasoning as garage: surface the real error from the job record rather
# than an opaque module failure.
- name: Read the app.create job record if the syncthing deploy failed
  ansible.builtin.command:
    argv: [midclt, call, core.get_jobs, '[["method", "=", "app.create"]]']
  register: truenas_st_job
  changed_when: false
  when: (truenas_st_deploy.rc | default(0)) != 0

- name: Fail with the real syncthing reason
  ansible.builtin.fail:
    msg: "syncthing app.create failed: {{ (truenas_st_job.stdout | from_json | sort(attribute='id') | last).error | default('no job record found') }}"
  when: (truenas_st_deploy.rc | default(0)) != 0

- name: Read the live syncthing app values
  ansible.builtin.command:
    argv: [midclt, call, app.config, "{{ truenas_syncthing.app_name }}"]
  register: truenas_st_live
  changed_when: false
  check_mode: false
  when: _st_exists | bool

# Compares only what this role declares, projected out of the live values the
# same way on both sides. app.config merges schema defaults in (garage's comes
# back with acl_enable, ix_* keys and so on), so a whole-dict comparison would
# report drift on every run. Without this task a change to the values above
# would be declared in git and never applied -- the trap this topic keeps
# hitting.
- name: Reconcile the syncthing app values
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - app.update
      - "{{ truenas_syncthing.app_name }}"
      - "{{ {'values': _st_values} | to_json }}"
  vars:
    _l: "{{ truenas_st_live.stdout | from_json }}"
    _want_sig:
      - "{{ _st_values.run_as.user | string }}:{{ _st_values.run_as.group | string }}"
      - "{{ _st_values.network.host_network | string }}"
      - "{{ _st_values.network.web_port.port_number | string }}={{ _st_values.network.web_port.host_ips | sort | join(',') }}"
      - "{{ _st_values.network.tcp_port.port_number | string }}={{ _st_values.network.tcp_port.host_ips | sort | join(',') }}"
      - "{{ _st_values.network.udp_port.port_number | string }}={{ _st_values.network.udp_port.host_ips | sort | join(',') }}"
      - "{{ _st_values.storage.config.host_path_config.path }}"
      - "{{ _st_values.storage.additional_storage | map(attribute='mount_path') | join(',') }}>{{ _st_values.storage.additional_storage | map(attribute='host_path_config.path') | join(',') }}"
      - "{{ _st_values.syncthing.additional_envs | map(attribute='name') | join(',') }}={{ _st_values.syncthing.additional_envs | map(attribute='value') | join(',') }}"
    _live_sig:
      - "{{ _l.run_as.user | default('') | string }}:{{ _l.run_as.group | default('') | string }}"
      - "{{ _l.network.host_network | default(false, true) | string }}"
      - "{{ _l.network.web_port.port_number | default('') | string }}={{ _l.network.web_port.host_ips | default([], true) | sort | join(',') }}"
      - "{{ _l.network.tcp_port.port_number | default('') | string }}={{ _l.network.tcp_port.host_ips | default([], true) | sort | join(',') }}"
      - "{{ _l.network.udp_port.port_number | default('') | string }}={{ _l.network.udp_port.host_ips | default([], true) | sort | join(',') }}"
      - "{{ _l.storage.config.host_path_config.path | default('') }}"
      - "{{ _l.storage.additional_storage | default([], true) | map(attribute='mount_path') | join(',') }}>{{ _l.storage.additional_storage | default([], true) | map(attribute='host_path_config.path') | join(',') }}"
      - "{{ _l.syncthing.additional_envs | default([], true) | map(attribute='name') | join(',') }}={{ _l.syncthing.additional_envs | default([], true) | map(attribute='value') | join(',') }}"
  when:
    - _st_exists | bool
    - _live_sig != _want_sig

- name: Report syncthing state
  ansible.builtin.debug:
    msg: >-
      syncthing {{ 'REPLACED the custom app with the catalog app' if truenas_st_delete is changed
      else ('catalog app present' if _st_exists | bool else 'DEPLOYED') }}
      -- GUI at http://192.168.1.25:{{ truenas_syncthing.ports.web }}/ (set a GUI
      password at first login). Pairing is one-time and by hand; see the README.
      The NAS folder must be RECEIVE-ONLY, and each Mac adds this node by
      address, tcp://192.168.1.25:{{ truenas_syncthing.ports.sync }}.
