---
# ---------------------------------------------------------------------------
# truenas-tasks — scrub, SMART tests, periodic snapshots
# ---------------------------------------------------------------------------
# All three are COLLECTIONS. Matched on a natural key we choose (pool name for
# scrub, dataset for snapshots) because the middleware identity is an integer id.
#
# Golden rule 2 from the setup runbook, restated where it matters: these
# snapshots live on the SAME POOL and are NOT a backup. The off-box replication
# target is the backup. On a wear-matched 5-year drive cohort (all six between
# 43,360 and 43,746 power-on hours) that distinction is the whole ballgame.
# ---------------------------------------------------------------------------

- name: Query existing scrub tasks
  ansible.builtin.command:
    argv: [midclt, call, pool.scrub.query]
  register: truenas_scrub_q
  changed_when: false
  check_mode: false

- name: Index scrub tasks by pool id
  ansible.builtin.set_fact:
    truenas_scrub_pools: "{{ truenas_scrub_q.stdout | from_json | map(attribute='pool') | list }}"
    truenas_pool_id: "{{ (truenas_pool_q.stdout | from_json | first).id }}"
    truenas_scrub_existing: "{{ truenas_scrub_q.stdout | from_json }}"

# TrueNAS AUTO-CREATES a scrub task as part of pool.create -- observed on the
# 2026-08-28 build: id=1, threshold=35, schedule Sunday 00:00 (dow 7), empty
# description. So a plain create-if-missing task skips forever and the schedule
# declared here NEVER lands. That is silent drift: git says 03:00 on the 1st,
# the box does Sunday midnight, and nothing reports the difference.
#
# Hence create-OR-update. `_scrub_drift` is the declared-vs-live comparison; it
# is deliberately narrow (schedule + threshold + enabled) because those are the
# fields we assert. Description is included so the task is identifiable as
# ansible-managed rather than a leftover default.
- name: Identify the pool's existing scrub task (if any)
  ansible.builtin.set_fact:
    truenas_scrub_current: "{{ (truenas_scrub_existing | selectattr('pool', 'equalto', truenas_pool_id | int) | list | first) | default({}, true) }}"

# TrueNAS stores cron fields ZERO-PADDED ("00", not "0") -- the auto-created task
# came back as {"minute":"00","hour":"00",...}. Comparing that against a declared
# "0"/"3" would report drift on every run and re-issue the update forever, so both
# sides are normalized (strip leading zeros only when a digit follows, leaving "*"
# and "7" untouched) before comparison.
- name: Build comparable scrub schedule signatures
  ansible.builtin.set_fact:
    _scrub_want_sig: "{{ _k | map('extract', truenas_scrub_schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list }}"
    _scrub_live_sig: "{{ _k | map('extract', truenas_scrub_current.schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list }}"
  vars:
    _k: ['minute', 'hour', 'dom', 'month', 'dow']
  when: truenas_scrub_current | length > 0

# Monthly scrub. This is what detects bit rot; RAIDZ2 then self-heals from parity.
- name: Create the monthly scrub task
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.scrub.create
      - "{{ _scrub | to_json }}"
  vars:
    _scrub:
      pool: "{{ truenas_pool_id | int }}"
      threshold: "{{ truenas_scrub_threshold | int }}"
      description: "{{ truenas_scrub_description }}"
      schedule: "{{ truenas_scrub_schedule }}"
      enabled: true
  when: not truenas_scrub_current

# Reconcile an existing task -- including the one TrueNAS created for us.
- name: Reconcile the scrub task if it drifted from the declared schedule
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.scrub.update
      - "{{ truenas_scrub_current.id | string }}"
      - "{{ _scrub | to_json }}"
  vars:
    _scrub:
      threshold: "{{ truenas_scrub_threshold | int }}"
      description: "{{ truenas_scrub_description }}"
      schedule: "{{ truenas_scrub_schedule }}"
      enabled: true
  when:
    - truenas_scrub_current | length > 0
    - _scrub_live_sig != _scrub_want_sig
      or (truenas_scrub_current.threshold | default(0) | int) != (truenas_scrub_threshold | int)
      or (truenas_scrub_current.description | default('')) != truenas_scrub_description
      or not (truenas_scrub_current.enabled | default(false))

- name: Query existing periodic snapshot tasks
  ansible.builtin.command:
    argv: [midclt, call, pool.snapshottask.query]
  register: truenas_snap_q
  changed_when: false
  check_mode: false

- name: Index snapshot tasks by dataset
  ansible.builtin.set_fact:
    truenas_snap_datasets: "{{ truenas_snap_q.stdout | from_json | map(attribute='dataset') | list }}"

- name: Create missing periodic snapshot tasks
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.snapshottask.create
      - "{{ _snap | to_json }}"
  vars:
    _snap:
      dataset: "{{ truenas_pool }}/{{ item.dataset }}"
      recursive: "{{ item.recursive }}"
      lifetime_value: "{{ item.lifetime_value | int }}"
      lifetime_unit: "{{ item.lifetime_unit }}"
      naming_schema: "auto-%Y%m%d-%H%M"
      schedule: "{{ item.schedule }}"
      enabled: true
  loop: "{{ truenas_snapshot_tasks }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.dataset }}"
  when: (truenas_pool ~ '/' ~ item.dataset) not in truenas_snap_datasets

# ---------------------------------------------------------------------------
# SMART -- TrueNAS 25.10 "Goldeye" removed the smart.* middleware namespace,
# the smartd service and the SMART test scheduler outright. Verified on this
# box (25.10.6), not assumed:
#
#   midclt call smart.test.query   -> "Method does not exist"
#   systemctl list-units "*smart*" -> empty
#   disk.query                     -> no SMART-related fields
#
# smartmontools itself is still installed (smartctl 7.4), and upstream's own
# upgrade path rewrites existing SMART schedules as cron tasks -- so cron is
# the sanctioned replacement here, not a hack around a missing feature.
#
# The consequence is worth stating plainly: on a FRESH 25.10 install nothing
# tests the drives and nothing reads the results. There is no default to fall
# back on. On six drives that are five years old and wear-matched to within
# 400 power-on hours, going blind is the one outcome to design against.
# ---------------------------------------------------------------------------

- name: Query existing cron jobs
  ansible.builtin.command:
    argv: [midclt, call, cronjob.query]
  register: truenas_cron_q
  changed_when: false
  check_mode: false

- name: Index cron jobs by description
  ansible.builtin.set_fact:
    truenas_cron_descs: "{{ truenas_cron_q.stdout | from_json | map(attribute='description') | list }}"

- name: Create the SMART cron jobs
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cronjob.create
      - "{{ _job | to_json }}"
  vars:
    _f: "{{ item.cron.split() }}"
    _job:
      user: root
      command: "{{ item.command }}"
      description: "{{ item.description }}"
      schedule:
        minute: "{{ _f[0] }}"
        hour: "{{ _f[1] }}"
        dom: "{{ _f[2] }}"
        month: "{{ _f[3] }}"
        dow: "{{ _f[4] }}"
      enabled: true
      # stdout/stderr are HIDE flags. The two "-t" jobs would otherwise mail
      # "Testing has begun" six times a week; the health job must mail, so it
      # hides nothing. stderr is never hidden -- a broken job has to be loud.
      stdout: "{{ item.hide_stdout }}"
      stderr: false
  loop: "{{ truenas_smart_cronjobs }}"
  loop_control:
    label: "{{ item.description }}"
  when: item.description not in truenas_cron_descs
