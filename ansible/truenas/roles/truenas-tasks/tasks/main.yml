---
# ---------------------------------------------------------------------------
# truenas-tasks — scrub, SMART tests, periodic snapshots
# ---------------------------------------------------------------------------
# All three are COLLECTIONS. Matched on a natural key we choose (pool name for
# scrub, dataset for snapshots) because the middleware identity is an integer id.
#
# Golden rule 2 from the setup runbook, restated where it matters: these
# snapshots live on the SAME POOL and are NOT a backup. The off-box replication
# target is the backup. On a wear-matched 5-year drive cohort (all six between
# 43,360 and 43,746 power-on hours) that distinction is the whole ballgame.
# ---------------------------------------------------------------------------

- name: Query existing scrub tasks
  ansible.builtin.command:
    argv: [midclt, call, pool.scrub.query]
  register: truenas_scrub_q
  changed_when: false
  check_mode: false

- name: Index scrub tasks by pool id
  ansible.builtin.set_fact:
    truenas_scrub_pools: "{{ truenas_scrub_q.stdout | from_json | map(attribute='pool') | list }}"
    truenas_pool_id: "{{ (truenas_pool_q.stdout | from_json | first).id }}"
    truenas_scrub_existing: "{{ truenas_scrub_q.stdout | from_json }}"

# TrueNAS AUTO-CREATES a scrub task as part of pool.create -- observed on the
# 2026-08-28 build: id=1, threshold=35, schedule Sunday 00:00 (dow 7), empty
# description. So a plain create-if-missing task skips forever and the schedule
# declared here NEVER lands. That is silent drift: git says 03:00 on the 1st,
# the box does Sunday midnight, and nothing reports the difference.
#
# Hence create-OR-update. `_scrub_drift` is the declared-vs-live comparison; it
# is deliberately narrow (schedule + threshold + enabled) because those are the
# fields we assert. Description is included so the task is identifiable as
# ansible-managed rather than a leftover default.
- name: Identify the pool's existing scrub task (if any)
  ansible.builtin.set_fact:
    truenas_scrub_current: "{{ (truenas_scrub_existing | selectattr('pool', 'equalto', truenas_pool_id | int) | list | first) | default({}, true) }}"

# TrueNAS stores cron fields ZERO-PADDED ("00", not "0") -- the auto-created task
# came back as {"minute":"00","hour":"00",...}. Comparing that against a declared
# "0"/"3" would report drift on every run and re-issue the update forever, so both
# sides are normalized (strip leading zeros only when a digit follows, leaving "*"
# and "7" untouched) before comparison.
- name: Build comparable scrub schedule signatures
  ansible.builtin.set_fact:
    _scrub_want_sig: "{{ _k | map('extract', truenas_scrub_schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list }}"
    _scrub_live_sig: "{{ _k | map('extract', truenas_scrub_current.schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list }}"
  vars:
    _k: ['minute', 'hour', 'dom', 'month', 'dow']
  when: truenas_scrub_current | length > 0

# Monthly scrub. This is what detects bit rot; RAIDZ2 then self-heals from parity.
- name: Create the monthly scrub task
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.scrub.create
      - "{{ _scrub | to_json }}"
  vars:
    _scrub:
      pool: "{{ truenas_pool_id | int }}"
      threshold: "{{ truenas_scrub_threshold | int }}"
      description: "{{ truenas_scrub_description }}"
      schedule: "{{ truenas_scrub_schedule }}"
      enabled: true
  when: not truenas_scrub_current

# Reconcile an existing task -- including the one TrueNAS created for us.
- name: Reconcile the scrub task if it drifted from the declared schedule
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.scrub.update
      - "{{ truenas_scrub_current.id | string }}"
      - "{{ _scrub | to_json }}"
  vars:
    _scrub:
      threshold: "{{ truenas_scrub_threshold | int }}"
      description: "{{ truenas_scrub_description }}"
      schedule: "{{ truenas_scrub_schedule }}"
      enabled: true
  when:
    - truenas_scrub_current | length > 0
    - _scrub_live_sig != _scrub_want_sig
      or (truenas_scrub_current.threshold | default(0) | int) != (truenas_scrub_threshold | int)
      or (truenas_scrub_current.description | default('')) != truenas_scrub_description
      or not (truenas_scrub_current.enabled | default(false))

- name: Query existing periodic snapshot tasks
  ansible.builtin.command:
    argv: [midclt, call, pool.snapshottask.query]
  register: truenas_snap_q
  changed_when: false
  check_mode: false

- name: Index snapshot tasks by dataset
  ansible.builtin.set_fact:
    truenas_snap_datasets: "{{ truenas_snap_q.stdout | from_json | map(attribute='dataset') | list }}"

- name: Create missing periodic snapshot tasks
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.snapshottask.create
      - "{{ _snap | to_json }}"
  vars:
    _snap:
      dataset: "{{ truenas_pool }}/{{ item.dataset }}"
      recursive: "{{ item.recursive }}"
      lifetime_value: "{{ item.lifetime_value | int }}"
      lifetime_unit: "{{ item.lifetime_unit }}"
      naming_schema: "auto-%Y%m%d-%H%M"
      schedule: "{{ item.schedule }}"
      enabled: true
  loop: "{{ truenas_snapshot_tasks }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.dataset }}"
  when: (truenas_pool ~ '/' ~ item.dataset) not in truenas_snap_datasets

# ---------------------------------------------------------------------------
# SMART -- TrueNAS 25.10 "Goldeye" removed the smart.* middleware namespace,
# the smartd service and the SMART test scheduler outright. Verified on this
# box (25.10.6), not assumed:
#
#   midclt call smart.test.query   -> "Method does not exist"
#   systemctl list-units "*smart*" -> empty
#   disk.query                     -> no SMART-related fields
#
# smartmontools itself is still installed (smartctl 7.4), and upstream's own
# upgrade path rewrites existing SMART schedules as cron tasks -- so cron is
# the sanctioned replacement here, not a hack around a missing feature.
#
# The consequence is worth stating plainly: on a FRESH 25.10 install nothing
# tests the drives and nothing reads the results. There is no default to fall
# back on. On six drives that are five years old and wear-matched to within
# 400 power-on hours, going blind is the one outcome to design against.
# ---------------------------------------------------------------------------

- name: Query existing cron jobs
  ansible.builtin.command:
    argv: [midclt, call, cronjob.query]
  register: truenas_cron_q
  changed_when: false
  check_mode: false

- name: Index cron jobs by description
  ansible.builtin.set_fact:
    truenas_cron_descs: "{{ truenas_cron_q.stdout | from_json | map(attribute='description') | list }}"

- name: Create the SMART cron jobs
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cronjob.create
      - "{{ _job | to_json }}"
  vars:
    _f: "{{ item.cron.split() }}"
    _job:
      user: root
      command: "{{ item.command }}"
      description: "{{ item.description }}"
      schedule:
        minute: "{{ _f[0] }}"
        hour: "{{ _f[1] }}"
        dom: "{{ _f[2] }}"
        month: "{{ _f[3] }}"
        dow: "{{ _f[4] }}"
      enabled: true
      # stdout/stderr are HIDE flags. The two "-t" jobs would otherwise mail
      # "Testing has begun" six times a week; the health job must mail, so it
      # hides nothing. stderr is never hidden -- a broken job has to be loud.
      stdout: "{{ item.hide_stdout }}"
      stderr: false
  loop: "{{ truenas_smart_cronjobs }}"
  loop_control:
    label: "{{ item.description }}"
  when: item.description not in truenas_cron_descs

# ---------------------------------------------------------------------------
# node_exporter textfile collector (phase 2 of the Grafana single pane).
#
# Lives in THIS role rather than truenas-apps because it is a cron job and this
# is where cron jobs are created -- but it feeds the node_exporter custom app
# that truenas-apps deploys. See `truenas_node_exporter` in group_vars.
#
# The script must live on the DATA pool: the TrueNAS root filesystem is mounted
# read-only (`boot-pool/ROOT/<ver> zfs ro,...`), so /usr/local/bin is not
# writable. `tank/monitoring/bin` is converged by truenas-storage (which runs
# first) and is owned by the automation account precisely so this copy works --
# see the dataset's comment in group_vars for why that is the mechanism and why
# `filesystem.put` is not.
#
# No `owner:`/`group:` here: this playbook does not use become, so it cannot
# chown to root, and asking would fail the task. The file is owned by the
# automation account and executed by the root cron job, which is fine -- that
# account is already root-equivalent through the middleware.
# ---------------------------------------------------------------------------
- name: Install the node_exporter textfile collector
  ansible.builtin.copy:
    src: node-exporter-textfile.py
    dest: "{{ truenas_textfile_collector.script_path }}"
    mode: "0755"

# Runs as root because smartctl requires it -- as a non-root user every device
# read returns "Permission denied" and the SMART block silently emits nothing.
# stdout hidden (the script is silent on success, and TrueNAS mails any cron job
# whose stdout is non-empty); stderr deliberately NOT hidden, so a collector
# that starts failing is loud rather than quietly serving stale files.
- name: Create the textfile-collector cron job
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cronjob.create
      - "{{ _job | to_json }}"
  vars:
    _f: "{{ truenas_textfile_collector.cron.split() }}"
    _job:
      user: root
      command: "/usr/bin/python3 {{ truenas_textfile_collector.script_path }} {{ truenas_node_exporter.textfile_dir }}"
      description: "{{ truenas_textfile_collector.description }}"
      schedule:
        minute: "{{ _f[0] }}"
        hour: "{{ _f[1] }}"
        dom: "{{ _f[2] }}"
        month: "{{ _f[3] }}"
        dow: "{{ _f[4] }}"
      enabled: true
      stdout: true
      stderr: false
  when: truenas_textfile_collector.description not in truenas_cron_descs

# ---------------------------------------------------------------------------
# Cloud Sync backup tasks -- `truenas_cloudsync_credentials` and
# `truenas_cloudsync_tasks` in group_vars, where the design is explained.
#
# None of the methods used here is a job method (core.get_methods on 25.10.6:
# job=false for cloudsync.credentials.create/update and cloudsync.create/update;
# only cloudsync.sync is one), so no `--job`.
#
# Every task that can see a provider block is `no_log`: the middleware returns
# stored passwords in the clear to a local caller, cloudsync.query nests the
# whole credential in each task, and the create payload carries the password.
# Two facts come out of this: `truenas_cs_want` (holds secrets, never printed)
# and `truenas_cs_status` (names only, safe to report and used by the
# convergence block in playbook.yml).
#
# Identity: a credential is matched by `name`, a task by `description`. Drift
# in a declared field is reconciled with an update; nothing is ever deleted.
# ---------------------------------------------------------------------------
- name: Query existing Cloud Sync credentials
  ansible.builtin.command:
    argv: [midclt, call, cloudsync.credentials.query]
  register: truenas_cs_cred_q
  changed_when: false
  check_mode: false
  no_log: true

- name: Resolve the declared Cloud Sync credentials against the vault
  ansible.builtin.set_fact:
    truenas_cs_want: "{{ (truenas_cs_want | default([])) + [_want] }}"
    truenas_cs_status: "{{ (truenas_cs_status | default([])) + [_status] }}"
  vars:
    _fields: "{{ (item.secrets | default({})).keys() | list }}"
    _names: "{{ (item.secrets | default({})).values() | list }}"
    _vals: "{{ query('ansible.builtin.vars', *_names, default='') if (_names | length > 0) else [] }}"
    _missing: "{{ _names | zip(_vals) | selectattr('1', 'equalto', '') | map(attribute='0') | list }}"
    _provider: "{{ item.provider | combine(dict(_fields | zip(_vals))) }}"
    _live: "{{ truenas_cs_cred_q.stdout | from_json | selectattr('name', 'equalto', item.name) | list }}"
    # Compared on the declared keys only: the middleware adds defaults such as
    # `private_key: null`, which are not drift.
    _live_declared: "{{ (_live | first).provider | dict2items | selectattr('key', 'in', _provider.keys() | list) | list | items2dict }}"
    _want:
      name: "{{ item.name }}"
      provider: "{{ _provider }}"
    _status:
      name: "{{ item.name }}"
      missing: "{{ _missing }}"
      live_id: "{{ ((_live | first).id if (_live | length > 0) else 0) | int }}"
      in_sync: "{{ ((_live | length > 0) and (_live_declared == _provider)) | bool }}"
  loop: "{{ truenas_cloudsync_credentials | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create missing Cloud Sync credentials
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cloudsync.credentials.create
      - "{{ truenas_cs_want[_i] | to_json }}"
  loop: "{{ truenas_cs_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: _i
  when:
    - item.missing | length == 0
    - (item.live_id | int) == 0
  no_log: true

- name: Reconcile Cloud Sync credentials that drifted
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cloudsync.credentials.update
      - "{{ item.live_id | int | string }}"
      - "{{ truenas_cs_want[_i] | to_json }}"
  loop: "{{ truenas_cs_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: _i
  when:
    - item.missing | length == 0
    - (item.live_id | int) > 0
    - not (item.in_sync | bool)
  no_log: true

# Loud on purpose, per credential: a converged-looking run with no backup
# behind it is the failure this file exists to prevent.
- name: Report Cloud Sync credentials whose vault variables are not loaded
  ansible.builtin.debug:
    msg: >-
      Cloud Sync credential '{{ item.name }}' was NOT converged: vault
      variable(s) {{ item.missing | join(', ') }} are not loaded. The credential
      and every task that uses it are skipped -- there is NO backup behind them.
      Add the variables to vars/vault.yml (see vars/vault.yml.example) and re-run.
  loop: "{{ truenas_cs_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.missing | length > 0

- name: Re-read Cloud Sync credentials
  ansible.builtin.command:
    argv: [midclt, call, cloudsync.credentials.query]
  register: truenas_cs_cred_q2
  changed_when: false
  check_mode: false
  no_log: true

- name: Index Cloud Sync credential ids by name
  ansible.builtin.set_fact:
    truenas_cs_cred_ids: "{{ dict(_l | map(attribute='name') | zip(_l | map(attribute='id'))) }}"
  vars:
    _l: "{{ truenas_cs_cred_q2.stdout | from_json }}"
  no_log: true

- name: Query existing Cloud Sync tasks
  ansible.builtin.command:
    argv: [midclt, call, cloudsync.query]
  register: truenas_cs_task_q
  changed_when: false
  check_mode: false
  no_log: true

- name: Build the declared Cloud Sync task payloads
  ansible.builtin.set_fact:
    truenas_cs_tasks: "{{ (truenas_cs_tasks | default([])) + [_entry] }}"
  vars:
    _k: ['minute', 'hour', 'dom', 'month', 'dow']
    _live: "{{ truenas_cs_task_q.stdout | from_json | selectattr('description', 'equalto', item.description) | list }}"
    _cur: "{{ _live | first }}"
    _cred_id: "{{ (truenas_cs_cred_ids[item.credentials] | default(0)) | int }}"
    # One expression, so the types survive templating: `credentials` has to
    # reach the middleware as an integer and the two flags as booleans.
    _payload: >-
      {{ {
           'description': item.description,
           'path': '/mnt/' ~ truenas_pool ~ '/' ~ item.dataset,
           'credentials': _cred_id | int,
           'attributes': item.attributes,
           'schedule': item.schedule,
           'direction': 'PUSH',
           'transfer_mode': item.transfer_mode,
           'snapshot': item.snapshot | default(false) | bool,
           'exclude': item.exclude | default([]),
           'enabled': item.enabled | default(true) | bool
         } }}
    # Declared keys only, for the same reason as the credentials above.
    _attrs_live: "{{ _cur.attributes | dict2items | selectattr('key', 'in', item.attributes.keys() | list) | list | items2dict }}"
    _in_sync: >-
      {{ (_live | length > 0)
         and _cur.path == ('/mnt/' ~ truenas_pool ~ '/' ~ item.dataset)
         and (_cur.credentials.id | int) == (_cred_id | int)
         and _attrs_live == item.attributes
         and (_k | map('extract', _cur.schedule) | map('string') | list) == (_k | map('extract', item.schedule) | map('string') | list)
         and _cur.direction == 'PUSH'
         and _cur.transfer_mode == item.transfer_mode
         and (_cur.snapshot | bool) == (item.snapshot | default(false) | bool)
         and (_cur.exclude | default([], true) | list) == (item.exclude | default([]) | list)
         and (_cur.enabled | bool) == (item.enabled | default(true) | bool) }}
    _entry:
      description: "{{ item.description }}"
      credentials: "{{ item.credentials }}"
      cred_id: "{{ _cred_id | int }}"
      live_id: "{{ ((_live | first).id if (_live | length > 0) else 0) | int }}"
      in_sync: "{{ _in_sync | bool }}"
      payload: "{{ _payload }}"
  loop: "{{ truenas_cloudsync_tasks | default([]) }}"
  loop_control:
    label: "{{ item.description }}"
  no_log: true

- name: Create missing Cloud Sync tasks
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cloudsync.create
      - "{{ item.payload | to_json }}"
  loop: "{{ truenas_cs_tasks | default([]) }}"
  loop_control:
    label: "{{ item.description }}"
  when:
    - (item.cred_id | int) > 0
    - (item.live_id | int) == 0

- name: Reconcile Cloud Sync tasks that drifted
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - cloudsync.update
      - "{{ item.live_id | int | string }}"
      - "{{ item.payload | to_json }}"
  loop: "{{ truenas_cs_tasks | default([]) }}"
  loop_control:
    label: "{{ item.description }}"
  when:
    - (item.cred_id | int) > 0
    - (item.live_id | int) > 0
    - not (item.in_sync | bool)
