---
# ---------------------------------------------------------------------------
# truenas-storage — assert the pool, converge the datasets
# ---------------------------------------------------------------------------
# Every call goes through `midclt`, the middleware's local CLI, via
# ansible.builtin.command. See group_vars/all.yml for why not REST.
#
# The TrueNAS middleware is a CRUD API, not a declarative one. Two shapes:
#   * SINGLETONS   — <ns>.config + <ns>.update. Naturally idempotent.
#   * COLLECTIONS  — <ns>.query + .create/.update/.delete. Need query-compare-act.
# Datasets are a collection, so everything below queries first.
# ---------------------------------------------------------------------------

# ---- Pool: ASSERT ONLY, never create --------------------------------------
# pool.create is the single most dangerous method on the box. Two independent
# hazards: re-running against an existing name errors out, and re-running
# against wiped disks would silently build a NEW EMPTY pool where the old one
# was. Neither belongs in something an operator might run twice by reflex.
# Pool creation is a deliberate, supervised, documented manual step.
- name: Query the pool
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.query
      - '[["name","=","{{ truenas_pool }}"]]'
  register: truenas_pool_q
  changed_when: false
  check_mode: false

- name: Assert the pool exists (this playbook never creates one)
  ansible.builtin.assert:
    that:
      - (truenas_pool_q.stdout | from_json | length) > 0
    fail_msg: >-
      Pool '{{ truenas_pool }}' does not exist on this box, and this playbook
      deliberately will NOT create it. `pool.create` is a one-shot destructive
      job: run twice it either errors or silently builds a new empty pool over
      the old one. Create the pool by hand (see ansible/truenas/README.md),
      confirm `zpool status -v` is clean, then re-run this playbook.
    success_msg: "Pool '{{ truenas_pool }}' present."

# ---- Datasets: query -> create missing -> reconcile drifted ---------------
- name: Query existing datasets in the pool
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.dataset.query
      - '[["pool","=","{{ truenas_pool }}"]]'
  register: truenas_ds_q
  changed_when: false
  check_mode: false

- name: Index existing datasets by id
  ansible.builtin.set_fact:
    truenas_ds_ids: "{{ truenas_ds_q.stdout | from_json | map(attribute='id') | list }}"
    truenas_ds_recordsize: >-
      {{ dict(
           (truenas_ds_q.stdout | from_json | map(attribute='id') | list)
           | zip(truenas_ds_q.stdout | from_json | map(attribute='recordsize.value', default='') | list)
         ) }}
    # `rawvalue` not `parsed`: an UNQUOTA'D dataset returns parsed=null and
    # rawvalue="0", so parsed cannot distinguish "no quota" from "unreadable".
    truenas_ds_quota: >-
      {{ dict(
           (truenas_ds_q.stdout | from_json | map(attribute='id') | list)
           | zip(truenas_ds_q.stdout | from_json | map(attribute='quota.rawvalue', default='0') | list)
         ) }}

# ---- Create-time properties must be declared as a complete set ----------
# The drift check below and the post-apply check in playbook.yml both read
# casesensitivity/acltype/aclmode as ONE tuple per dataset. A dataset that
# declares casesensitivity alone does not fail cleanly there: it crashes the
# template with "object of type 'dict' has no attribute 'acltype'" -- and only
# in the post-apply check, on the run that creates it, because the pre-check
# below skips datasets that do not exist yet. So the dataset gets created and
# THEN the run fails. Found 2026-09-11 when tank/sync did exactly that. This
# fails first, before any create, and names the dataset.
- name: Assert create-time properties are declared as a complete set
  ansible.builtin.assert:
    that:
      - _partial | length == 0
    fail_msg: >-
      These datasets declare `casesensitivity` without both `acltype` and
      `aclmode`: {{ _partial | join(', ') }}. The three are compared as one
      tuple (dataset:CASESENSITIVITY:ACLTYPE:ACLMODE), here and in
      playbook.yml, so declare all three. For a dataset that already exists,
      copy the live values from `midclt call pool.dataset.query`.
    quiet: true
  vars:
    _partial: >-
      {{ ((truenas_datasets | selectattr('casesensitivity', 'defined') | rejectattr('acltype', 'defined') | list)
          + (truenas_datasets | selectattr('casesensitivity', 'defined') | rejectattr('aclmode', 'defined') | list))
         | map(attribute='name') | unique | list }}

# ---- Create-time-only properties: ASSERT, never reconcile ----------------
# `casesensitivity`, `acltype` and `aclmode` are declared as a SET on the SMB
# datasets (see group_vars). casesensitivity in particular is fixed by ZFS at
# create: there is no `zfs set`, no rename-in-place, no workaround.
#
# WHY AN ASSERT AND NOT A RECONCILE TASK: a reconcile is what everything else in
# this role does, and it is exactly wrong here -- `pool.dataset.update` accepts
# the key and silently does nothing, so a "reconcile" would report `ok` forever
# while the property stayed wrong. That is the same "declared but never applied"
# shape that has already produced three separate bugs in this topic. Failing is
# the only honest option when the remedy is destroy + recreate.
#
# This runs BEFORE the create task on purpose. A wrong parent must block its
# children from being created underneath it -- children inherit casesensitivity
# at create, so creating them under a drifted parent would multiply the problem
# rather than surface it.
#
# Only datasets that ALREADY EXIST are compared. A declared-but-missing one is
# created correctly by the next task, so flagging it here would be a false alarm.
- name: Detect drift on create-time-only dataset properties
  ansible.builtin.set_fact:
    truenas_ds_ct_drift: "{{ _want_ct | difference(_live_ct) }}"
  vars:
    _j: "{{ truenas_ds_q.stdout | from_json }}"
    _existing: "{{ _j | map(attribute='id') | map('regex_replace', '^' ~ truenas_pool ~ '/', '') | list }}"
    _decl: >-
      {{ truenas_datasets
         | selectattr('casesensitivity', 'defined')
         | selectattr('name', 'in', _existing)
         | list }}
    _want_ct: >-
      {{ (_decl | map(attribute='name') | map('regex_replace', '^', truenas_pool ~ '/') | list)
         | zip(_decl | map(attribute='casesensitivity') | list,
               _decl | map(attribute='acltype') | list,
               _decl | map(attribute='aclmode') | list)
         | map('join', ':') | sort | list }}
    _live_ct: >-
      {{ (_j | map(attribute='id') | list)
         | zip(_j | map(attribute='casesensitivity.value', default='') | list,
               _j | map(attribute='acltype.value', default='') | list,
               _j | map(attribute='aclmode.value', default='') | list)
         | map('join', ':') | sort | list }}

- name: Assert no dataset has drifted on a create-time-only property
  ansible.builtin.assert:
    that:
      - truenas_ds_ct_drift | length == 0
    fail_msg: >-
      These datasets declare create-time-only properties that do NOT match the
      live pool, and NOTHING in this playbook can fix them -- ZFS has no `set`
      for casesensitivity: {{ truenas_ds_ct_drift | join(' | ') }}.
      Each entry reads `dataset:CASESENSITIVITY:ACLTYPE:ACLMODE` as DECLARED.
      The only remedy is destroy + recreate, which is a separate gated one-shot
      because it is irreversible: run `./destroy-empty-dataset.sh <dataset>`
      from ansible/truenas (dry-run by default; it refuses any dataset that is
      not empty, has snapshots, has children, or is referenced by a share), then
      re-run this playbook to re-create it from group_vars. If the dataset already holds data you care about, the property
      is not recoverable without copying the data out and back.
    success_msg: "Create-time-only dataset properties match the live pool."

# recordsize applies to NEW WRITES ONLY. Creating the dataset with the right
# value up front is the only way to get it right for the data that lands next --
# which is why this runs before any migration step.
- name: Create missing datasets
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.dataset.create
      - "{{ _ds_payload | to_json }}"
  vars:
    _ds_payload: >-
      {{
        {
          'name': truenas_pool ~ '/' ~ item.name,
          'type': 'FILESYSTEM',
          'recordsize': item.recordsize,
          'atime': 'OFF',
          'comments': item.comments | default('')
        }
        | combine({'compression': item.compression} if item.compression is defined else {})
        | combine({'quota': item.quota} if (item.quota | default(0)) | int > 0 else {})
        | combine({'casesensitivity': item.casesensitivity} if item.casesensitivity is defined else {})
        | combine({'acltype': item.acltype} if item.acltype is defined else {})
        | combine({'aclmode': item.aclmode} if item.aclmode is defined else {})
      }}
  loop: "{{ truenas_datasets }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.name }}"
  when: (truenas_pool ~ '/' ~ item.name) not in truenas_ds_ids

# Datasets consumed by an UNPRIVILEGED pod need their root chowned to that
# pod's UID -- a root:root 0755 dataset root is unwritable by a restricted-v2
# workload, and the failure surfaces only at first write after cutover.
#
# Read the current owner first and chown only on drift, so a converged box
# reports ok rather than changed. filesystem.chown is a JOB method: the --job
# flag is mandatory (without it midclt returns a job id immediately and any
# check after it races the chown).
- name: Read current ownership of datasets that declare one
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - filesystem.stat
      - "/mnt/{{ truenas_pool }}/{{ item.name }}"
  register: truenas_ds_stat
  changed_when: false
  failed_when: false
  loop: "{{ truenas_datasets | selectattr('owner_uid', 'defined') | list }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.name }}"

- name: Chown datasets whose ownership drifted
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - filesystem.chown
      - >-
        {"path": "/mnt/{{ truenas_pool }}/{{ item.item.name }}",
         "uid": {{ item.item.owner_uid }},
         "gid": {{ item.item.owner_gid | default(item.item.owner_uid) }},
         "options": {"recursive": false}}
  loop: "{{ truenas_ds_stat.results | default([]) }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.item.name }}"
  when:
    - item.rc | default(1) == 0
    - (item.stdout | from_json).uid != item.item.owner_uid
       or (item.stdout | from_json).gid != (item.item.owner_gid | default(item.item.owner_uid))

# QUOTA WAS DECLARED BUT NEVER APPLIED TO AN EXISTING DATASET until 2026-09-05.
# It appeared exactly once in this role -- inside the CREATE payload -- so
# changing a quota in group_vars silently did nothing to a dataset that already
# existed, and the play still reported `changed=0` and "Converged".
#
# Found by predicting `changed=1` for a tank/bench 200G -> 500G bump, getting
# `changed=0`, and checking the box instead of assuming the prediction was
# wrong. That is the FOURTH "declared but never applied" defect in this topic,
# which is why the convergence block in playbook.yml now asserts on quota too.
#
# ZFS quota IS freely updatable in both directions -- unlike casesensitivity,
# which is why that one gets an assert and this one gets a reconcile.
# Declaring 0 removes the quota.
- name: Reconcile quota on datasets that drifted
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.dataset.update
      - "{{ truenas_pool }}/{{ item.name }}"
      - "{{ {'quota': (item.quota | default(0)) | int} | to_json }}"
  loop: "{{ truenas_datasets }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.name }}"
  when:
    - (truenas_pool ~ '/' ~ item.name) in truenas_ds_ids
    - (truenas_ds_quota[truenas_pool ~ '/' ~ item.name] | default('0')) | int
      != (item.quota | default(0)) | int

# Only fires on genuine drift, so a converged box reports ok, not changed.
# recordsize IS updatable on a live dataset (it governs subsequent writes),
# so this is safe to reconcile -- unlike ashift, which is create-time-only on
# the vdev and is therefore not represented anywhere in this role.
- name: Reconcile recordsize on datasets that drifted
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - pool.dataset.update
      - "{{ truenas_pool }}/{{ item.name }}"
      - "{{ {'recordsize': item.recordsize} | to_json }}"
  loop: "{{ truenas_datasets }}"
  loop_control:
    label: "{{ truenas_pool }}/{{ item.name }}"
  when:
    - (truenas_pool ~ '/' ~ item.name) in truenas_ds_ids
    - truenas_ds_recordsize[truenas_pool ~ '/' ~ item.name] | default('') != item.recordsize

# ---------------------------------------------------------------------------
# Pool properties.
#
# `pool.update` takes autotrim as "ON"/"OFF" (enum, uppercase). Read-then-write
# so a converged run reports no change, same shape as every other reconcile in
# this role.
# ---------------------------------------------------------------------------
- name: Read current pool autotrim settings
  ansible.builtin.command:
    argv: [midclt, call, pool.query]
  register: truenas_pool_props_q
  changed_when: false
  check_mode: false

# pool.update is a JOB method (core.get_methods: job=true). Called without
# --job, midclt returns the job id immediately with rc=0 and the job fails
# afterwards where nothing looks -- which is how a rejected payload reported
# `changed` on every run from 2026-09-08 to 09-11 while the play said ok. Of
# the mutating methods this topic calls, it was the only job method missing
# --job (audited against core.get_methods, 2026-09-11).
- name: Assert pool properties are declared as the strings ON/OFF
  ansible.builtin.assert:
    that:
      - (truenas_pool_properties | default({}) | dict2items | rejectattr('value', 'in', ['ON', 'OFF']) | list | length) == 0
    fail_msg: >-
      truenas_pool_properties values must be the quoted strings "ON" or "OFF",
      got {{ truenas_pool_properties }}. An unquoted ON/OFF is a YAML 1.1
      boolean, which pool.update rejects.
    quiet: true

- name: Reconcile pool autotrim
  ansible.builtin.command:
    argv:
      - midclt
      - call
      - --job
      - pool.update
      - "{{ (truenas_pool_props_q.stdout | from_json | selectattr('name', 'equalto', item.key) | first).id | string }}"
      - "{{ {'autotrim': item.value} | to_json }}"
  loop: "{{ truenas_pool_properties | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }} autotrim={{ item.value }}"
  when:
    - truenas_pool_props_q.stdout | from_json | selectattr('name', 'equalto', item.key) | list | length > 0
    - ((truenas_pool_props_q.stdout | from_json | selectattr('name', 'equalto', item.key) | first).autotrim.parsed | default('') | string | upper) != item.value
