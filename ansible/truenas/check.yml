---
# Read-only assertion of the box's current state. NO VAULT REQUIRED, and it
# mutates nothing -- safe to run at any time, including against a live box
# mid-migration, and runnable by anyone (including Claude) without the
# interactive vault password.
#
#   cd ansible/truenas
#   ansible-playbook -i inventory.yml check.yml
#
# Mirrors the role technitium's base-only.yml plays: a scoped subset that
# validates connectivity + sudo + the read path end-to-end without secrets.

- name: Inspect TrueNAS state (read-only)
  hosts: all
  gather_facts: false
  become: false         # midclt works unprivileged — see inventory.yml

  tasks:
    - name: TrueNAS version
      ansible.builtin.command:
        argv: [midclt, call, system.version]
      register: v
      changed_when: false

    - name: Pool status
      ansible.builtin.command:
        argv: [midclt, call, pool.query, '[["name","=","{{ truenas_pool }}"]]']
      register: p
      changed_when: false

    - name: Datasets
      ansible.builtin.command:
        argv: [midclt, call, pool.dataset.query, '[["pool","=","{{ truenas_pool }}"]]']
      register: d
      changed_when: false

    - name: NFS exports
      ansible.builtin.command:
        argv: [midclt, call, sharing.nfs.query]
      register: n
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg:
          - "version   : {{ v.stdout | trim }}"
          - "pool      : {{ ('PRESENT (' ~ (_pool.healthy | default(false) | ternary('healthy', 'DEGRADED')) ~ ')') if _present else 'ABSENT - create it by hand first, see README' }}"
          - "datasets  : {{ (d.stdout | from_json | map(attribute='id') | list | join(', ')) or '(none)' }}"
          - "nfs       : {{ (n.stdout | from_json | map(attribute='path') | list | join(', ')) or '(none)' }}"
      vars:
        # Two Jinja traps, both caught by running this for real on 2026-08-25:
        #  1. `|` binds TIGHTER than `>`, so `x | length > 0 | ternary(...)`
        #     parses as `length > ('PRESENT')`. Hence the explicit parens.
        #  2. `ternary` evaluates BOTH branches eagerly, so referencing
        #     `_pool.healthy` inside one blows up when the pool is absent.
        #     The inline `if/else` below is lazy; ternary is not.
        _present: "{{ ((p.stdout | from_json) | length) > 0 }}"
        _pool: "{{ (p.stdout | from_json | first) if ((p.stdout | from_json) | length) > 0 else {} }}"
