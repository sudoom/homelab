---
# Top-level playbook for the TrueNAS SCALE box.
#
# Usage from a workstation with this repo cloned:
#   cd ansible/truenas
#   ansible-playbook -i inventory.yml playbook.yml --ask-vault-pass
#
# Roles run in order; each is idempotent -- re-running converges state.
# The pool is ASSERTED, never created. See README.md.

- name: Configure TrueNAS SCALE
  hosts: all
  gather_facts: true
  become: false          # midclt works unprivileged — see inventory.yml

  # NOTE: vars/vault.yml is loaded OPTIONALLY in pre_tasks below, not via
  # vars_files. Everything this topic manages except the SMTP credentials is
  # non-sensitive, so the playbook must run without a vault -- otherwise every
  # dataset/share/task change is gated on an interactive password prompt.

  pre_tasks:
    - name: Load vault vars when the vault file exists
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', ['vars/vault.yml'], errors='ignore') }}"
      no_log: true

  roles:
    - role: truenas-storage   # assert pool, converge datasets  (run FIRST: everything else needs paths)
    - role: truenas-system    # hostname/timezone/NTP/alert email
    - role: truenas-shares    # NFS exports to the OKD nodes
    - role: truenas-tasks     # scrub, SMART, periodic snapshots
    - role: truenas-apps      # garage S3 server backing the Velero BSL

  # -------------------------------------------------------------------------
  # WHY THIS EXISTS: `--check` is structurally BLIND for this playbook.
  #
  # Every mutation here is an `ansible.builtin.command` (midclt) call, and the
  # command module does NOT support check mode -- so in `--check` Ansible skips
  # all of them regardless of their `when:`, and the recap reads `changed=0`.
  # Verified 2026-08-28: a --check run reported changed=0 on a freshly created
  # pool that was missing 8 datasets, 3 NFS exports, 3 cron jobs and 3 snapshot
  # tasks. A when-false skip and a check-mode skip render IDENTICALLY, so the
  # output cannot distinguish "converged" from "cannot evaluate".
  #
  # The query tasks DO run under --check (they carry `check_mode: false`), so
  # their facts are trustworthy. This block turns those facts into the answer
  # --check should have given. `debug` supports check mode, so it reports the
  # same thing in both modes.
  # -------------------------------------------------------------------------
  post_tasks:
    # -----------------------------------------------------------------------
    # These queries RE-READ the box after the roles have run. That matters:
    # the roles' own query facts were captured BEFORE their create tasks, so
    # reporting from them showed "everything missing" immediately after a
    # successful apply (observed 2026-08-28 — alarming and wrong). Re-querying
    # makes this block mean the right thing in both modes:
    #   --check : nothing was applied, so this is the to-do list.
    #   apply   : everything was applied, so this is a CONVERGENCE PROOF and
    #             every list must be empty.
    # `check_mode: false` so they run under --check too; they are pure reads.
    # -----------------------------------------------------------------------
    - name: Re-read live state for the convergence check
      ansible.builtin.command:
        argv: [midclt, call, "{{ item.method }}"]
      register: _post_q
      changed_when: false
      check_mode: false
      loop:
        - { key: datasets, method: pool.dataset.query, attr: id }
        - { key: nfs,      method: sharing.nfs.query,  attr: path }
        - { key: snap,     method: pool.snapshottask.query, attr: dataset }
        - { key: cron,     method: cronjob.query,      attr: description }
        - { key: scrub,    method: pool.scrub.query,   attr: id }
        - { key: mail,     method: mail.config,        attr: outgoingserver }
      loop_control:
        label: "{{ item.method }}"

    - name: Index the re-read state
      ansible.builtin.set_fact:
        _live: "{{ dict(_post_q.results | map(attribute='item.key') | zip(_post_q.results | map(attribute='stdout') | map('from_json') | list)) }}"

    - name: Compute the declared-vs-live delta
      ansible.builtin.set_fact:
        _drift:
          datasets_missing: "{{ (truenas_datasets | map(attribute='name') | map('regex_replace', '^', truenas_pool ~ '/') | list) | difference(_live.datasets | map(attribute='id') | list) }}"
          nfs_exports_missing: "{{ (truenas_nfs_exports | map(attribute='dataset') | map('regex_replace', '^', '/mnt/' ~ truenas_pool ~ '/') | list) | difference(_live.nfs | map(attribute='path') | list) }}"
          snapshot_tasks_missing: "{{ (truenas_snapshot_tasks | map(attribute='dataset') | map('regex_replace', '^', truenas_pool ~ '/') | list) | difference(_live.snap | map(attribute='dataset') | list) }}"
          cron_jobs_missing: "{{ (truenas_smart_cronjobs | map(attribute='description') | list) | difference(_live.cron | map(attribute='description') | list) }}"
          scrub_schedule_drift: "{{ _now_sig != _want_sig }}"
          # recordsize applies to NEW WRITES ONLY, so it is only truly fixable
          # before data lands -- which makes it the single most expensive thing
          # to get silently wrong here. Compared as sorted "id:value" pairs so
          # one `difference` covers all datasets at once.
          recordsize_drift: "{{ _want_rs | difference(_live_rs) }}"
          # NOT part of the convergence assert -- it is a known pending item, not
          # a failed apply. But it must be VISIBLE every run: without SMTP the
          # three SMART cron jobs mail root, root's mail goes nowhere, and a
          # dying drive in a 5-year cohort is discovered by noticing the array
          # is degraded. Same detection-without-delivery shape that let the
          # Synology wildcard cert expire unseen for a month.
          alerting_unconfigured: "{{ not (_mail_live.smtp | default(false)) or (_mail_live.outgoingserver | default('')) == '' }}"
      vars:
        _k: ['minute', 'hour', 'dom', 'month', 'dow']
        _cur: "{{ (_live.scrub | selectattr('pool', 'equalto', truenas_pool_id | int) | list | first) | default({}, true) }}"
        _now_sig: "{{ (_k | map('extract', _cur.schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list) if (_cur.schedule is defined) else [] }}"
        _want_sig: "{{ _k | map('extract', truenas_scrub_schedule) | map('string') | map('regex_replace', '^0+(?=[0-9])', '') | list }}"
        _mail_live: "{{ _live.mail | default({}, true) }}"
        _child: "{{ _live.datasets | rejectattr('id', 'equalto', truenas_pool) | list }}"
        _want_rs: "{{ (truenas_datasets | map(attribute='name') | map('regex_replace', '^', truenas_pool ~ '/') | list) | zip(truenas_datasets | map(attribute='recordsize') | list) | map('join', ':') | sort | list }}"
        _live_rs: "{{ (_child | map(attribute='id') | list) | zip(_child | map(attribute='recordsize') | map(attribute='value') | list) | map('join', ':') | sort | list }}"

    - name: Report declared-vs-live drift
      ansible.builtin.debug:
        msg: "{{ _drift }}"

    # After an apply run there is no legitimate reason for anything to remain
    # missing. A silent partial apply is exactly what this topic keeps producing
    # (three "declared but never executed" bugs this week), so fail loudly.
    - name: Assert the box converged
      ansible.builtin.assert:
        that:
          - _drift.datasets_missing | length == 0
          - _drift.nfs_exports_missing | length == 0
          - _drift.snapshot_tasks_missing | length == 0
          - _drift.cron_jobs_missing | length == 0
          - not _drift.scrub_schedule_drift
          - _drift.recordsize_drift | length == 0
        fail_msg: "Apply finished but the box did not converge -- see the drift report above."
        success_msg: "Converged: every declared dataset, export, snapshot task, cron job and the scrub schedule are live."
      when: not ansible_check_mode
