---
# Inventory for the TrueNAS SCALE box.
#
# Replaces the Synology DS418 (192.168.1.2). Both stay live through the whole
# migration overlap; the Synology is not decommissioned until both restore-test
# gates pass. See blog/blog-truenas-migration-draft.md.
#
# NOTE ON THE ADMIN USER: TrueNAS 25.10 ships root login DISABLED by default and
# creates a `truenas_admin` account at install time. That account has sudo. Do
# NOT re-enable root SSH to make automation easier — the runbook's hardening
# phase explicitly forbids it, and `become` works fine from truenas_admin.

all:
  hosts:
    truenas:
      # MikroTik DHCP RESERVATION, not a TrueNAS static (chosen 2026-08-25).
      # Reserving at the router keeps eno1 on DHCP inside TrueNAS, which avoids a
      # static-address commit that would drop the SSH session mid-apply and leave
      # the 60s rollback timer un-checked-in -- the exact trap that ate an evening.
      # NOT .13 -- that is allocated to dns-secondary (see
      # ansible/technitium/inventory.yml). Frontnet allocations as of 2026-08-25:
      #   .1 gw | .2 Synology | .3 Mac mini | .4-.6 old node1-3 | .7-.9 node4-6
      #   .10-.11 future node7-8 | .12 dns-master | .13 dns-secondary | .25 truenas
      ansible_host: 192.168.1.25                       # frontnet/VLAN 5 mgmt (onboard 1G eno1)
      ansible_user: truenas_admin                      # install-time admin account; root SSH stays disabled
      # NOTE: id_rsa, not vadz_key -- the TrueNAS admin account was set up with a
      # different key than the Technitium boxes. Verified 2026-08-25. If you ever
      # unify these, add vadz_key.pub to truenas_admin FIRST and confirm it
      # authenticates before removing id_rsa, or the playbook loses its transport.
      ansible_ssh_private_key_file: ~/.ssh/id_rsa      # workstation-side key path; not committed
      ansible_python_interpreter: /usr/bin/python3

  vars:
    # NO become. Verified on the live box 2026-08-25: `truenas_admin` is a member
    # of `builtin_administrators` (gid 544), which is what authorises the
    # middleware socket -- so `midclt` works unprivileged. Confirmed OK for
    # interface.query, pool.query, pool.dataset.query, sharing.nfs.query,
    # system.general.config and service.query.
    #
    # This matters beyond tidiness: `sudo` on this box REQUIRES A PASSWORD
    # (`sudo -n true` -> "a password is required"), so a `become: true` role
    # would hang on the prompt or need the become password in the vault. Neither
    # is necessary. Do not "fix" a permission error by adding become -- if a
    # midclt method is refused, the account's ROLE is what to look at.
    ansible_become: false
