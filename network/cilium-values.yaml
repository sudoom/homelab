hubble:
  enabled: false
  metrics:
    enableOpenMetrics: true
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - port-distribution
    - icmp
    - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
  relay:
    enabled: false
  ui:
    enabled: false
# ingressController:
#   enabled: true
#   loadbalancerMode: dedicated
k8sServiceHost: kube-cp.homelab.net
k8sServicePort: 8443
rollOutCiliumPods: true
kubeProxyReplacement: true
# l2 integration
l2announcements:
  enabled: true
externalIPs:
  enabled: true
k8sClientRateLimit:
  qps: 50
  burst: 100
# loadBalancer:
#   l7:
#     backend: envoy
operator:
  prometheus:
    enabled: true
prometheus:
  enabled: true
# istio integration
cni:
  exclusive: false
socketLB:
  hostNamespaceOnly: true

