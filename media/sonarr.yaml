---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  ports:
    - port: 8989
  selector:
    app: sonarr

---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: sonarr-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "sonarr.homelab.net"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: sonarr
spec:
  hosts:
  - "sonarr.homelab.net"
  gateways:
  - sonarr-gateway
  http:
  - route:
    - destination:
        host: sonarr
        port:
          number: 8989
