# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: jellyfin
#   namespace: media
# spec:
#   ingressClassName: cilium
#   rules:
#   -  http:
#       paths:
#         - path: /
#           pathType: Prefix
#           backend:
#             service:
#               name: jellyfin
#               port:
#                 number: 8096

---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  ports:
    - port: 8096
  selector:
    app: jellyfin

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: media
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.8
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: 8096
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 8000Mi
            limits:
              memory: 12000Mi
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /data
            name: data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: data
        persistentVolumeClaim:
          claimName: media-data-pvc

---

---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: jellyfin-gateway
  namespace: media
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "jellyfin.homelab.net"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: jellyfin-vs
  namespace: media
spec:
  hosts:
  - "jellyfin.homelab.net"
  gateways:
  - jellyfin-gateway
  http:
  - route:
    - destination:
        host: jellyfin
        port:
          number: 8096
