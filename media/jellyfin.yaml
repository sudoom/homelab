apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          # envFrom:
          # - configMapRef:
          #     name: sonarr-config
          #     optional: false
          # - secretRef:
          #     name: vpn-creds
          #     optional: false
          image: lscr.io/linuxserver/jellyfin:10.9.5
          imagePullPolicy: IfNotPresent
          # livenessProbe:
          #   failureThreshold: 3
          #   initialDelaySeconds: 30
          #   tcpSocket:
          #     port: 8989
          #   timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: 8096
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 8000Mi
            limits:
              memory: 12000Mi
          securityContext:
            allowPrivilegeEscalation: true
            # capabilities:
            #   add:
            #   - NET_ADMIN
            privileged: true
          volumeMounts:

          - mountPath: /config
            name: config

          - mountPath: /data
            name: data

          # - name: tty
          #   mountPath: /tta

          # - name: "render-device"
          #   mountPath: "/dev/dri/renderD128"
        # - mountPath: /etc/localtime
        #   name: localtime
        #   readOnly: true
      # restartPolicy: Never
      # terminationGracePeriodSeconds: 30
      volumes:

      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc

      - name: data
        persistentVolumeClaim:
          claimName: media-data-pvc

      # - name: tty
      #   persistentVolumeClaim:
      #     claimName: jellyfin-config-pvc-jellyfin-0

      # - name: "render-device"
      #   hostPath:
      #     path: "/dev/dri/renderD128"
      # - hostPath:
      #     path: /etc/localtime
      #     type: ""
