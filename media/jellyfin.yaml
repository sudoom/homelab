kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  # annotations:
  #   cert-manager.io/issuer: ca-issuer
spec:
  ingressClassName: cilium
  # tls:
  #   - hosts:
  #     - jellyfin.homelab.net
  #     secretName: jellyfin-homelab-cert
  rules:
    # - host: jellyfin.homelab.net
  -  http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: jellyfin
              port:
                number: 8096
