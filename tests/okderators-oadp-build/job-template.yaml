# One build run = one Job (README.md). Example:
#   oc process --local -f tests/okderators-oadp-build/job-template.yaml \
#     -p MODE=full -p PIPELINE_BRANCH=oadp-1.6-4.22 \
#     -p DATE=$(date -u +%Y-%m-%d-%H%M%S) | oc -n okd-build create -f -
# MODE is lowercase and DATE is digits and dashes, so oadp-build-${MODE}-${DATE} is a valid
# DNS-1123 name; build.sh rejects anything else before doing work.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: okderators-oadp-build
  annotations:
    description: One-off okderators OADP 1.6 build run (tests/okderators-oadp-build/README.md)
objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: oadp-build-${MODE}-${DATE}
      namespace: okd-build
      labels:
        app.kubernetes.io/part-of: okderators-oadp-build
        okd-build/mode: ${MODE}
        okd-build/date: ${DATE}
    spec:
      backoffLimit: 0
      # 24 h: GitOps took 97 min for twelve images under powersave-experimental; this is nineteen,
      # two of the builds cross-compile ten binaries, and a deadline kill loses the whole build.
      activeDeadlineSeconds: 86400
      # No ttlSecondsAfterFinished: the pod and its log stay until the operator reads them.
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: okderators-oadp-build
            okd-build/mode: ${MODE}
            okd-build/date: ${DATE}
          annotations:
            openshift.io/required-scc: privileged
        spec:
          serviceAccountName: builder
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: build
              # Our copy in zot (amd64 only): quay re-pushes v5.8.9 daily and expires old digests within days.
              image: zot.apps.okd.sudops.pl/okd-test/podman/stable:v5.8.9-2026-10-26@sha256:68e4418474c7362e53000e1c6163bb4441c0ab15cf65d880cd6ffd2768143500
              command: ["/bin/bash", "/scripts/build.sh"]
              env:
                - name: MODE
                  value: ${MODE}
                - name: PIPELINE_REPO
                  value: ${PIPELINE_REPO}
                - name: PIPELINE_BRANCH
                  value: ${PIPELINE_BRANCH}
                - name: DATE
                  value: ${DATE}
                - name: REUSE_DATE
                  value: ${REUSE_DATE}
                - name: PRUNE
                  value: ${PRUNE}
                - name: BASE_REGISTRY
                  value: ${BASE_REGISTRY}
                - name: CATALOG_BRANCHES
                  value: ${CATALOG_BRANCHES}
                - name: BUNDLES
                  value: ${BUNDLES}
                - name: IMAGE_BRANCH
                  value: ${IMAGE_BRANCH}
                # Empty is harmless: common.sh uses ${OKD_VERSION:-default}, which treats empty as unset.
                - name: OKD_VERSION
                  value: ${OKD_VERSION}
                - name: BUILDAH_ISOLATION
                  value: chroot
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "10"
                  memory: 48Gi
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - name: build-storage
                  mountPath: /var/lib/containers
                  subPath: containers
                - name: build-storage
                  mountPath: /work
                  subPath: work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: build-storage
              persistentVolumeClaim:
                claimName: build-storage
            - name: scripts
              configMap:
                name: oadp-build-scripts
                defaultMode: 365 # 0555
parameters:
  - name: MODE
    description: full (build, smoke, push, bundle, verify), check (bundle and verify against the images of REUSE_DATE) or catalog (catalog edits, checks, test catalog image)
    required: true
  - name: PIPELINE_REPO
    description: okd-operator-pipeline repository to clone
    value: https://github.com/sudoom/okd-operator-pipeline.git
  - name: PIPELINE_BRANCH
    description: MODE=full and check; branch of PIPELINE_REPO to build (oadp-1.6-4.22 or oadp-1.6)
    value: ""
  - name: DATE
    description: YYYY-MM-DD-HHMMSS, new for every run (the image tags, the catalog image tag and the log files end in it)
    required: true
  - name: REUSE_DATE
    description: MODE=check only; the DATE of the full run whose images the bundle references
    value: ""
  - name: PRUNE
    description: MODE=full only; true (default) runs podman system prune -af first, false keeps the layers of an earlier run so a retry does not recompile them
    value: "true"
  - name: BASE_REGISTRY
    description: Push target; build.sh refuses anything outside zot.apps.okd.sudops.pl/okd-test
    value: zot.apps.okd.sudops.pl/okd-test
  - name: CATALOG_BRANCHES
    description: MODE=catalog only; okderators-catalog-index branches, passed to catalog-edit.sh
    value: ""
  - name: BUNDLES
    description: MODE=catalog only; one bundle per catalog branch, "<branch>=<bundle ref@digest> ...", passed to catalog-edit.sh
    value: ""
  - name: IMAGE_BRANCH
    description: MODE=catalog only; the catalog branch the test catalog image is built from, one of CATALOG_BRANCHES
    value: release-4.22
  - name: OKD_VERSION
    description: Leave empty (the branch's common.sh default). Only selects the payload cli image must-gather copies; the CSV version comes from oadp/build.sh
    value: ""
