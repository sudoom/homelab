# immich: verify the TrueNAS copy against the Synology original BEFORE cutting over.
# Runbook: README.md in this directory. Adapted from tests/keepers-truenas-migration/02-verify-job.yaml.
#
# Differences from the keepers version:
#   - not root, and no `apk add`: same image and reasons as 01-copy-job.yaml.
#   - the metadata diff ignores exactly one line, the root directory itself (`./`). The copy
#     deliberately leaves the dataset root's own mode/group/mtime alone, so that line is
#     expected and says nothing about the data.
#   - SAMPLE=all checksums EVERY file. The library is small and irreplaceable, so the full
#     byte check that was disproportionate for 1.7 TiB of torrents is cheap and right here.
#     Set SAMPLE to a number for a random sample once the library is large.
#
# Both volumes are mounted read-only. Exits non-zero unless every check passes.
# `oc -n immich delete job immich-nfs-verify --ignore-not-found` before every re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-nfs-verify
  namespace: immich
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: verify
          image: quay.io/openshift/origin-cli:4.22
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          env:
            - name: SAMPLE
              value: "all"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              for t in rsync find awk grep shuf sha256sum wc; do
                command -v "$t" >/dev/null 2>&1 || { echo "FATAL: '$t' is missing from this image"; exit 90; }
              done
              echo "=== 0. mounts (provenance for this log) ==="
              grep -E " /src | /dst " /proc/mounts | awk '{print "  " $2 "  <- " $1 "  (" $3 ")"}'

              echo "=== 1. counts ==="
              SF=$(find /src -type f | wc -l); DF=$(find /dst -type f | wc -l)
              SD=$(find /src -type d | wc -l); DD=$(find /dst -type d | wc -l)
              echo "  files: src=$SF dst=$DF"
              echo "  dirs : src=$SD dst=$DD"
              [ "$SF" = "$DF" ] && [ "$SD" = "$DD" ] && echo "  counts MATCH" || echo "  counts DIFFER"

              echo "=== 2. bytes (regular files only; directory sizes differ by filesystem) ==="
              SB=$(find /src -type f -printf "%s\n" | awk '{t+=$1} END {print t+0}')
              DB=$(find /dst -type f -printf "%s\n" | awk '{t+=$1} END {print t+0}')
              echo "  src=$SB  dst=$DB  delta=$((DB-SB))"

              echo "=== 3. metadata diff, src -> dst (0 == identical; the root dir line is ignored) ==="
              if rsync -naH --numeric-ids --itemize-changes /src/ /dst/ > /tmp/diff 2>/tmp/diff.err; then
                DC=$(grep -vc ' \./$' /tmp/diff || true)
                echo "  difference count: $DC"
                grep -v ' \./$' /tmp/diff | head -40 || true
              else
                echo "  *** rsync ITSELF FAILED (rc=$?) -- the count is MEANINGLESS."
                echo "  *** DO NOT CUT OVER. stderr:"; head -10 /tmp/diff.err
                DC=-1
              fi

              echo "=== 3b. entries on dst that are NOT on src (dry run, deletes nothing) ==="
              EX=$(rsync -naH --numeric-ids --delete --info=del /src/ /dst/ 2>/dev/null | grep -c "^deleting " || true)
              echo "  dst-only entries: $EX"

              echo "=== 4. content checksums (SAMPLE=$SAMPLE) ==="
              find /src -type f > /tmp/all
              if [ "$SAMPLE" = "all" ]; then cp /tmp/all /tmp/s; else shuf -n "$SAMPLE" /tmp/all > /tmp/s; fi
              echo "  checking $(wc -l < /tmp/s) of $(wc -l < /tmp/all) files"
              rc=0; ok=0
              while IFS= read -r f; do
                r=${f#/src/}
                if [ ! -f "$f" ]; then echo "  SKIP $r (vanished on src)"; continue; fi
                if [ ! -f "/dst/$r" ]; then echo "  FAIL $r (MISSING on dst)"; rc=1; continue; fi
                if a=$(sha256sum "$f" 2>/dev/null); then a=${a%% *}; else a=UNREADABLE-SRC; fi
                if b=$(sha256sum "/dst/$r" 2>/dev/null); then b=${b%% *}; else b=UNREADABLE-DST; fi
                if [ "$a" = "$b" ]; then ok=$((ok+1))
                else echo "  FAIL $r"; echo "       src=$a dst=$b"; rc=1; fi
              done < /tmp/s
              echo "  identical: $ok"

              echo "=== VERDICT ==="
              V=0
              [ "$SF" = "$DF" ] || { echo "  FAIL: file counts differ";  V=1; }
              [ "$SD" = "$DD" ] || { echo "  FAIL: dir counts differ";   V=1; }
              [ "$DC" = "0" ]   || { echo "  FAIL: metadata diff is $DC (want 0)"; V=1; }
              [ "$EX" = "0" ]   || { echo "  FAIL: $EX dst-only entries"; V=1; }
              [ "$rc" = "0" ]   || { echo "  FAIL: checksums";            V=1; }
              [ "$SB" = "$DB" ] || { echo "  FAIL: file bytes differ by $((DB-SB))"; V=1; }
              [ "$V" = "0" ] && echo "  ALL CHECKS PASSED" || echo "  DO NOT CUT OVER"
              exit "$V"
          volumeMounts:
            - {name: src, mountPath: /src, readOnly: true}
            - {name: dst, mountPath: /dst, readOnly: true}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits:   {memory: 1Gi}
      volumes:
        - name: src
          persistentVolumeClaim: {claimName: immich-library, readOnly: true}
        - name: dst
          persistentVolumeClaim: {claimName: immich-library-nfs, readOnly: true}
