# keepers: Synology NFS -> TrueNAS NFS bulk copy.
#
# MANUAL APPLY ONLY. Not registered in bootstrap/root-app -- ArgoCD must never
# own this, or a selfHeal could restart a copy mid-flight.
#
# Re-running this Job IS the resume mechanism. rsync skips files whose size and
# mtime already match, so a run interrupted by a node reboot, an OVN egress
# break or a stale mount costs only the re-scan of 4,493 files (seconds), not
# the 1.7 TiB. Delete the completed/failed Job object, then re-apply.
#
#   oc -n keepers delete job keepers-nfs-copy --ignore-not-found
#   oc -n keepers apply -f 01-copy-job.yaml
#   oc -n keepers logs -f job/keepers-nfs-copy
#
# Runs as root deliberately: -a preserves ownership, which needs root on the
# writing side, and the TrueNAS export sets maproot_user=root (verified
# 2026-08-28) so root is not squashed. The keepers `default` SA already holds
# the privileged SCC via components/apps/keepers/templates/scc-rbac.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: keepers-nfs-copy
  namespace: keepers
spec:
  backoffLimit: 0            # no silent retry -- re-apply deliberately (see above)
  activeDeadlineSeconds: 43200   # 12h ceiling; measured expectation is 4-6h
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: rsync
          image: docker.io/alpine:3.22
          # If this image will not pull, any image with rsync works -- the Job is
          # otherwise image-agnostic. Pod egress to the internet is known good
          # (cert-manager reaches Let's Encrypt from the pod network).
          securityContext:
            runAsUser: 0
          env:
            # Extra flags per phase. Bulk/catch-up passes: leave empty.
            # FINAL quiesced pass: "--delete" (dry-run it first, see README).
            - name: EXTRA
              value: ""
          # NOTE: keep this script free of inline comments -- the whole block
          # becomes one `sh -c` argv entry, so anything here shows up in `ps`
          # and makes the process table unreadable. Rationale lives in the YAML
          # comments above instead.
          #
          # -a   archive (perms, times, ownership, symlinks)
          # -H   preserve hardlinks. A NO-OP for keepers (measured: 0 hardlinked
          #      files) but kept so this command is byte-identical to the media
          #      run, where it is load-bearing (1,478 of 2,203 files).
          # NO -X. Dropped 2026-08-28 after it failed on every single path with
          #      lsetxattr(..., "security.selinux") -> Not supported (95). That
          #      xattr is not source data: the Synology stores nothing: the
          #      MOUNTING NODE's kernel synthesises a generic
          #      system_u:object_r:nfs_t:s0 label, identical on every file, and
          #      ZFS-over-NFS cannot hold it. Verified there are ZERO user.*
          #      xattrs anywhere in the tree, so -X preserved nothing while
          #      emitting one error per path and, fatally, leaving rsync with
          #      exit 23 -- which `set -e` turns into a FAILED Job on a copy
          #      that actually succeeded.
          # NO -A either, and for a different reason: the Synology tree does
          #      carry real POSIX ACLs (drwxrwxrwx+), but the effective mode is
          #      already 0777 and the sole consumer is one privileged container.
          # --numeric-ids  do NOT remap uid/gid through name lookups that differ
          #      between the two boxes. uid 1026 must stay uid 1026.
          # --partial      keep partial files so a resumed run continues them.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache rsync >/dev/null
              echo "=== MOUNTS (this is the go/no-go) ==="
              grep -E " /src | /dst " /proc/mounts | awk '{print "  " $2 "  <- " $1 "  (" $3 ")"}'
              echo "=== space ==="
              df -h /src /dst
              echo "=== rsync starting: $(date -u +%H:%M:%SZ) ==="
              rc=0
              time rsync -aH --numeric-ids --partial \
                   --info=progress2,stats2 --human-readable \
                   $EXTRA /src/ /dst/ || rc=$?
              echo "=== rsync exit $rc ==="
              case "$rc" in
                0)
                  echo "clean." ;;
                24)
                  echo "exit 24 = some source files VANISHED mid-copy."
                  echo "Expected on the bulk pass: transmission is live and"
                  echo "removes files as torrents are managed. The quiesced"
                  echo "delta pass in step 4 reconciles this. NOT a failure."
                  rc=0 ;;
                *)
                  echo "UNEXPECTED rsync exit $rc -- investigate before step 4."
                  echo "23 = partial transfer due to error (per-file failures)."
                  echo "12 = protocol/stream error.  30 = timeout." ;;
              esac
              echo "=== target after ==="
              df -h /dst
              exit "$rc"
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true      # the old volume is the rollback; never write it
            - name: dst
              mountPath: /dst
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits:   {memory: 1Gi}
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: keepers-data-pvc      # Synology 192.168.1.2:/volume1/kubenfs
            readOnly: true
        - name: dst
          persistentVolumeClaim:
            claimName: keepers-data-nfs      # TrueNAS 192.168.10.10:/mnt/tank/keepers
