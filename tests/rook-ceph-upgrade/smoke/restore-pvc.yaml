apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-restore
  namespace: rook-upgrade-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-nvme-block
  resources:
    requests:
      storage: 1Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: smoke-snap
