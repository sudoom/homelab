# Restores only the keepers PVCs (data mover: a DataDownload fills each Ceph volume) into
# rook-upgrade-restore. includeClusterResources false keeps it off cluster-scoped objects.
# The restore also recreates keepers-data-nfs there. It stays Pending by design: its PV
# (truenas-keepers-data) is a static NFS PV bound to the live claim and skipped by the volume policy.
# The checker must not mount it; it goes away with the namespace.
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: pre-rook-upgrade-check
  namespace: openshift-adp
spec:
  backupName: pre-rook-upgrade
  includedNamespaces:
    - keepers
  includedResources:
    - persistentvolumeclaims
  namespaceMapping:
    keepers: rook-upgrade-restore
  includeClusterResources: false
  restorePVs: true
