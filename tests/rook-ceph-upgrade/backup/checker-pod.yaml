# Mounts the two restored keepers Ceph PVCs (webtlo-data-pvc, transmission-config-pvc; never keepers-data-nfs)
# and prints `sha256  size  mtime  path` (mtime in epoch seconds, path relative to the volume root) for every
# regular file, sorted by path, one section per PVC. A file that cannot be read prints an `ERROR` line instead of
# being dropped, and so does a volume root that cannot be entered. bash globstar instead of find: ubi-minimal has
# bash and coreutils but no findutils. restricted-v2, runAsNonRoot, no fixed UID or fsGroup.
# The mounts are read-write on purpose (2026-11-04): the live keepers pods run as root, so the restored files
# are root-owned, and kubelet applies the pod's fsGroup (CSIDriver fsGroupPolicy File) only to writable mounts.
# Read-only, the first run got `cd: /mnt/webtlo: Permission denied`. The fsGroup pass changes group and mode bits
# on this throwaway copy only; content, size and mtime (the compared fields) stay as restored. The script writes
# nothing.
apiVersion: v1
kind: Pod
metadata:
  name: restore-checker
  namespace: rook-upgrade-restore
spec:
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: checker
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:312b02a8f8ad5bdd219849c3e854cc5191c92fb7b8ce9b30fe2daed2de849094
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          shopt -s globstar dotglob nullglob
          for vol in webtlo transmission; do
            echo "CHECK begin $vol"
            if ! cd "/mnt/$vol"; then echo "ERROR  $vol  cannot enter /mnt/$vol"; echo "CHECK end $vol"; continue; fi
            for f in **/*; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              if sum=$(sha256sum -- "$f" 2>&1) && meta=$(stat -c '%s  %Y' -- "$f" 2>&1); then
                echo "${sum%% *}  $meta  $f"
              else
                echo "ERROR  $vol  $f"
              fi
            done | LC_ALL=C sort -k4
            echo "CHECK end $vol"
          done
          exec sleep 36000
      volumeMounts:
        - name: webtlo
          mountPath: /mnt/webtlo
        - name: transmission
          mountPath: /mnt/transmission
  volumes:
    - name: webtlo
      persistentVolumeClaim:
        claimName: webtlo-data-pvc
    - name: transmission
      persistentVolumeClaim:
        claimName: transmission-config-pvc
