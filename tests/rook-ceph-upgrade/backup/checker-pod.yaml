# Mounts the two restored keepers Ceph PVCs read-only (webtlo-data-pvc, transmission-config-pvc; never
# keepers-data-nfs) and prints `sha256  size  mtime  path` (mtime in epoch seconds, path relative to the
# volume root) for every regular file, sorted by path, one section per PVC. A file that cannot be read
# prints an `ERROR` line instead of being dropped. bash globstar instead of find: ubi-minimal has bash and
# coreutils but no findutils. Same pod shape as the OADP drill writer (tests/oadp-1.6-drill/writer.yaml):
# restricted-v2, runAsNonRoot, no fixed UID or fsGroup; the platform applies fsGroup on mount, which is how
# the drill's restored volumes were read by a different namespace's UID.
apiVersion: v1
kind: Pod
metadata:
  name: restore-checker
  namespace: rook-upgrade-restore
spec:
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: checker
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:312b02a8f8ad5bdd219849c3e854cc5191c92fb7b8ce9b30fe2daed2de849094
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          shopt -s globstar dotglob nullglob
          for vol in webtlo transmission; do
            cd "/mnt/$vol"
            echo "CHECK begin $vol"
            for f in **/*; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              if sum=$(sha256sum -- "$f" 2>&1) && meta=$(stat -c '%s  %Y' -- "$f" 2>&1); then
                echo "${sum%% *}  $meta  $f"
              else
                echo "ERROR  $vol  $f"
              fi
            done | LC_ALL=C sort -k4
            echo "CHECK end $vol"
          done
          exec sleep 36000
      volumeMounts:
        - name: webtlo
          mountPath: /mnt/webtlo
          readOnly: true
        - name: transmission
          mountPath: /mnt/transmission
          readOnly: true
  volumes:
    - name: webtlo
      persistentVolumeClaim:
        claimName: webtlo-data-pvc
        readOnly: true
    - name: transmission
      persistentVolumeClaim:
        claimName: transmission-config-pvc
        readOnly: true
