# Removes the drill Backups AND their object-store metadata. A plain `delete backup`
# leaves the data in the bucket and the BSL sync recreates the CR (rehearsal, 2026-08-28).
# Apply only after every drill restore has been verified.
#
# Includes the one Backup that Schedule drill-schedule produced (Task 9 Step 5) before it was deleted,
# drill-schedule-20261103083008. Any other drill-schedule-<timestamp> Backup needs its own entry here.
apiVersion: velero.io/v1
kind: DeleteBackupRequest
metadata:
  name: drill-15-purge
  namespace: openshift-adp
spec:
  backupName: drill-15
---
apiVersion: velero.io/v1
kind: DeleteBackupRequest
metadata:
  name: drill-16-purge
  namespace: openshift-adp
spec:
  backupName: drill-16
---
apiVersion: velero.io/v1
kind: DeleteBackupRequest
metadata:
  name: drill-16-soak-purge
  namespace: openshift-adp
spec:
  backupName: drill-16-soak
---
apiVersion: velero.io/v1
kind: DeleteBackupRequest
metadata:
  name: drill-schedule-20261103083008-purge
  namespace: openshift-adp
spec:
  backupName: drill-schedule-20261103083008
