# One build run = one Job (README.md). Example:
#   oc process --local -f tests/okderators-cert-manager-build/job-template.yaml -p MODE=full \
#     -p PIPELINE_REPO=https://github.com/sudoom/okd-operator-pipeline -p PIPELINE_BRANCH=cert-manager-1.21 \
#     -p OPERATOR_COMMIT=<40 hex> -p CERT_MANAGER_COMMIT=<40 hex> \
#     -p DATE=$(date -u +%Y-%m-%d-%H%M%S) | oc -n okd-build create -f -
# MODE is lowercase and DATE is digits and dashes, so cert-manager-build-${MODE}-${DATE} is a valid
# DNS-1123 name (at most 47 characters); build.sh rejects anything else before doing work.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: okderators-cert-manager-build
  annotations:
    description: One-off okderators cert-manager build run (tests/okderators-cert-manager-build/README.md)
objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: cert-manager-build-${MODE}-${DATE}
      namespace: okd-build
      labels:
        app.kubernetes.io/part-of: okderators-cert-manager-build
        okd-build/mode: ${MODE}
        okd-build/date: ${DATE}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 43200
      # No ttlSecondsAfterFinished: the pod and its log stay until the operator reads them.
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: okderators-cert-manager-build
            okd-build/mode: ${MODE}
            okd-build/date: ${DATE}
          annotations:
            openshift.io/required-scc: privileged
        spec:
          serviceAccountName: builder
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: build
              # Our copy in zot (amd64 only): quay re-pushes v5.8.9 daily and expires old digests within days.
              image: zot.apps.okd.sudops.pl/okd-test/podman/stable:v5.8.9-2026-10-26@sha256:68e4418474c7362e53000e1c6163bb4441c0ab15cf65d880cd6ffd2768143500
              command: ["/bin/bash", "/scripts/build.sh"]
              env:
                - name: MODE
                  value: ${MODE}
                - name: PIPELINE_REPO
                  value: ${PIPELINE_REPO}
                - name: PIPELINE_BRANCH
                  value: ${PIPELINE_BRANCH}
                - name: OPERATOR_COMMIT
                  value: ${OPERATOR_COMMIT}
                - name: CERT_MANAGER_COMMIT
                  value: ${CERT_MANAGER_COMMIT}
                - name: DATE
                  value: ${DATE}
                - name: BASE_REGISTRY
                  value: ${BASE_REGISTRY}
                - name: CATALOG_BRANCHES
                  value: ${CATALOG_BRANCHES}
                - name: BUNDLES
                  value: ${BUNDLES}
                - name: IMAGE_BRANCH
                  value: ${IMAGE_BRANCH}
                # Empty is harmless: common.sh uses ${OKD_VERSION:-default}, which treats empty as unset.
                - name: OKD_VERSION
                  value: ${OKD_VERSION}
                - name: BUILDAH_ISOLATION
                  value: chroot
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "14"
                  memory: 48Gi
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - name: build-storage
                  mountPath: /var/lib/containers
                  subPath: containers
                - name: build-storage
                  mountPath: /work
                  subPath: work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: build-storage
              persistentVolumeClaim:
                claimName: cert-manager-build-storage
            - name: scripts
              configMap:
                name: cert-manager-build-scripts
                defaultMode: 365 # 0555
parameters:
  - name: MODE
    description: full (build, push, bundle, verify) or catalog (catalog edit, checks, test catalog image)
    required: true
  - name: PIPELINE_REPO
    description: okd-operator-pipeline repository to clone
    value: https://github.com/sudoom/okd-operator-pipeline
  - name: PIPELINE_BRANCH
    description: MODE=full only; branch of PIPELINE_REPO to build (cert-manager-1.21, from main, builds for OKD 5.0)
    value: ""
  - name: OPERATOR_COMMIT
    description: MODE=full only; the cert-manager/operator gitlink PIPELINE_BRANCH must record (full 40-character hash)
    value: ""
  - name: CERT_MANAGER_COMMIT
    description: MODE=full only; the cert-manager/cert-manager gitlink PIPELINE_BRANCH must record (full 40-character hash)
    value: ""
  - name: DATE
    description: YYYY-MM-DD-HHMMSS, new for every run (MODE=full image tags and the catalog image tag end in it)
    required: true
  - name: BASE_REGISTRY
    description: Push target; build.sh refuses anything outside zot.apps.okd.sudops.pl/okd-test
    value: zot.apps.okd.sudops.pl/okd-test
  - name: CATALOG_BRANCHES
    description: MODE=catalog only; okderators-catalog-index branches, passed to catalog-edit.sh
    value: ""
  - name: BUNDLES
    description: MODE=catalog only; one bundle per catalog branch, "<branch>=<bundle ref@digest> ...", passed to catalog-edit.sh
    value: ""
  - name: IMAGE_BRANCH
    description: MODE=catalog only; the catalog branch the test catalog image is built from, one of CATALOG_BRANCHES
    value: release-5.0
  - name: OKD_VERSION
    description: Leave empty. cert-manager/build.sh sets MAJOR=1 MINOR=21 itself; this only names the payload common.sh reads
    value: ""
