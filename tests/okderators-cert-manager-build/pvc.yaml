# Build storage of the okderators-cert-manager-build Jobs: podman graph root and /work (README.md).
# Applied with `oc apply -f tests/okderators-cert-manager-build/pvc.yaml`, not through kustomization.yaml.
# The namespace okd-build, ServiceAccount builder and the privileged RoleBinding are persistent and
# not part of this file. ceph-nvme-block, never node root disks (each node carries a mon).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cert-manager-build-storage
  namespace: okd-build
  labels:
    app.kubernetes.io/part-of: okderators-cert-manager-build
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-nvme-block
  resources:
    requests:
      storage: 150Gi
