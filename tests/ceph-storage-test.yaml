apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc-10
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-nvme-block
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test
  namespace: default
spec:
  containers:
    - name: test
      image: quay.io/ceph/ceph:v19.2.3
      command:
        - /bin/bash
        - -c
        - |
          echo "=== Writing 10GB test data ==="
          dd if=/dev/urandom of=/data/testfile bs=1M count=10240 status=progress
          echo "=== Done ==="
          ls -lh /data/testfile
          df -h /data
          echo "=== Sleeping for dashboard inspection ==="
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-test-pvc-10
