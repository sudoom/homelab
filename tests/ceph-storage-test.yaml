apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc-10
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-nvme-block
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-test
  namespace: default
spec:
  containers:
    - name: test
      image: quay.io/ceph/ceph:v19.2.3
      command:
        - /bin/bash
        - -c
        - |
          dnf install -y fio
          echo "=== Pre-creating 10GB test file ==="
          fallocate -l 10G /data/testfile
          echo "=== fio 4k QD1 fsync randwrite, 120s ==="
          fio --name=qd1-fsync --filename=/data/testfile \
              --rw=randwrite --bs=4k --iodepth=1 --numjobs=1 \
              --fsync=1 --direct=0 \
              --time_based --runtime=120 --group_reporting
          echo "=== Sleeping for dashboard inspection ==="
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-test-pvc-10
