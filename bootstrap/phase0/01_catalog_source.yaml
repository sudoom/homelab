---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: okderators
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  # Pinned per-OKD-minor. Bumped 4.21 -> 4.22 on 2026-10-29, after the control
  # plane reached 4.22.0-okd-scos.10 (2026-10-27); 4.20 -> 4.21 was 2026-09-08.
  # Applied by hand (`oc apply -f` this file) -- phase0 is manual bootstrap,
  # ArgoCD does not manage it.
  #
  # The flips are not a source of operator upgrades. The 4.21 flip generated zero
  # InstallPlans. For the three okderators subscriptions left (cert-manager-operator,
  # oadp-operator, cluster-kube-descheduler-operator) the release-4.22 catalog is
  # byte-identical to release-4.21 (catalog-index 98c6d9d), so the 4.22 flip is
  # expected to generate none either. Nothing downgrades -- OLM only walks the
  # graph forward and every okderators subscription is installPlanApproval: Manual.
  image: quay.io/okderators/catalog-index:4.22
  displayName: OKDerators
  publisher: OKD Community
  updateStrategy:
    registryPoll:
      interval: 60m
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: operatorhubio-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  # Source of the cloudnative-pg and kubernetes-nmstate-operator subscriptions
  # (both installPlanApproval: Automatic). Created by hand before this file held
  # it; brought under version control 2026-10-26 with the live spec unchanged
  # apart from the poll interval. Applied by hand, like okderators above.
  #
  # 24h, not 60m: every poll that finds a new digest of :latest pulls a fresh
  # copy of this index onto the catalog pod's node (node5), and the old copy
  # stays until the kubelet's image GC, which only starts at 85 % disk use --
  # past Ceph's 70 % mon warning (mon c runs on node5). The cost is that CNPG
  # and NMState upgrades arrive up to a day later. See
  # blog/blog-olmv1-catalog-cache-leak-draft.md, 2026-10-14 and 2026-10-26.
  image: quay.io/operatorhubio/catalog:latest
  displayName: OperatorHub.io Community Catalog
  publisher: OperatorHub.io
  updateStrategy:
    registryPoll:
      interval: 24h
