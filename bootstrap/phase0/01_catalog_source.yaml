---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: okderators
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  # Pinned per-OKD release. Bumped 4.22 -> 5.0 on 2026-11-10, after the cluster
  # reached 5.0.0-okd-scos.5 the same day; 4.21 -> 4.22 was 2026-10-29 and
  # 4.20 -> 4.21 2026-09-08. Applied by hand (`oc apply -f` this file) -- phase0
  # is manual bootstrap, ArgoCD does not manage it.
  #
  # The flips are not a source of operator upgrades. Two subscriptions still use
  # okderators: cert-manager-operator (release-5.0 carries the same 1.20 bundle
  # that is installed) and gitops-operator (the installed CSV, the 4.22 build
  # v1.22.0-2026-11-06-221018, is not an entry in release-5.0's channel; OLM keeps
  # an installed CSV with no candidate as AtLatestKnown, as on 2026-11-09). Nothing
  # downgrades -- OLM only walks the graph forward and every subscription is
  # installPlanApproval: Manual.
  image: quay.io/okderators/catalog-index:5.0
  displayName: OKDerators
  publisher: OKD Community
  updateStrategy:
    registryPoll:
      interval: 60m
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: operatorhubio-catalog
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  # Source of the cloudnative-pg and kubernetes-nmstate-operator subscriptions
  # (both installPlanApproval: Manual). Created by hand before this file held
  # it; brought under version control 2026-10-26 with the live spec unchanged
  # apart from the poll interval. Applied by hand, like okderators above.
  #
  # 24h, not 60m: every poll that finds a new digest of :latest pulls a fresh
  # copy of this index onto the catalog pod's node (node5), and the old copy
  # stays until the kubelet's image GC, which only starts at 85 % disk use --
  # past Ceph's 70 % mon warning (mon c runs on node5). The cost is that CNPG
  # and NMState upgrades arrive up to a day later. See
  # blog/blog-olmv1-catalog-cache-leak-draft.md, 2026-10-14 and 2026-10-26.
  image: quay.io/operatorhubio/catalog:latest
  displayName: OperatorHub.io Community Catalog
  publisher: OperatorHub.io
  updateStrategy:
    registryPoll:
      interval: 24h
