global:
  repoURL: git@github.com:sudoom/homelab.git
  targetRevision: master
  argocdNamespace: openshift-gitops
  clusterURL: https://kubernetes.default.svc

applications:
  # Wave 0 — Cluster topology
  node-labels:
    enabled: true
    path: components/cluster-config/node-labels
    namespace: default
    syncWave: "0"

  # Wave 1 — Operators (subscriptions + instances)
  nmstate-operator:
    enabled: true
    path: components/operators/nmstate
    namespace: openshift-nmstate
    syncWave: "1"

  cert-manager-operator:
    enabled: true
    path: components/operators/cert-manager
    namespace: cert-manager-operator
    syncWave: "1"

  rook-ceph-operator:
    enabled: true
    path: components/operators/rook-ceph
    namespace: rook-ceph
    syncWave: "1"

  # Wave 2 — Cluster config (depends on operators being ready)
  nmstate-nncp:
    enabled: true
    path: components/cluster-config/nmstate-nncp
    namespace: default
    syncWave: "2"

  cert-manager-config:
    enabled: true
    path: components/cluster-config/cert-manager-config
    namespace: cert-manager
    syncWave: "2"

  # Wave 3 — TLS consumers (depends on certs being issued)
  ingress-controller:
    enabled: true
    path: components/cluster-config/ingress-controller
    namespace: openshift-ingress-operator
    syncWave: "3"

  api-server:
    enabled: true
    path: components/cluster-config/api-server
    namespace: openshift-config
    syncWave: "3"

  # Wave 3 — Storage (depends on Rook operator + storage network)
  ceph-cluster:
    enabled: true
    path: components/storage/ceph-cluster
    namespace: rook-ceph
    syncWave: "3"

  ceph-storage-classes:
    enabled: true
    path: components/storage/ceph-storage-classes
    namespace: rook-ceph
    syncWave: "4"
