global:
  repoURL: git@github.com:sudoom/homelab.git
  targetRevision: master
  argocdNamespace: openshift-gitops
  clusterURL: https://kubernetes.default.svc

applications:
  # Wave 0 — Cluster topology
  node-labels:
    enabled: true
    path: components/cluster-config/node-labels
    namespace: default
    syncWave: "0"

  kubelet-config:
    enabled: true
    path: components/cluster-config/kubelet-config
    namespace: default
    syncWave: "0"

  automation-sa:
    enabled: true
    path: components/cluster-config/automation-sa
    namespace: default
    syncWave: "0"

  # Wave 1 — Operators (subscriptions + instances)
  nmstate-operator:
    enabled: true
    path: components/operators/nmstate
    namespace: openshift-nmstate
    syncWave: "1"

  cert-manager-operator:
    enabled: true
    path: components/operators/cert-manager
    namespace: cert-manager-operator
    syncWave: "1"

  rook-ceph-operator:
    enabled: true
    path: components/operators/rook-ceph
    namespace: rook-ceph
    syncWave: "1"

  grafana-operator:
    enabled: true
    path: components/operators/grafana
    namespace: grafana
    syncWave: "1"

  sealed-secrets:
    enabled: true
    path: components/operators/sealed-secrets
    namespace: sealed-secrets
    syncWave: "1"

  cnpg-operator:
    enabled: true
    path: components/operators/cnpg
    namespace: cnpg-system
    syncWave: "1"

  loki-operator:
    enabled: true
    path: components/operators/loki-operator
    namespace: openshift-operators-redhat
    syncWave: "1"

  cluster-logging-operator:
    enabled: true
    path: components/operators/cluster-logging
    namespace: openshift-logging
    syncWave: "1"

  # Wave 2 — Cluster config (depends on operators being ready)
  nmstate-nncp:
    enabled: true
    path: components/cluster-config/nmstate-nncp
    namespace: default
    syncWave: "2"

  cert-manager-config:
    enabled: true
    path: components/cluster-config/cert-manager-config
    namespace: cert-manager
    syncWave: "2"

  oauth-idp:
    enabled: true
    path: components/cluster-config/oauth-idp
    namespace: openshift-config
    syncWave: "2"

  # Disabled 2026-05-14: CephCluster is on `network.provider: host`, so
  # the multus NADs aren't referenced by any daemon. Chart kept in tree
  # in case a future round switches back to multus (would also need the
  # `ceph-shim` NNCP re-enabled in nmstate-nncp).
  ceph-network-attachments:
    enabled: false
    path: components/cluster-config/ceph-network-attachments
    namespace: rook-ceph
    syncWave: "2"

  # Wave 3 — TLS consumers (depends on certs being issued)
  ingress-controller:
    enabled: true
    path: components/cluster-config/ingress-controller
    namespace: openshift-ingress-operator
    syncWave: "3"

  api-server:
    enabled: true
    path: components/cluster-config/api-server
    namespace: openshift-config
    syncWave: "3"

  # Wave 3 — Storage (depends on Rook operator + storage network)
  # ceph-cluster + ceph-storage-classes were replaced by rook-ceph-cluster
  # (upstream subchart wrapper) at Phase C cutover 2026-05-13. Live
  # CephCluster / CephBlockPool / StorageClass resources stay across the
  # cutover via the Phase A `helm.sh/resource-policy: keep` annotations;
  # the new app then asserts ownership. Phase D cleanup removes these
  # disabled entries entirely. See blog/blog-rook-ceph-draft.md.
  ceph-cluster:
    enabled: false
    path: components/storage/ceph-cluster
    namespace: rook-ceph
    syncWave: "3"

  ceph-storage-classes:
    enabled: false
    path: components/storage/ceph-storage-classes
    namespace: rook-ceph
    syncWave: "4"

  rook-ceph-cluster:
    enabled: true
    path: components/storage/rook-ceph-cluster
    namespace: rook-ceph
    syncWave: "3"

  ceph-object-store:
    enabled: true
    path: components/storage/ceph-object-store
    namespace: rook-ceph
    syncWave: "4"

  nfs-csi:
    enabled: true
    path: components/storage/nfs-csi
    namespace: nfs-csi
    syncWave: "4"

  # Wave 5 — Monitoring + observability config
  # grafana-config / monitoring-config / gatus / logging-stack disabled
  # 2026-05-13 for the Multus-from-scratch CephCluster rebuild — every
  # one of these has PVCs on ceph-nvme-block that need to drain cleanly
  # before Ceph teardown. Re-enables come after fresh-cluster bootstrap.
  grafana-config:
    enabled: false
    path: components/cluster-config/grafana-config
    namespace: grafana
    syncWave: "5"

  monitoring-config:
    enabled: false
    path: components/cluster-config/monitoring-config
    namespace: openshift-monitoring
    syncWave: "5"

  smartctl-exporter:
    enabled: true
    path: components/cluster-config/smartctl-exporter
    namespace: smartctl-exporter
    syncWave: "5"

  mikrotik-exporter:
    enabled: true
    path: components/cluster-config/mikrotik-exporter
    namespace: mikrotik-exporter
    syncWave: "5"

  gatus:
    enabled: false
    path: components/cluster-config/gatus
    namespace: gatus
    syncWave: "5"

  logging-stack:
    enabled: false
    path: components/cluster-config/logging-stack
    namespace: openshift-logging
    syncWave: "5"

  # Wave 6 — Applications
  media:
    enabled: false
    path: components/apps/media
    namespace: media
    syncWave: "6"
