{{- range $name, $app := .Values.applications }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.global.repoURL }}
    targetRevision: {{ $.Values.global.targetRevision }}
    path: {{ $app.path }}
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: {{ $.Values.global.clusterURL }}
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Ignore the fields the StatefulSet controller defaults onto
  # `volumeClaimTemplates[]` without claiming managedFields ownership —
  # ServerSideDiff still flags them as drift otherwise (upstream
  # argoproj/argo-cd#9123). Legit changes to storageClassName / size /
  # accessModes are NOT in this list and still surface as drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].apiVersion'
        - '.spec.volumeClaimTemplates[].kind'
        - '.spec.volumeClaimTemplates[].metadata.creationTimestamp'
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].status'
    # HPA-managed Deployments: let the HorizontalPodAutoscaler own
    # .spec.replicas, or selfHeal reverts it to the chart value and fights the
    # HPA.
    #
    # OPT-IN, AND PER-DEPLOYMENT BY NAME, since 2026-09-07. It used to apply to
    # every Deployment in all 44 apps, which made a replica count something git
    # could not change ANYWHERE. The comment here already warned about that and
    # already named this fix; it took a second incident to actually apply it.
    #
    # What it costs when it is blanket: on 2026-09-06 the media, immich and
    # keepers Deployments were scaled to 0 for a benchmark window. Re-enabling
    # sync did not bring them back and never would have -- twelve workloads sat
    # at 0/0 while ArgoCD reported the apps Synced/Healthy with an EMPTY diff,
    # because the only differing field was the one field it was told not to
    # compare. The keepers migration lost a downtime window to the same thing in
    # August.
    #
    # There is exactly ONE HPA in this cluster (immich/immich-server, min 1
    # max 2), so this now lists that Deployment by name and nothing else. Adding
    # an HPA means adding its Deployment to `hpaDeployments` in values.yaml --
    # if you forget, selfHeal fights the HPA, which is loud and self-correcting.
    # Forgetting the opposite way (a blanket ignore) is silent, which is why the
    # default is off.
    #
    # RESIDUAL TRAP, and it is unavoidable rather than an oversight: an HPA
    # CANNOT scale a Deployment up from zero. The HPA controller reports
    # `ScalingActive=False  ScalingDisabled: scaling is disabled since the
    # replica count of the target is zero`. So for a Deployment listed here,
    # replicas is owned by neither git nor the HPA once it reaches 0, and it
    # stays down until someone scales it by hand:
    #     oc -n <ns> scale deploy/<name> --replicas=1
    # after which the HPA takes over again permanently.
    #
    # Observed 2026-09-07: scoping this ignore restored eleven of the twelve
    # Deployments that had been parked at 0 for a benchmark window; immich-server
    # was the twelfth and needed exactly that one manual nudge. Anything quiesced
    # to 0 that is ALSO HPA-managed needs a manual scale on the way back --
    # budget for it in the runbook rather than discovering it during a cutover.
{{- with $app.hpaDeployments }}
{{- range . }}
    - group: apps
      kind: Deployment
      name: {{ . }}
      jqPathExpressions:
        - '.spec.replicas'
{{- end }}
{{- end }}
{{- end }}
{{- end }}
