{{- range $name, $app := .Values.applications }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.global.repoURL }}
    targetRevision: {{ $.Values.global.targetRevision }}
    path: {{ $app.path }}
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: {{ $.Values.global.clusterURL }}
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Ignore the fields the StatefulSet controller defaults onto
  # `volumeClaimTemplates[]` without claiming managedFields ownership —
  # ServerSideDiff still flags them as drift otherwise (upstream
  # argoproj/argo-cd#9123). Legit changes to storageClassName / size /
  # accessModes are NOT in this list and still surface as drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].apiVersion'
        - '.spec.volumeClaimTemplates[].kind'
        - '.spec.volumeClaimTemplates[].metadata.creationTimestamp'
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].status'
    # HPA-managed Deployments (e.g. immich-server): let the HorizontalPodAutoscaler
    # own .spec.replicas — without this, selfHeal reverts it to the chart value and
    # fights the HPA. Apps without an HPA set replicas explicitly; nothing changes
    # it, so this ignore is a no-op for them -- WITH ONE TRAP, found 2026-08-29.
    #
    # It is a no-op only while nobody wants GIT to change a replica count. The
    # moment a chart tries to (a maintenance-mode flag, a quiesce switch, scaling
    # something to 0 declaratively), ArgoCD silently does not apply it and still
    # reports Synced/Healthy -- there is no drift, because the field is not
    # compared. The keepers migration lost a downtime window to exactly this:
    # a `quiesced` flag rendered replicas 0/1, ArgoCD ignored it, and the
    # Deployment could not be scaled back UP from git after the cutover.
    #
    # If a declarative replica change is ever needed, scope this ignore to the
    # HPA-managed apps that actually need it instead of all 44.
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.replicas'
{{- end }}
{{- end }}
