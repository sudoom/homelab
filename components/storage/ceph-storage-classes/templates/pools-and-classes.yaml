{{- range $name, $pool := .Values.blockPools }}
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: {{ $name }}
  namespace: rook-ceph
spec:
  failureDomain: {{ $pool.failureDomain }}
  deviceClass: {{ $pool.deviceClass }}
  replicated:
    size: {{ $pool.replicated.size }}
    requireSafeReplicaSize: true
  {{- with $pool.parameters }}
  parameters:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-{{ $pool.deviceClass }}-block
  annotations:
    {{- if $pool.default }}
    storageclass.kubernetes.io/is-default-class: "true"
    {{- end }}
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: {{ $.Values.clusterID }}
  pool: {{ $name }}
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: {{ $.Values.csiSecrets.provisionerSecret }}
  csi.storage.k8s.io/provisioner-secret-namespace: {{ $.Values.csiSecrets.namespace }}
  csi.storage.k8s.io/controller-expand-secret-name: {{ $.Values.csiSecrets.provisionerSecret }}
  csi.storage.k8s.io/controller-expand-secret-namespace: {{ $.Values.csiSecrets.namespace }}
  csi.storage.k8s.io/node-stage-secret-name: {{ $.Values.csiSecrets.nodeSecret }}
  csi.storage.k8s.io/node-stage-secret-namespace: {{ $.Values.csiSecrets.namespace }}
  csi.storage.k8s.io/fstype: {{ $.Values.fsType }}
reclaimPolicy: Delete
allowVolumeExpansion: true
{{- end }}
