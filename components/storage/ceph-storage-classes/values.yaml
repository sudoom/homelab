blockPools:
  nvme-replicated:
    failureDomain: host
    deviceClass: nvme
    replicated:
      size: 3
    parameters:
      bulk: "true"
      pg_num_min: "128"
    default: true

  # Uncomment when HDDs arrive
  # hdd-replicated:
  #   failureDomain: host
  #   deviceClass: hdd
  #   replicated:
  #     size: 3
  #   default: false

csiSecrets:
  provisionerSecret: rook-csi-rbd-provisioner
  nodeSecret: rook-csi-rbd-node
  namespace: rook-ceph

clusterID: rook-ceph
fsType: ext4

# StorageClass that provisions buckets in the CephObjectStore via OBC
# (ObjectBucketClaim). Consumers (Loki, OADP, apps) write a tiny OBC,
# get a fresh bucket plus a ConfigMap+Secret with endpoint+credentials
# in their own namespace.
objectBucket:
  enabled: true
  storageClassName: ceph-bucket
  objectStoreName: ceph-objectstore
  objectStoreNamespace: rook-ceph
  reclaimPolicy: Delete
