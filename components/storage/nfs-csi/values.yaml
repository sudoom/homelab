csi-driver-nfs:
  controller:
    replicas: 1
    runOnControlPlane: true
    dnsPolicy: ClusterFirstWithHostNet
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
  node:
    dnsPolicy: ClusterFirstWithHostNet
    tolerations:
      - operator: Exists

# ---- Synology DS418 (being replaced; keep live until it is sold) ----
nfs:
  server: 192.168.1.2
  share: /volume1/kubenfs

# ---- TrueNAS (replacing the Synology) ----
# Reachable on the CEPH BACKNET (VLAN 10, 192.168.10.0/24) rather than a
# dedicated NFS VLAN. This reverses the 2026-06-22 migration plan's "explicitly
# NOT the backnet" line, deliberately (2026-08-25):
#
#   * The nodes ALREADY hold 192.168.10.2/3/4 on enp1s0f0np0, so the mount is
#     on-link and needs NO NNCP change. Bringing up the spare enp1s0f1np1 for a
#     dedicated VLAN would have been an nmstate enactment = the br-ex.forwarding
#     cascade trigger (see CLAUDE.md network pre-flight). Avoiding that is worth
#     more than the segment isolation.
#   * The bandwidth objection does not hold: the bulk migration READS from the
#     1G-attached Synology, so it caps at ~118 MB/s -- under 10% of the 10G
#     backnet. OSD replication and heartbeats keep ample headroom.
#
# .10 stays clear of the nodes (.2-.4), the ceph-shim macvlans (.16-.18) and --
# importantly -- the 192.168.10.128/25 Multus pod range. Confirmed live
# 2026-08-25: all three nodes reachable from it, standard AND jumbo (9000, DF
# set), ARP REACHABLE in both directions.
# ACCEPTED COST: Ceph and the NAS now share a failure domain. A backnet
# incident (2026-07-25 node6 NIC down, 2026-08-07 switch firmware reboot)
# takes out both at once.
#
# Inert until `enabled: true` -- same gating precedent as the CNPG R2 work.
truenas:
  # Enabled 2026-08-28: the pool, datasets and NFS exports are live, maproot is
  # set, and backnet reachability + jumbo 9000 verified to all 3 nodes. The
  # classes are additive -- nothing consumes them until a PVC names one.
  enabled: true
  server: 192.168.10.10
  # One StorageClass per dataset, rendered as nfs-truenas-<name>.
  #
  # WHY ONE CLASS PER DATASET (corrected 2026-08-28 -- an earlier version of this
  # comment claimed the classes differ by recordsize and quota; they do NOT.
  # media/immich/keepers are all recordsize 1M, LZ4, quota 0):
  #
  # csi-driver-nfs's `share` is a STORAGECLASS-level parameter and cannot vary
  # per-PVC (verified against the driver's driver-parameters.md). So one class
  # == one share == one ZFS dataset. The classes are plural because the DATASETS
  # must be, and the datasets must be because their POLICIES differ:
  #   - media + immich have periodic snapshot tasks; keepers has none
  #   - media is "re-downloadable, no offsite"; immich is the irreplaceable one
  # Sharing a dataset would mean you cannot snapshot the photo library often
  # without also snapshotting 3.21 TiB of re-downloadable media, and cannot
  # `zfs send` immich offsite without dragging media with it.
  #
  # REJECTED ALTERNATIVE: one class + `subDir: ${pvc.metadata.namespace}/...`
  # (the driver does support that templating). It gives nicer paths but lands
  # every PVC in ONE dataset, destroying exactly the granularity above.
  #
  #
  # DECIDED 2026-08-28 — static PVs SHIPPED (behind `staticVolumes.enabled: false`).
  # They make /mnt/tank/media itself the data
  # root instead of /mnt/tank/media/pvc-<uuid>/ -- worth it because (a) under a
  # Retain class, deleting and recreating a PVC yields a NEW uuid directory and
  # silently orphans the old data, and (b) this pool is also browsed over SMB.
  # The catch: Velero's change-storage-class maps StorageClass NAMES, so the OADP
  # migration path requires a dynamic class. A direct PVC->PVC copy does not.
  # Statically-defined volumes for the known singleton consumers. Each gives the
  # dataset root directly to one named PVC -- no pvc-<uuid> layer. See the
  # template for the full rationale. Disabled until the data is actually staged;
  # a PV is harmless on its own but the matching PVC changes are not.
  #
  # NOTE the server is 192.168.10.10 (10G BACKNET) and that is correct here even
  # though the Velero BSL had to use the frontnet: NFS is kernel-mounted by the
  # hostNetwork csi-nfs-node, which reaches the backnet fine. Only pod-network
  # clients cannot. See CLAUDE.md.
  staticVolumes:
    enabled: true
    volumes:
      - name: media-data
        enabled: false
        share: /mnt/tank/media
        capacity: 8Ti          # ceiling only; the real limit is the ZFS dataset
        claim:
          namespace: media
          name: media-data-nfs-pvc
      - name: immich-library
        enabled: false
        share: /mnt/tank/immich
        capacity: 2Ti
        claim:
          namespace: immich
          name: immich-library-nfs
      - name: keepers-data
        enabled: true
        share: /mnt/tank/keepers
        # 2Ti, not the 500Gi originally shipped: keepers-data-pvc was MEASURED at
        # 1.7 TiB on 2026-08-29 (the old 50Gi PVC request was never enforced --
        # csi-driver-nfs just makes a subdirectory and `df` reports the whole
        # Synology volume). NFS does not enforce this number either, but it is
        # what `oc get pv` prints, and a figure 3.4x under reality is exactly the
        # sort of thing that misleads someone at 2 a.m. (Briefly set to 1Gi on
        # 2026-08-29 and restored: capacity is fiction for NFS, but it is NOT
        # inert -- the binding controller checks PV.capacity >= PVC.request even
        # when the PVC pins volumeName, so an undersized label leaves the PVC
        # Pending on a VolumeMismatch event rather than binding.)
        capacity: 2Ti
        claim:
          namespace: keepers
          name: keepers-data-nfs

  classes:
    - name: media
      share: /mnt/tank/media
    - name: immich
      share: /mnt/tank/immich
    # keepers is the CUTOVER REHEARSAL (README): smallest consumer, fully
    # re-downloadable, so a botched migration costs nothing but time. It is
    # exported by ansible/truenas but had no StorageClass until 2026-08-28,
    # which would have made the rehearsal unrunnable.
    - name: keepers
      share: /mnt/tank/keepers
