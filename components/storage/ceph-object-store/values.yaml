namespace: rook-ceph

# CephObjectStore — RGW deployment + the two pools it backs onto.
# metadataPool stays on NVMe permanently (small, IO-hot).
# dataPool starts on NVMe; flip to hdd once the chassis has bulk drives.
objectStore:
  name: ceph-objectstore

  metadataPool:
    failureDomain: host
    deviceClass: nvme
    replicated:
      size: 3

  dataPool:
    failureDomain: host
    deviceClass: nvme
    replicated:
      size: 3
    # Floor PGs at 32. The pg_autoscaler returns [] on this cluster (Squid
    # 19.2.3 quirk), so without an explicit floor the data pool sits at
    # pg_num=1 — every RGW write funnels through one primary OSD. Same
    # workaround we use on nvme-replicated. Bump if log volume grows past
    # what 32 PGs comfortably holds.
    parameters:
      pg_num_min: "32"

  # Preserve the pools+CR if the chart is uninstalled. RGW data isn't
  # a thing you accidentally delete — same posture as ceph-cluster.
  preservePoolsOnDelete: true

  gateway:
    instances: 1
    # In-cluster RGW listens on plain HTTP; TLS is terminated at the
    # OpenShift Route (edge). securePort: 0 disables RGW's own TLS.
    port: 80
    securePort: 0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# OpenShift Route exposing the RGW service on the wildcard cert.
# In-cluster S3 clients (Loki, OADP, etc.) can also use the in-cluster
# Service rook-ceph-rgw-<name>.rook-ceph.svc on port 80 directly.
route:
  enabled: true
  host: s3.apps.okd.sudops.pl
