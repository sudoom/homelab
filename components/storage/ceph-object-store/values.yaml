namespace: rook-ceph

# CephObjectStore — RGW deployment + the two pools it backs onto.
# metadataPool stays on NVMe permanently (small, IO-hot).
# dataPool flipped to hdd 2026-06-12 (Phase 3) now the HDD tier is live.
objectStore:
  name: ceph-objectstore

  metadataPool:
    failureDomain: host
    deviceClass: nvme
    replicated:
      size: 3

  dataPool:
    failureDomain: host
    deviceClass: hdd          # flipped nvme->hdd 2026-06-12 (Phase 3; HDD tier live). Migrates RGW data NVMe->HDD via backfill.
    replicated:
      size: 3
    # Floor PGs at 32. The pg_autoscaler returns [] on this cluster (Squid
    # 19.2.3 quirk), so without an explicit floor the data pool sits at
    # pg_num=1 — every RGW write funnels through one primary OSD. Same
    # workaround we use on nvme-replicated. Bump if log volume grows past
    # what 32 PGs comfortably holds.
    parameters:
      pg_num_min: "32"

  # Preserve the pools+CR if the chart is uninstalled. RGW data isn't
  # a thing you accidentally delete — same posture as ceph-cluster.
  preservePoolsOnDelete: true

  gateway:
    instances: 1
    # In-cluster RGW listens on plain HTTP; TLS is terminated at the
    # OpenShift Route (edge). securePort: 0 disables RGW's own TLS.
    port: 80
    securePort: 0
    # Host-network anti-affinity against the default IngressController
    # routers. The CephCluster is on `network.provider: host` (chosen
    # 2026-05-14 after the multus rebuild round), so RGW binds the host's
    # :80. Two of three nodes also host an openshift-ingress/router-default
    # pod on :80; without this rule, kube-scheduler can place RGW on a
    # router-co-located node and RGW crashloops forever with EADDRINUSE
    # (exit 98). 2026-05-12 Multus rollback rescheduled RGW onto node4
    # (router present); pod accumulated 214 restarts over ~21h before
    # discovery on 2026-05-13.
    # `required` (not `preferred`) is deliberate: co-residence is
    # functionally broken, so Pending+observable beats Running+silently-
    # failing. With 2 routers on a 3-node cluster, only one node is
    # router-free at a time — if that node becomes unavailable, RGW goes
    # Pending until either the node comes back or a router moves. That's
    # the right alarm shape.
    placement:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                ingresscontroller.operator.openshift.io/deployment-ingresscontroller: default
            namespaces:
              - openshift-ingress
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# OpenShift Route exposing the RGW service on the wildcard cert.
# In-cluster S3 clients (Loki, OADP, etc.) can also use the in-cluster
# Service rook-ceph-rgw-<name>.rook-ceph.svc on port 80 directly.
route:
  enabled: true
  host: s3.apps.okd.sudops.pl
