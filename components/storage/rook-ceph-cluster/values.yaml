# Upstream rook-ceph-cluster subchart values. Keys at this top level pass
# through to the subchart under its own `rook-ceph-cluster:` block via the
# Helm dependency mechanism — see https://helm.sh/docs/chart_template_guide/subcharts_and_globals/
rook-ceph-cluster:
  operatorNamespace: rook-ceph
  clusterName: rook-ceph

  toolbox:
    enabled: true
    # Inherit cephImage by default; explicit pin keeps the toolbox locked to
    # the same Ceph version as the cluster even across subchart upgrades.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "256Mi"

  monitoring:
    enabled: true
    # Replaces the vendored files/ceph-prometheus-rules.yaml in the old chart.
    createPrometheusRules: true

  # No labels/annotations on the CephCluster CR. The Phase-A migration
  # annotation lives on the *live* resource (added under the old chart);
  # ArgoCD's ServerSideApply removes it when the new chart asserts
  # ownership without rendering it, which is exactly the cleanup we want.
  cephClusterMetadata:
    annotations: {}
    labels: {}

  cephImage:
    repository: quay.io/ceph/ceph
    tag: v19.2.4
    allowUnsupported: false

  # Everything that goes verbatim into CephCluster.spec (the chart inserts
  # cephClusterSpec via `toYaml | nindent 2` after the monitoring + cephVersion
  # blocks it builds itself).
  cephClusterSpec:
    dataDirHostPath: /var/lib/rook

    mon:
      count: 3
      allowMultiplePerNode: false

    mgr:
      count: 2
      allowMultiplePerNode: false
      modules:
        - name: pg_autoscaler
          enabled: true
        - name: rook
          enabled: true
        - name: devicehealth
          enabled: true

    dashboard:
      enabled: true
      ssl: false
      port: 8080

    network:
      # provider: host with addressRanges pinning Ceph traffic to the
      # 10G backnet (enp1s0f0np0, 192.168.10.0/24). Without addressRanges,
      # Rook uses the K8s nodeIP for mon endpoints — that's the kubelet-
      # registered IP, which on these nodes is the 1G frontnet (192.168.1.x).
      # Ceph daemons then bind to whatever interface has IPs in that
      # subnet and ALL traffic (client + replication) gets pinned to the
      # 1G NIC, capping throughput at ~62 MB/s seqwrite / ~180 MB/s
      # seqread (measured 2026-05-14 on this exact hardware). With
      # addressRanges set, Rook writes public_network + cluster_network
      # into the Ceph config DB, daemons bind to whichever interface
      # has IPs in that range (enp1s0f0np0 / 192.168.10.0/24), and the
      # 10G NIC carries everything.
      #
      # CLAUDE.md "Network provider" section has the full chronology.
      # See also blog/blog-multus-ceph-migration-draft.md.
      #
      # Trade vs. multus: host-network Ceph daemons bind host ports, so
      # RGW collides with openshift-ingress/router-default on :80 on 2 of
      # 3 nodes. Mitigation: `required` podAntiAffinity in the
      # ceph-object-store chart pins RGW to the router-free node.
      provider: host
      addressRanges:
        public:
          - "192.168.10.0/24"
        cluster:
          - "192.168.10.0/24"

    cephConfig:
      global:
        # All four keys are required for our setup. Anything Ceph 19.x
        # already defaults (bluestore_cache_autotune, dashboard.ssl/port —
        # the latter pair is set redundantly by the `dashboard` block above)
        # has been trimmed out. osd_memory_target also dropped — defaults
        # to 4 GiB on Ceph 19 already.
        osd_pool_default_size: "3"
        osd_pool_default_min_size: "2"
        mon_allow_pool_delete: "true"

    placement:
      all:
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/master
            operator: Exists
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Exists

    resources:
      mon:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          memory: "2Gi"
      mgr:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          memory: "1Gi"
      osd:
        requests:
          cpu: "1"
          memory: "5Gi"
        limits:
          memory: "6Gi"
      prepareosd:
        requests:
          cpu: "500m"
          memory: "400Mi"
      crashcollector:
        requests:
          cpu: "100m"
          memory: "60Mi"
        limits:
          memory: "256Mi"

    storage:
      useAllNodes: false
      useAllDevices: false
      nodes:
        # OSD devices use SLOT-STABLE paths (not drive-specific by-id WWN) so a
        # drive replacement in the same slot REUSES the OSD instead of spawning a
        # new one: NVMe = /dev/nvme0n1 (one NVMe/node, deterministic); HDD =
        # /dev/disk/by-path/pci-...-ata-N (the SATA bay PORT, stable across the
        # sda/sdb reshuffle AND drive swaps — NOT /dev/sdX). by-id WWN stays the
        # ref for drive-SPECIFIC ops (wipe/SMART/gate), where you mean one disk.
        - name: "node4.okd.sudops.pl"
          devices:
            - name: "/dev/nvme0n1"
            # HDD bay removed 2026-09-08 (phase 4a of the HDD-tier decommission).
            # osd.3 held 0 PGs and `ceph osd safe-to-destroy 3` passed, so this is
            # NOT a degraded-window change -- `ceph osd out` moves zero data. The
            # device must leave the spec BEFORE the deployment is scaled down and
            # purged, or Rook recreates the OSD on its next reconcile.
            # Drive stays physically seated; the pull is a separate event (the
            # 3.5" bay is not hot-swap, so it costs a power-cycle, and every node
            # reboot re-trips the br-ex.forwarding cascade).
        - name: "node5.okd.sudops.pl"
          devices:
            - name: "/dev/nvme0n1"
            # HDD bay removed 2026-09-08 (phase 4a) -- osd.4. See node4 above.
        - name: "node6.okd.sudops.pl"
          devices:
            - name: "/dev/nvme0n1"
            - name: "/dev/disk/by-path/pci-0000:00:17.0-ata-1"   # 3.5" bay (HDD tier)

    disruptionManagement:
      managePodBudgets: true
      osdMaintenanceTimeout: 30
      manageMachineDisruptionBudgets: false

    removeOSDsIfOutAndSafeToRemove: false

  cephBlockPools:
    - name: nvme-replicated
      spec:
        failureDomain: host
        deviceClass: nvme
        replicated:
          size: 3
          requireSafeReplicaSize: true
        parameters:
          bulk: "true"
          pg_num_min: "128"
      storageClass:
        enabled: true
        name: ceph-nvme-block
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        parameters:
          imageFormat: "2"
          imageFeatures: layering
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/fstype: ext4

  # RETIRED 2026-09-07 (HDD-tier decommission, phase 3b).
  #
  # Was a single CephFilesystem `cephfs`: metadata replicated x3 on NVMe, one
  # bulk data pool `cephfs-bulk-hdd` erasure-coded 2+1 across the three HDD
  # OSDs, exposed as the RWX StorageClass `cephfs-hdd`.
  #
  # WHY IT GOES: its only consumer, media/media-data-pvc, moved to TrueNAS NFS
  # on 2026-08-30 and its retained 3.5 TiB was reclaimed 2026-09-07. RWX is
  # served by the NFS classes and no CephFS is planned, so the tier had no
  # purpose -- and the HDD OSDs it exists for are being pulled.
  #
  # THIS IS ONE-WAY. Recreating needs a manual
  # `ceph fs new cephfs cephfs-metadata <datapool> --force` FIRST: Ceph requires
  # --force for an EC default data pool and Rook will not pass it. Rook adopts
  # and manages the MDS afterwards, but cannot perform that first step.
  #
  # UNRESOLVED AT RETIREMENT, recorded so a future incident can connect it:
  # this tier could not serve concurrent multi-node RWX. Two pods on two nodes
  # gave one client persistent EACCES on statx -- 293 failures in 300s, no
  # recovery until the concurrency stopped. Not the MDS (fs Ready, no evictions
  # since August). Consistent with a blocklisted kernel client. Never root
  # caused, and the same behaviour could affect RBD, which IS production. See
  # the README TODO.
  cephFileSystems: []

  cephObjectStores: []

# ---------------------------------------------------------------------------
# Local templates (rendered alongside the subchart) — OpenShift-specific
# extras the upstream chart doesn't provide.

# Two StorageClasses for the CephFS two-tier filesystem, rendered by the local
# templates/cephfs-storageclasses.yaml. The upstream subchart renders only ONE
# SC per cephFileSystems[] entry, but the two-tier plan needs two SCs against
# the SAME filesystem (differing only in target data pool). `pool` MUST be the
# full rendered RADOS pool name (<fsName>-<dataPool>), not the bare data-pool
# name — the CSI driver takes it verbatim. Neither is the cluster default
# (ceph-nvme-block RBD stays default); RWX is requested explicitly.
# RETIRED 2026-09-07 with the filesystem above. Rendered the `cephfs-hdd` RWX
# StorageClass from templates/cephfs-storageclasses.yaml. Nothing references it:
# media/media-data-pvc and the storage-benchmark PVC were both reclaimed the
# same day.
cephfsStorageClasses:
  enabled: false
  fsName: cephfs
  classes: []

# OpenShift Route fronting the Ceph dashboard with edge TLS at
# ceph.apps.okd.sudops.pl. Upstream chart only ships Ingress + Gateway-API
# HTTPRoute, not openshift.io/v1 Route.
dashboardRoute:
  enabled: true
  host: ceph.apps.okd.sudops.pl

# RBAC granting openshift-monitoring/prometheus-k8s SA the verbs needed to
# scrape ServiceMonitor endpoints in rook-ceph. Upstream chart doesn't ship
# this because it's OpenShift-Prometheus-specific (vanilla k8s Prometheus
# uses its own SA + ClusterRole).
prometheusScrapeRBAC:
  enabled: true

# Local ServiceMonitor scraping the mgr's prometheus-module endpoint.
# Upstream chart relies on Rook's operator creating a `rook-ceph-exporter`
# SM (sidecar metrics, different surface). Keep this local one to avoid a
# silent metrics regression on cutover. Disable once we've confirmed the
# exporter SM covers everything our dashboards/alerts need.
mgrServiceMonitor:
  enabled: true

# Raw-bytes utilization alerts (two groups in one PrometheusRule):
#   1. Cluster-wide warning at 80% — fills the gap between rook's 85%
#      per-OSD nearfull and the 95% mon_osd_full_ratio backstop.
#   2. NVMe-tier (device_class=nvme) warning at 75% + critical at 85% —
#      the cluster-total rule is blind to a full NVMe tier (HDD capacity
#      dilutes it), which is how nvme-replicated hit OSD_FULL undetected
#      2026-07-05. Device-class-scoped + raw-bytes so it fires early,
#      while Prometheus is alive and fstrim can still reclaim.
# Rationale in templates/prometheusrule-cluster-utilization.yaml header.
clusterUtilizationAlert:
  enabled: true

# RETIRED 2026-09-07 (HDD-tier decommission, phase 3c). Rendered the
# `ceph-bucket` StorageClass that ObjectBucketClaims provisioned against the
# CephObjectStore. That object store is being deleted: its only two tenants,
# Loki's chunks and OADP's BackupStorageLocation, both moved to garage on
# TrueNAS the same day, and zero OBCs exist anywhere in the cluster.
#
# Left enabled it would render a StorageClass pointing at an object store that
# no longer exists -- a provisioner that accepts a claim and then fails.
objectBucket:
  enabled: false
  storageClassName: ceph-bucket
  # Secondary SC for buckets that must outlive their OBC (CNPG backups,
  # OADP). reclaimPolicy: Retain is hard-coded in the template; empty
  # string here skips the extra StorageClass.
  retainStorageClassName: ceph-bucket-retain
  objectStoreName: ceph-objectstore
  objectStoreNamespace: rook-ceph
  reclaimPolicy: Delete

# Bootstrap Job that adds Ceph's built-in RBD trash purge schedule (mgr
# scheduler, not a CronJob). Idempotent: skips if `every <interval>` is
# already present for the pool, or replaces with the configured interval
# if drifted. Upstream rook-ceph-cluster chart doesn't ship this — Ceph's
# trash-purge scheduler is opt-in via mgr config.
rbdTrashPurgeSchedule:
  enabled: true
  interval: "1h"
  pools:
    - nvme-replicated
  # Pinned to the same image we use for the cluster.
  image: quay.io/ceph/ceph:v19.2.4

# Pins the Ceph-internal `.mgr` pool to a device-class-specific CRUSH rule.
# Ceph creates `.mgr` itself, so no CR owns it and it defaults to
# `replicated_rule`, which targets bare `default` -- every device class. On
# 2026-09-07 that left two `.mgr` PGs on the HDD OSDs after every HDD pool had
# been deleted, which would have degraded the manager pool during the OSD
# removal instead of draining cleanly. A Job rather than a note because a fresh
# bootstrap recreates `.mgr` on the default rule and reintroduces it silently.
mgrPoolCrushRule:
  enabled: true
  pool: .mgr
  rule: nvme-replicated
  image: quay.io/ceph/ceph:v19.2.4

# Bootstrap Job that applies the canonical caps to the CSI RBD provisioner
# user, working around an upstream Rook 1.19.5 bug where the user is
# generated with missing `osd profile rbd` cap (full write-up in
# bugs/upstream-rook-csi-rbd-provisioner-missing-osd-cap.md). Idempotent
# because `ceph auth caps` replaces caps with the specified set — running
# it on an already-correct user is a no-op. Runs at sync-wave 10 so the
# cluster's mons are up and toolbox keyring is available.
#
# Generations to fix: Rook suffixes each CSI user with `.1`, `.2`, etc. on
# key rotation. Fresh bootstraps always produce `.1`. If a future rotation
# creates `.2`, add it here.
csiRbdProvisionerCapsFix:
  enabled: true
  image: quay.io/ceph/ceph:v19.2.4
  users:
    - client.csi-rbd-provisioner.1

# Bootstrap Job that bumps pg_num past 1 on the listed pools, working
# around the Squid 19.2.3 pg_autoscaler bug (full write-up in
# bugs/upstream-ceph-pg-autoscaler-bulk-ignored.md). Idempotent: skips
# any pool where pg_num is already >= floor. Runs at sync-wave 11 so it
# fires after the cluster is up + after the CephObjectStore at wave 4
# has had time to create its pools.
#
# nvme-replicated floor 128: 100 PGs/OSD × 3 OSDs / replication 3 = 100
#   → next pow2 = 128 (per Ceph's PG sizing formula).
# The rgw.buckets.data (floor 32) and cephfs-bulk-hdd (floor 64) entries were
#   removed 2026-09-07 when the object store and CephFS were retired. Leaving
#   them was not harmless: the Job blocks up to 600s per missing pool waiting
#   for it to appear, then fails and retries forever, which is what held
#   rook-ceph-cluster in Progressing after the pools were deleted.
pgNumFloor:
  enabled: true
  image: quay.io/ceph/ceph:v19.2.4
  pools:
    - name: nvme-replicated
      floor: 128
# VolumeSnapshotClass for CSI snapshots against the RBD pool. CNPG uses
# this for its volumeSnapshot backup method (shipped 2026-05-20 in lieu
# of the deprecated barmanObjectStore native path). Any other workload
# that wants CSI snapshots references this class name.
volumeSnapshotClass:
  enabled: true
  name: ceph-rbd-snapshot
  # clusterID == the rook-ceph namespace name == the operator-managed
  # ClusterCR name. All three are "rook-ceph" on this cluster.
  clusterID: rook-ceph
