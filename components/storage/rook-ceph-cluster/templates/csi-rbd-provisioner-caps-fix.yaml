{{- if .Values.csiRbdProvisionerCapsFix.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: csi-rbd-provisioner-caps-fix-bootstrap
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 30
  template:
    metadata:
      labels:
        app: csi-rbd-provisioner-caps-fix-bootstrap
    spec:
      # Same SA as the rbd-trash-purge Job — has admin keyring access via
      # the mounted rook-ceph-mon Secret.
      serviceAccountName: rook-ceph-default
      restartPolicy: OnFailure
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ceph
          image: {{ .Values.csiRbdProvisionerCapsFix.image | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              CEPH_CONFIG="/etc/ceph/ceph.conf"
              MON_CONFIG="/etc/rook/mon-endpoints"
              KEYRING_FILE="/etc/ceph/keyring"

              cat <<KEYEOF > "$KEYRING_FILE"
              [client.admin]
              key = $(cat /var/lib/rook-ceph-mon/secret.keyring)
              KEYEOF

              cat <<EOF > "$CEPH_CONFIG"
              [global]
              mon_host = $(cat "$MON_CONFIG" | sed 's/[a-z0-9_-]\+=//g; s/=/ /; s/  */ /g')

              [client.admin]
              keyring = $KEYRING_FILE
              EOF

              # Workaround for upstream Rook bug — file is at
              # bugs/upstream-rook-csi-rbd-provisioner-missing-osd-cap.md.
              # The csi-rbd-provisioner.<gen> user is generated by Rook
              # with only mgr+mon caps; missing osd cap hangs every
              # CreateVolume. ceph auth caps replaces caps with whatever
              # we specify, so this Job is idempotent — running it on a
              # user that already has correct caps is a no-op (same caps
              # restated).
              for USER in {{ range .Values.csiRbdProvisionerCapsFix.users }}{{ . | quote }} {{ end }}; do
                if ceph auth get "$USER" >/dev/null 2>&1; then
                  echo "[$USER] applying canonical caps"
                  ceph auth caps "$USER" \
                    mgr "allow rw" \
                    mon "profile rbd, allow command 'osd blocklist'" \
                    osd "profile rbd"
                  ceph auth get "$USER"
                else
                  echo "[$USER] does not exist yet — skipping (Rook will create on next reconcile)"
                fi
              done
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
            - name: mon-endpoint-volume
              mountPath: /etc/rook
            - name: ceph-admin-secret
              mountPath: /var/lib/rook-ceph-mon
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: ceph-config
          emptyDir: {}
        - name: mon-endpoint-volume
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: ceph-admin-secret
          secret:
            secretName: rook-ceph-mon
            items:
              - key: ceph-secret
                path: secret.keyring
{{- end }}
