{{- if .Values.objectBucket.enabled }}
# StorageClass that provisions buckets in the CephObjectStore owned by
# components/storage/ceph-object-store/ via ObjectBucketClaim. Parked with
# that chart since the object store was retired 2026-09-07; enable both
# together. Local to this chart rather than folded into upstream
# cephObjectStores[] because the CephObjectStore CR lives in a separate
# ArgoCD app.
#
# Two flavors:
#   ceph-bucket          reclaimPolicy: Delete — OBC delete = bucket wipe.
#                         Use for ephemeral / regeneratable data (Loki).
#   ceph-bucket-retain   reclaimPolicy: Retain — OBC delete = bucket kept.
#                         Use for stateful workloads where the bucket
#                         outlives the OBC (CNPG backups, OADP backups).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.objectBucket.storageClassName }}
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: {{ .Values.objectBucket.reclaimPolicy }}
parameters:
  objectStoreName: {{ .Values.objectBucket.objectStoreName }}
  objectStoreNamespace: {{ .Values.objectBucket.objectStoreNamespace }}
{{- if .Values.objectBucket.retainStorageClassName }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.objectBucket.retainStorageClassName }}
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Retain
parameters:
  objectStoreName: {{ .Values.objectBucket.objectStoreName }}
  objectStoreNamespace: {{ .Values.objectBucket.objectStoreNamespace }}
{{- end }}
{{- end }}
