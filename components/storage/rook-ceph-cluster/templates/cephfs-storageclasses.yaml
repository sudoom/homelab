{{- /*
  Two CephFS StorageClasses for the two-tier `cephfs` filesystem (Phase 4).
  The upstream rook-ceph-cluster subchart renders only ONE StorageClass per
  cephFileSystems[] entry, but the plan is ONE filesystem with TWO data pools
  (NVMe low-latency + HDD bulk) and TWO StorageClasses differing only in the
  target data pool. So both SCs ship here, values-driven (.Values.cephfsStorageClasses).

  CRITICAL: `pool` is the FULL rendered RADOS pool name `<fsName>-<dataPool>`
  (e.g. cephfs-bulk-hdd), NOT the bare data-pool name — the CSI driver
  uses it verbatim; a bare name points at a non-existent pool and every
  CreateVolume on that tier fails. clusterID == the rook-ceph namespace.
  CSI secrets match the cephfs provisioner/node secrets Rook creates.
*/ -}}
{{- if .Values.cephfsStorageClasses.enabled }}
{{- $ns := .Release.Namespace }}
{{- $fsName := .Values.cephfsStorageClasses.fsName }}
{{- range .Values.cephfsStorageClasses.classes }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # StorageClass parameters AND reclaimPolicy are immutable — if `pool`/`fsName`/
    # `reclaimPolicy` ever change, a plain apply fails ("updates to ... are
    # forbidden") and stalls ArgoCD. Replace=true ALONE is insufficient: it runs
    # `kubectl replace` (still an update → still forbidden on immutable fields).
    # Force=true adds `--force` → `kubectl replace --force` = delete+recreate,
    # which is what actually recreates the SC. SCs hold no data, so force-recreate
    # is safe (bound PVCs/PVs don't need the SC at runtime). Confirmed 2026-06-15
    # when the Delete→Retain change stuck on Replace=true alone.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: {{ $ns }}
  fsName: {{ $fsName }}
  pool: {{ .pool }}
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: {{ $ns }}
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: {{ $ns }}
  csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-publish-secret-namespace: {{ $ns }}
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: {{ $ns }}
  csi.storage.k8s.io/fstype: ext4
# Retain (not Delete) on the bulk tier: deleting a cephfs-hdd PVC must NOT
# destroy the CephFS subvolume data (e.g. the media library, 2026-06-15). A
# deleted PVC leaves a Released PV + orphan subvolume to purge manually — an
# accepted tradeoff so bulk data survives an accidental/erroneous PVC delete,
# matching the Retain behaviour the media data had on NFS. NOTE: changing
# reclaimPolicy needs the SC recreated (immutable field) — the Replace=true
# sync-option above handles that. Existing PVs keep the policy they were
# provisioned with; patch them to Retain separately (`oc patch pv … Retain`).
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
{{- end }}
{{- end }}
