{{- if .Values.mgrServiceMonitor.enabled }}
# Scrapes the active mgr's prometheus module on the mgr-dashboard Service.
# Rook 1.19's `monitoring.enabled: true` ships a `rook-ceph-exporter` SM
# automatically (scrapes the ceph-exporter sidecar), but does not ship a
# matching mgr-prometheus-module SM. Both surfaces export overlapping-but-
# different metric sets, so we keep this local SM to avoid a quiet metrics
# regression on cutover from the old chart.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rook-ceph-mgr
  namespace: rook-ceph
  labels:
    team: rook
spec:
  namespaceSelector:
    matchNames:
      - rook-ceph
  selector:
    matchLabels:
      app: rook-ceph-mgr
      rook_cluster: rook-ceph
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
{{- end }}
