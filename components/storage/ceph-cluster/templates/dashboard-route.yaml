{{- if .Values.dashboardRoute.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ceph-dashboard-tls
  namespace: rook-ceph
spec:
  secretName: ceph-dashboard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.dashboardRoute.host }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: route-tls-secret-reader
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ceph-dashboard-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: route-tls-secret-reader
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: route-tls-secret-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
spec:
  host: {{ .Values.dashboardRoute.host }}
  to:
    kind: Service
    name: rook-ceph-mgr-dashboard
  port:
    targetPort: https-dashboard
  tls:
    termination: reencrypt
    externalCertificate:
      name: ceph-dashboard-tls
{{- end }}
