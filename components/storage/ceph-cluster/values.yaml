cephVersion:
  image: quay.io/ceph/ceph:v19.2.3

dataDirHostPath: /var/lib/rook

mon:
  count: 3
mgr:
  count: 2

dashboard:
  enabled: true
  ssl: false
  port: 8080

network:
  # Step 1 of the host→multus migration (2026-05-12): provider blanked so Rook
  # accepts the subsequent flip to multus. Step 2 will set provider: multus +
  # selectors + flip public CIDR to 192.168.10.0/24. See blog/blog-multus-ceph-migration-draft.md.
  provider: ""
  public: "192.168.1.0/24"
  cluster: "192.168.10.0/24"

osd:
  memoryTarget: "4294967296"    # 4 GB

resources:
  mon:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"
  mgr:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
  osd:
    requests:
      cpu: "1"
      memory: "5Gi"
    limits:
      memory: "6Gi"

# Positional device name — stable across disk replacements (all nodes use NVMe slot 0)
nodes:
  - name: "node4.okd.sudops.pl"
    devices:
      - name: "/dev/nvme0n1"
  - name: "node5.okd.sudops.pl"
    devices:
      - name: "/dev/nvme0n1"
  - name: "node6.okd.sudops.pl"
    devices:
      - name: "/dev/nvme0n1"

toolbox:
  enabled: true

# Bootstrap Job that adds Ceph's built-in RBD trash purge schedule.
# Schedule lives in mgr config (not git), so this Job re-applies it on
# every chart sync — idempotent: skips if 'every <interval>' is already
# present for the pool. Sync wave 10 = after CephCluster + pools are up.
rbdTrashPurgeSchedule:
  enabled: true
  interval: "1h"
  pools:
    - nvme-replicated

dashboardRoute:
  enabled: true
  host: ceph.apps.okd.sudops.pl
