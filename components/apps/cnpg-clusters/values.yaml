# Per-app PostgreSQL Cluster CRs managed by CloudNativePG.
#
# Pattern A (shared cluster, single user, multiple databases): one Cluster
# per namespace (or per logical grouping), with all consumer databases
# pre-created via postInitApplicationSQL and owned by the same app user.
# Consumers reference different MainDb/LogDb names via their own env vars.
#
# Trade-off vs Pattern B (per-user roles): no DB-level isolation between
# apps in the same Cluster — acceptable in a single-namespace homelab; if
# isolation becomes important later, refactor by adding managed.roles +
# Database CRs without rebuilding the Cluster.
#
# Each entry under `clusters:` renders one Cluster CR. CNPG auto-generates:
#   <cluster>-app                Secret (username, password for the app user)
#   <cluster>-superuser          Secret (superuser creds — operator use only)
#   <cluster>-rw / -ro / -r      Services (rw = primary; ro = sync replicas;
#                                          r  = round-robin across all)
#   <cluster>-<n>                Pods (1..instances, one per node via
#                                       built-in PodAntiAffinity)
#
# Sync-wave: 5 (after CNPG operator at wave 1, after Ceph storage at wave 3,
# before consumer apps at wave 6).

clusters:
  media-postgres:
    enabled: true
    namespace: media
    # 3 instances: 1 primary + 2 hot-standby replicas, one per node via
    # CNPG's default pod anti-affinity. Total storage = instances × size,
    # all on ceph-nvme-block (3-way replicated underneath). Stream
    # replication between Postgres instances stays on the K8s pod network
    # (routes via OVN-K → host stack → backnet per today's routingViaHost
    # change, so PG replication uses the 10G backnet).
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:18
    storage:
      size: 10Gi
      storageClass: ceph-nvme-block
    # CNPG ships a Prometheus exporter sidecar; enablePodMonitor: true
    # creates a PodMonitor CR that the user-workload Prometheus picks up
    # automatically (monitoring-config app already wires the SCC + RBAC).
    monitoring:
      enabled: true
    bootstrap:
      database: media
      owner: media
      postInitApplicationSQL:
        # Servarr apps need two DBs each (main + log). Pre-create all of
        # them owned by the shared `media` user. Toggle each app's
        # postgres block in the media chart's values to actually use
        # these — having the DBs sitting empty is harmless.
        # Bazarr left on SQLite (Python/Flask, different env var shape)
        # — no bazarr-main/log DBs here.
        - CREATE DATABASE "sonarr-main" OWNER media
        - CREATE DATABASE "sonarr-log" OWNER media
        - CREATE DATABASE "radarr-main" OWNER media
        - CREATE DATABASE "radarr-log" OWNER media
        - CREATE DATABASE "prowlarr-main" OWNER media
        - CREATE DATABASE "prowlarr-log" OWNER media
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # CSI volume snapshots against ceph-nvme-block (Rook-Ceph RBD).
    # No PITR; restore granularity == schedule cadence (daily). The
    # 2026-05-20 OSD_FULL incident pushed us off barman (eats RGW +
    # CNPG 1.30 deprecates native barman + upstream plugin still ships
    # :testing:main images), and the servarr config-DB workload doesn't
    # need PITR — daily snapshot, lose <24h on disaster, accept.
    backup:
      enabled: true
      volumeSnapshotClassName: ceph-rbd-snapshot
      # 7d retention vs the previous 30d barman target — snapshots are
      # CoW but compound on the same nvme-replicated pool as live data.
      # 7 base-states × ~10 GiB cluster = ~70 GiB worst-case raw delta
      # × 3 replication = 210 GiB ceiling. Well within today's headroom.
      retentionPolicy: "7d"
      scheduledBackup:
        # 04:00 UTC daily = 05:00 / 06:00 local (CET/CEST). Quiet hour
        # for the media stack; ahead of any morning use.
        schedule: "0 0 4 * * *"
