{{- range $name, $cluster := .Values.clusters }}
{{- if and $cluster.enabled $cluster.backup $cluster.backup.objectStore $cluster.backup.objectStore.enabled }}
# Per-cluster WAL-archiving-failure alert. Surfaced by the 2026-07-02 node4
# outage: a node power-cycle re-tripped the OVN ovnkube-node egress break, which
# SILENTLY killed R2 WAL archiving on both CNPG clusters for ~2 days with NO
# alert; the un-archivable WAL then filled media-postgres's PVC → CNPG
# "Not enough disk space" safe-mode deadlock (grew 10Gi→20Gi to recover; see
# blog/blog-cnpg-draft.md 2026-07-02).
#
# Signal: `cnpg_pg_stat_archiver_failed_count` (from the cnpg-default-monitoring
# `pg_stat_archiver` query). Postgres routes archive_command through the CNPG
# instance manager → the barman-cloud plugin; when the R2 push fails (egress
# break, creds, endpoint) the manager returns non-zero and pg_stat_archiver's
# failed_count increments. `increase() > 0` = archiving is FAILING RIGHT NOW
# (a cumulative-count threshold would latch on a long-recovered past failure;
# increase() also handles counter resets on pod failover). No idle-DB false
# positive (unlike last_archived_time age): failed_count only moves on real
# failed attempts.
#
# WAL-fill is DOWNSTREAM of this — media took ~2 days of failed archiving to
# fill 10Gi, so this fires with days of lead before the PVC-full deadlock. The
# README's PVC-%used backstop needs platform `kubelet_volume_stats_*` (NOT
# visible to user-workload Prometheus, which is where this rule evaluates), and
# node-NotReady is already covered by the platform `KubeNodeNotReady` default —
# both are downstream of the missing-delivery gap (no external Alertmanager
# route), tracked separately in README. This archiver alert is the genuinely
# missing, UWM-buildable early-warning.
#
# Lives in the cluster's own namespace: UWM enforces namespace-isolation on
# user PrometheusRules, so it auto-scopes to this namespace's metrics.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}-wal-archive
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/part-of: cnpg-clusters
    role: alert-rules
spec:
  groups:
    - name: cnpg-wal-archiving
      rules:
        - alert: CNPGWALArchiveFailing
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL archiving to R2 failing ({{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}})"
            description: |
              pg_stat_archiver.failed_count on {{`{{ $labels.pod }}`}} has been
              increasing for 15m — WAL archiving to Cloudflare R2 is failing, so
              offsite PITR backup has stopped and un-archivable WAL is beginning
              to accumulate on the instance PVC.

              Most likely cause on this cluster: pod→external egress broke after a
              node outage (the OVN ovnkube-node egress cascade). Fix: restart all
              3 `ovnkube-node` pods, then confirm archiving resumes (failed_count
              stops climbing). Verify via the barman sidecar logs + the bucket,
              NOT CNPG status conditions. Runbook: blog/blog-cnpg-draft.md 2026-07-02.
        - alert: CNPGWALArchiveFailingCritical
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[15m]) > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "CNPG WAL archiving to R2 failing >1h ({{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}})"
            description: |
              WAL archiving has been failing continuously for over an hour on
              {{`{{ $labels.pod }}`}}. Un-archivable WAL is accumulating toward a
              PVC-full deadlock — once the WAL volume fills, CNPG enters
              "Not enough disk space" safe-mode and will NOT auto-expand from that
              state (reconcile bails before the resize step).

              Act now: restore egress (restart all 3 `ovnkube-node`); confirm the
              WAL backlog drains; if the instance PVC is near full, `oc patch` its
              `spec.resources.requests.storage` larger (RBD allowVolumeExpansion=true)
              BEFORE the deadlock, then bounce the pod to remount the grown fs.
              Full recovery order: blog/blog-cnpg-draft.md 2026-07-02.
{{- end }}
{{- end }}
