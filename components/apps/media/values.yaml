namespace: media
domain: apps.okd.sudops.pl

storage:
  configClass: ceph-nvme-block
  # Shared RWX media /data volume. Moved off Synology NFS (nfs-csi) onto the
  # in-cluster CephFS EC-2+1 HDD bulk tier (cephfs-hdd) 2026-06-15 — CephFS is
  # natively RWX so every media app shares one PVC. dataSize is now a REAL
  # quota (NFS ignored it; the old 500Gi nominal held ~90 GiB of downloads).
  # The cephfs-bulk-hdd EC pool shares the 3 HDD OSDs with the RGW object pool
  # (Loki chunks + future OADP/CNPG backups), so keep this modest: CephFS-used
  # (×1.5 EC raw) + RGW-used (×3 repl raw) must stay well under the ~10.9 TiB
  # HDD raw with Ceph nearfull (85%) headroom. 2Ti = hot-subset ceiling; raise
  # only after checking `ceph df` HDD headroom. The bulk library stays on NAS.
  dataClass: cephfs-hdd
  dataSize: 2Ti

apps:
  bazarr:
    enabled: true
    image: lscr.io/linuxserver/bazarr:1.5.6
    port: 6767
    configSize: 1Gi
    readinessPath: /login
    resources:
      requests:
        cpu: 60m
        memory: 256Mi
      limits:
        memory: 500Mi
    mountData: true

  sonarr:
    enabled: true
    image: lscr.io/linuxserver/sonarr:4.0.17
    port: 8989
    configSize: 5Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
      limits:
        memory: 1000Mi
    mountData: true
    # PUID=0/PGID=0 → linuxserver s6 skips the privilege drop, Sonarr runs as
    # root. On the CephFS shared volume (since 2026-06-15) the subvolume root
    # is owned root:root 0755, so the default `abc` user can't create the
    # /data tree — running as root sidesteps it. (Previously this was a
    # Synology NFSv4 root-squash/idmap workaround.) Future cleanup: set a
    # securityContext.fsGroup + non-root PUID instead of running as root.
    puid: "0"
    pgid: "0"
    # Sonarr v4 native Postgres backend. Shared Cluster CR shipped from
    # components/apps/cnpg-clusters (cluster name: media-postgres). All
    # servarr apps share one Cluster + one user (`media`), each app uses
    # its own MainDb + LogDb. envPrefix = .NET IConfiguration root name.
    postgres:
      enabled: true
      envPrefix: Sonarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: sonarr-main
      logDb: sonarr-log

  radarr:
    enabled: true
    image: lscr.io/linuxserver/radarr:6.2.1
    port: 7878
    configSize: 1Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: true
    # Same root-on-CephFS access as Sonarr — see sonarr.puid above.
    puid: "0"
    pgid: "0"
    postgres:
      enabled: true
      envPrefix: Radarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: radarr-main
      logDb: radarr-log

  prowlarr:
    enabled: true
    image: lscr.io/linuxserver/prowlarr:2.4.0
    port: 9696
    configSize: 1Gi
    readinessPath: /
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: false
    postgres:
      enabled: true
      envPrefix: Prowlarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: prowlarr-main
      logDb: prowlarr-log

  jellyfin:
    enabled: true
    # OFFICIAL jellyfin image (migrated off lscr.io/linuxserver 2026-06-15). The
    # official image has NO s6/PUID and a DIFFERENT default dir layout, so the
    # JELLYFIN_*_DIR env below is MANDATORY to reuse the existing linuxserver-laid-out
    # /config (CONFIG=/config, DATA=/config/data → jellyfin adds its own data/ subdir
    # so DBs resolve at /config/data/data/jellyfin.db). Without these env the official
    # image launches the first-run setup wizard on an empty library. Runs as root
    # (official:true → runAsUser:0) so it reads the existing 911:911/root files with
    # no chown. The 10.11.x migration-crash note still applies: /config/migrations.xml
    # is renamed to .broken (carried over in /config). Same 10.11.8 on both images so
    # no DB schema migration on cutover. Full saga + image rationale:
    # blog/blog-hdd-tier-rollout-draft.md 2026-06-15 section.
    image: jellyfin/jellyfin:10.11.11
    official: true
    env:
      JELLYFIN_CONFIG_DIR: /config
      JELLYFIN_DATA_DIR: /config/data
      JELLYFIN_CACHE_DIR: /config/cache
      JELLYFIN_LOG_DIR: /config/log
      JELLYFIN_FFmpeg: /usr/lib/jellyfin-ffmpeg/ffmpeg
    port: 8096
    configSize: 30Gi
    readinessPath: /web/index.html
    readinessInitialDelay: 15
    resources:
      requests:
        cpu: 100m
        memory: 8000Mi
      limits:
        memory: 12000Mi
    mountData: true
    # No PUID/PGID — the official image has no s6 user-remap (the linuxserver-only
    # vars are ignored). Runs as root via securityContext (official:true →
    # runAsUser:0); root writes the CephFS /data subvolume root + existing /config.
    # Intel QuickSync (QSV) HW transcoding on the i7-11700 / UHD 750 iGPU.
    # hwAccel=true gives this pod (only) a hostPath mount of the host's
    # /dev/dri (renderD128 is 0666, pod is privileged + root, so QSV works
    # with no device-plugin) + an ephemeral /transcode emptyDir for transcode
    # scratch (fast node-local, avoids EC write-churn on cephfs-bulk-hdd and
    # pressure on the 30Gi config PVC). Set Jellyfin Transcode path=/transcode.
    # All 3 nodes have the same iGPU, so no nodeSelector is needed.
    hwAccel: true
    # Size cap for the ephemeral /transcode emptyDir (node root disk, ~233Gi
    # free per node). 100Gi headroom for large 4K remux transcodes / the
    # segment-deletion-off case; with Delete-segments on the real working set
    # is far smaller. If exceeded, the pod is evicted (sizeLimit semantics).
    transcodeSize: 100Gi

  transmission:
    enabled: true
    image: haugene/transmission-openvpn:5.4.1
    port: 9091
    configSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 1500Mi
      limits:
        memory: 2000Mi
    # Multi-instance: each instance is an independent Deployment with its
    # own config PVC, both mounting the shared media-data-pvc. Sharing the
    # VPN-creds Secret + the transmission-config ConfigMap. Two instances
    # share the same NORDVPN egress; if a third is added later, consider
    # spreading countries to avoid IP collision on the same exit node.
    #
    # configPvcName override: master reuses the existing `transmission-config-pvc`
    # to preserve its state across the rename (the old Deployment was named
    # `transmission`, pruned by ArgoCD; the PVC stays because we still
    # render it in the chart). Slave defaults to `transmission-slave-config-pvc`.
    instances:
      - name: master
        host: media-download
        configPvcName: transmission-config-pvc
      - name: slave
        host: media-download-slave
