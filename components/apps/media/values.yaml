namespace: media
domain: apps.okd.sudops.pl

storage:
  configClass: ceph-nvme-block
  dataClass: nfs-csi
  dataSize: 500Gi

apps:
  bazarr:
    enabled: true
    image: lscr.io/linuxserver/bazarr:1.5.6
    port: 6767
    configSize: 1Gi
    readinessPath: /login
    resources:
      requests:
        cpu: 60m
        memory: 256Mi
      limits:
        memory: 500Mi
    mountData: true

  sonarr:
    enabled: true
    image: lscr.io/linuxserver/sonarr:4.0.17
    port: 8989
    configSize: 5Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
      limits:
        memory: 1000Mi
    mountData: true

  radarr:
    enabled: true
    image: lscr.io/linuxserver/radarr:6.1.1
    port: 7878
    configSize: 1Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: true

  prowlarr:
    enabled: true
    image: lscr.io/linuxserver/prowlarr:2.0.5
    port: 9696
    configSize: 1Gi
    readinessPath: /
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: false

  jellyfin:
    enabled: true
    image: lscr.io/linuxserver/jellyfin:10.10.7
    port: 8096
    configSize: 30Gi
    readinessPath: /web/index.html
    readinessInitialDelay: 15
    resources:
      requests:
        cpu: 100m
        memory: 8000Mi
      limits:
        memory: 12000Mi
    mountData: true

  transmission:
    enabled: true
    image: haugene/transmission-openvpn:5.3.2
    port: 9091
    configSize: 5Gi
    host: media-download
    resources:
      requests:
        cpu: 100m
        memory: 1500Mi
      limits:
        memory: 2000Mi
    mountData: true
