namespace: media
domain: apps.okd.sudops.pl

storage:
  configClass: ceph-nvme-block
  dataClass: nfs-csi
  dataSize: 500Gi

apps:
  bazarr:
    enabled: true
    image: lscr.io/linuxserver/bazarr:1.5.6
    port: 6767
    configSize: 1Gi
    readinessPath: /login
    resources:
      requests:
        cpu: 60m
        memory: 256Mi
      limits:
        memory: 500Mi
    mountData: true

  sonarr:
    enabled: true
    image: lscr.io/linuxserver/sonarr:4.0.17
    port: 8989
    configSize: 5Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
      limits:
        memory: 1000Mi
    mountData: true
    # PUID=0/PGID=0 → linuxserver s6 skips the privilege drop, Sonarr
    # runs as root. Synology NFSv4 export squashes root → admin (the only
    # path that works since NFSv4 idmap doesn't recognize the abc user).
    # Without this, Sonarr's `Directory.Exists` on /data/media/anime
    # returns false even though the dir exists at 0777 mode.
    puid: "0"
    pgid: "0"
    # Sonarr v4 native Postgres backend. Shared Cluster CR shipped from
    # components/apps/cnpg-clusters (cluster name: media-postgres). All
    # servarr apps share one Cluster + one user (`media`), each app uses
    # its own MainDb + LogDb. envPrefix = .NET IConfiguration root name.
    postgres:
      enabled: true
      envPrefix: Sonarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: sonarr-main
      logDb: sonarr-log

  radarr:
    enabled: true
    image: lscr.io/linuxserver/radarr:6.1.1
    port: 7878
    configSize: 1Gi
    readinessPath: /login
    readinessInitialDelay: 60
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: true
    # Same NFS-access workaround as Sonarr — see sonarr.puid above.
    puid: "0"
    pgid: "0"
    postgres:
      enabled: true
      envPrefix: Radarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: radarr-main
      logDb: radarr-log

  prowlarr:
    enabled: true
    image: lscr.io/linuxserver/prowlarr:2.4.0
    port: 9696
    configSize: 1Gi
    readinessPath: /
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    mountData: false
    postgres:
      enabled: true
      envPrefix: Prowlarr
      host: media-postgres-rw
      port: 5432
      secretName: media-postgres-app
      mainDb: prowlarr-main
      logDb: prowlarr-log

  jellyfin:
    enabled: true
    image: lscr.io/linuxserver/jellyfin:10.11.8
    port: 8096
    configSize: 30Gi
    readinessPath: /web/index.html
    readinessInitialDelay: 15
    resources:
      requests:
        cpu: 100m
        memory: 8000Mi
      limits:
        memory: 12000Mi
    mountData: true
    # Same NFS-access workaround as Sonarr — see sonarr.puid above.
    puid: "0"
    pgid: "0"

  transmission:
    enabled: true
    image: haugene/transmission-openvpn:5.4.1
    port: 9091
    configSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 1500Mi
      limits:
        memory: 2000Mi
    # Multi-instance: each instance is an independent Deployment with its
    # own config PVC, both mounting the shared media-data-pvc. Sharing the
    # VPN-creds Secret + the transmission-config ConfigMap. Two instances
    # share the same NORDVPN egress; if a third is added later, consider
    # spreading countries to avoid IP collision on the same exit node.
    #
    # configPvcName override: master reuses the existing `transmission-config-pvc`
    # to preserve its state across the rename (the old Deployment was named
    # `transmission`, pruned by ArgoCD; the PVC stays because we still
    # render it in the chart). Slave defaults to `transmission-slave-config-pvc`.
    instances:
      - name: master
        host: media-download
        configPvcName: transmission-config-pvc
      - name: slave
        host: media-download-slave
