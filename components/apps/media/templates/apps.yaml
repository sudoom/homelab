{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled (ne $name "transmission") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-config-pvc
  namespace: {{ $.Values.namespace }}
spec:
  storageClassName: {{ $.Values.storage.configClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $app.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- with $app.postgres }}
      {{- if .enabled }}
      initContainers:
        # Block startup until media-postgres Cluster's primary is actually
        # listening. Servarr apps give up after only 3 short retries on
        # "Connection refused" and exit non-recoverable — without this
        # wait, any race where the app starts before CNPG primary is
        # accepting connections crashes the app permanently until a manual
        # pod delete.
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ .host }} {{ .port | default 5432 }}; do
                echo "waiting for {{ .host }}:{{ .port | default 5432 }}"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $app.port }}
          {{- $pgEnabled := and $app.postgres $app.postgres.enabled }}
          {{- if or $app.puid $pgEnabled }}
          env:
            {{- if $app.puid }}
            # Per-app PUID/PGID override (linuxserver s6 init reads these
            # on container start). Only set when an app needs to deviate
            # from the image's default abc user — most don't. Sonarr is
            # the canonical case: Synology NFSv4 export uses idmap, so
            # the `abc` username on the client doesn't match any user on
            # the server and gets denied. Setting PUID=0/PGID=0 keeps
            # Sonarr running as root post-s6-init; NFS root_squash maps
            # root → admin on the Synology side, which has access.
            - name: PUID
              value: {{ $app.puid | quote }}
            - name: PGID
              value: {{ $app.pgid | quote }}
            {{- end }}
            {{- with $app.postgres }}
            {{- if .enabled }}
            # CNPG-managed Postgres for this app — Cluster CR shipped from
            # components/apps/cnpg-clusters. CNPG auto-generates `<cluster>-app`
            # Secret (keys: username, password) + `<cluster>-rw` Service.
            # Servarr apps use .NET's IConfiguration env-var override syntax:
            # double-underscore separates section/key, prefix matches the app
            # name. Sonarr v4 source: src/NzbDrone.Core/Datastore/PostgresOptions.cs
            - name: {{ .envPrefix }}__Postgres__Host
              value: {{ .host }}
            - name: {{ .envPrefix }}__Postgres__Port
              value: {{ .port | default 5432 | quote }}
            - name: {{ .envPrefix }}__Postgres__User
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: username
            - name: {{ .envPrefix }}__Postgres__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: password
            - name: {{ .envPrefix }}__Postgres__MainDb
              value: {{ .mainDb }}
            - name: {{ .envPrefix }}__Postgres__LogDb
              value: {{ .logDb }}
            {{- end }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.readinessPath }}
              port: {{ $app.port }}
            initialDelaySeconds: {{ $app.readinessInitialDelay | default 10 }}
            periodSeconds: 15
            {{- if eq $name "jellyfin" }}
            failureThreshold: 5
            timeoutSeconds: 3
            {{- end }}
          resources:
            requests:
              cpu: {{ $app.resources.requests.cpu }}
              memory: {{ $app.resources.requests.memory }}
            limits:
              memory: {{ $app.resources.limits.memory }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mountData }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config-pvc
        {{- if $app.mountData }}
        - name: data
          persistentVolumeClaim:
            claimName: media-data-pvc
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  ports:
    - port: {{ $app.port }}
  selector:
    app: {{ $name }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  host: {{ $app.host | default $name }}.{{ $.Values.domain }}
  port:
    targetPort: {{ $app.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ $name }}
{{- end }}
{{- end }}
