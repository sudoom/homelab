{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled (ne $name "transmission") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-config-pvc
  namespace: {{ $.Values.namespace }}
spec:
  storageClassName: {{ $.Values.storage.configClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $app.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $app.port }}
          {{- with $app.postgres }}
          {{- if .enabled }}
          # CNPG-managed Postgres for this app — Cluster CR shipped from
          # components/apps/cnpg-clusters. CNPG auto-generates `<cluster>-app`
          # Secret (keys: username, password) + `<cluster>-rw` Service.
          # Servarr apps use .NET's IConfiguration env-var override syntax:
          # double-underscore separates section/key, prefix matches the app
          # name. Sonarr v4 source: src/NzbDrone.Core/Datastore/PostgresOptions.cs
          env:
            - name: {{ .envPrefix }}__Postgres__Host
              value: {{ .host }}
            - name: {{ .envPrefix }}__Postgres__Port
              value: {{ .port | default 5432 | quote }}
            - name: {{ .envPrefix }}__Postgres__User
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: username
            - name: {{ .envPrefix }}__Postgres__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: password
            - name: {{ .envPrefix }}__Postgres__MainDb
              value: {{ .mainDb }}
            - name: {{ .envPrefix }}__Postgres__LogDb
              value: {{ .logDb }}
          {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.readinessPath }}
              port: {{ $app.port }}
            initialDelaySeconds: {{ $app.readinessInitialDelay | default 10 }}
            periodSeconds: 15
            {{- if eq $name "jellyfin" }}
            failureThreshold: 5
            timeoutSeconds: 3
            {{- end }}
          resources:
            requests:
              cpu: {{ $app.resources.requests.cpu }}
              memory: {{ $app.resources.requests.memory }}
            limits:
              memory: {{ $app.resources.limits.memory }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mountData }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config-pvc
        {{- if $app.mountData }}
        - name: data
          persistentVolumeClaim:
            claimName: media-data-pvc
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  ports:
    - port: {{ $app.port }}
  selector:
    app: {{ $name }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  host: {{ $app.host | default $name }}.{{ $.Values.domain }}
  port:
    targetPort: {{ $app.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ $name }}
{{- end }}
{{- end }}
