{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled (ne $name "transmission") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-config-pvc
  namespace: {{ $.Values.namespace }}
spec:
  storageClassName: {{ $.Values.storage.configClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $app.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $name }}
        # Shared label so topologySpreadConstraints can spread the whole media
        # stack across nodes — RWX CephFS /data means any node can run any app,
        # so without this the scheduler packs them onto the emptiest node (all
        # landed on node6 after the 2026-06-15 CephFS cutover bounce). The
        # cluster descheduler skips PVC pods, so it won't rebalance them.
        stack: media
    spec:
      # Soft spread (ScheduleAnyway) across hostnames so a single node
      # reboot/failure can't take the entire media stack down at once. Soft
      # (not DoNotSchedule) so pods still schedule if a node is cordoned on
      # this no-drain 3-node cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              stack: media
      {{- with $app.postgres }}
      {{- if .enabled }}
      initContainers:
        # Block startup until media-postgres Cluster's primary is actually
        # listening. Servarr apps give up after only 3 short retries on
        # "Connection refused" and exit non-recoverable — without this
        # wait, any race where the app starts before CNPG primary is
        # accepting connections crashes the app permanently until a manual
        # pod delete.
        - name: wait-for-postgres
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              until nc -z {{ .host }} {{ .port | default 5432 }}; do
                echo "waiting for {{ .host }}:{{ .port | default 5432 }}"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $app.port }}
          {{- $pgEnabled := and $app.postgres $app.postgres.enabled }}
          {{- if or $app.puid $pgEnabled $app.env }}
          env:
            {{- if $app.puid }}
            # Per-app PUID/PGID override (linuxserver s6 init reads these
            # on container start). Only set when an app needs to deviate
            # from the image's default abc user — most don't. The servarr
            # apps set PUID=0/PGID=0 so they stay root after s6-init: the
            # CephFS shared volume's subvolume root is owned root:root 0755,
            # so the default `abc` user can't create the /data tree. (Before
            # 2026-06-15 this was a Synology NFSv4 root-squash/idmap
            # workaround; same value, different reason.) jellyfin moved to the
            # OFFICIAL image (no PUID) — it uses .env + runAsUser instead.
            - name: PUID
              value: {{ $app.puid | quote }}
            - name: PGID
              value: {{ $app.pgid | quote }}
            {{- end }}
            {{- range $k, $v := $app.env }}
            # Literal env — jellyfin official-image JELLYFIN_*_DIR overrides so it
            # adopts the EXISTING linuxserver /config layout (else: fresh wizard).
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with $app.postgres }}
            {{- if .enabled }}
            # CNPG-managed Postgres for this app — Cluster CR shipped from
            # components/apps/cnpg-clusters. CNPG auto-generates `<cluster>-app`
            # Secret (keys: username, password) + `<cluster>-rw` Service.
            # Servarr apps use .NET's IConfiguration env-var override syntax:
            # double-underscore separates section/key, prefix matches the app
            # name. Sonarr v4 source: src/NzbDrone.Core/Datastore/PostgresOptions.cs
            - name: {{ .envPrefix }}__Postgres__Host
              value: {{ .host }}
            - name: {{ .envPrefix }}__Postgres__Port
              value: {{ .port | default 5432 | quote }}
            - name: {{ .envPrefix }}__Postgres__User
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: username
            - name: {{ .envPrefix }}__Postgres__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: password
            - name: {{ .envPrefix }}__Postgres__MainDb
              value: {{ .mainDb }}
            - name: {{ .envPrefix }}__Postgres__LogDb
              value: {{ .logDb }}
            {{- end }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.readinessPath }}
              port: {{ $app.port }}
            initialDelaySeconds: {{ $app.readinessInitialDelay | default 10 }}
            periodSeconds: 15
            {{- if eq $name "jellyfin" }}
            failureThreshold: 5
            timeoutSeconds: 3
            {{- end }}
          resources:
            requests:
              cpu: {{ $app.resources.requests.cpu }}
              memory: {{ $app.resources.requests.memory }}
            limits:
              memory: {{ $app.resources.limits.memory }}
          securityContext:
            privileged: true
            {{- if $app.official }}
            # Official jellyfin image has no s6/PUID remap — run as root so it
            # reads the existing /config (911:911 + root files) with no chown,
            # and accesses the privileged /dev/dri render node.
            runAsUser: 0
            runAsGroup: 0
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mountData }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if $app.hwAccel }}
            # Intel iGPU render node for QSV + ephemeral transcode scratch.
            - name: dri
              mountPath: /dev/dri
            - name: transcode
              mountPath: /transcode
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config-pvc
        {{- if $app.mountData }}
        - name: data
          persistentVolumeClaim:
            {{- if $.Values.storage.truenasMigration.cutover }}
            {{- if not $.Values.storage.truenasMigration.stagePvc }}
            {{- fail "storage.truenasMigration.cutover requires stagePvc=true -- the target PVC would not exist" }}
            {{- end }}
            claimName: media-data-nfs-pvc
            {{- else }}
            claimName: media-data-pvc
            {{- end }}
        {{- end }}
        {{- if $app.hwAccel }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: transcode
          emptyDir:
            sizeLimit: {{ $app.transcodeSize | default "20Gi" }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  ports:
    - port: {{ $app.port }}
  selector:
    app: {{ $name }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  host: {{ $app.host | default $name }}.{{ $.Values.domain }}
  port:
    targetPort: {{ $app.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ $name }}
{{- end }}
{{- end }}
