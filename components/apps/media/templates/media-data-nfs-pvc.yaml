# THE data PVC for the media stack. Was the "second" PVC of the CephFS ->
# TrueNAS migration; became the only one on 2026-09-07 when the CephFS PVC and
# its retained 3.5 TiB were reclaimed in the HDD-tier decommission. The
# stagePvc gate that used to wrap this is gone with it -- a migration flag that
# can no longer be turned off is not a flag.
#
# storageClassName: "" (empty, NOT absent) is load-bearing: empty means "no
# class", which stops the default StorageClass from dynamically provisioning
# instead of binding the static PV. The matching PV (truenas-media-data, in
# components/storage/nfs-csi) sets the same and pre-binds to this exact
# namespace/name via claimRef.
#
# Capacity must be <= the PV's 8Ti. Measured source is 3.2155 TiB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-nfs-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    # Same guard as media-data-pvc: losing this object unmounts six apps.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: ""
  volumeName: truenas-media-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
