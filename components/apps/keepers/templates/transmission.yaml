{{- $app := .Values.apps.transmission }}
{{- if $app.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-config
  namespace: {{ .Values.namespace }}
data:
  LOCAL_NETWORK: {{ $app.vpn.localNetworks | quote }}
  OPENVPN_OPTS: "--inactive 3600 --ping 10 --ping-exit 60"
  CREATE_TUN_DEVICE: "true"
  OPENVPN_PROVIDER: {{ $app.vpn.provider | quote }}
  NORDVPN_CATEGORY: {{ $app.vpn.category | quote }}
  NORDVPN_COUNTRY: {{ $app.vpn.country | quote }}
  TRANSMISSION_ENCRYPTION: {{ $app.vpn.transmissionEncryption | quote }}
  TRANSMISSION_DOWNLOAD_DIR: {{ $app.vpn.downloadDir | quote }}
  TRANSMISSION_INCOMPLETE_DIR_ENABLED: "false"
  TRANSMISSION_DOWNLOAD_QUEUE_ENABLED: "false"
  WEBPROXY_ENABLED: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config-pvc
  namespace: {{ .Values.namespace }}
spec:
  storageClassName: {{ .Values.storage.configClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $app.configSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: {{ .Values.namespace }}
spec:
  revisionHistoryLimit: 3
  # replicas is deliberately NOT git-driven, and that is not an oversight.
  #
  # root-app renders `ignoreDifferences: {group: apps, kind: Deployment,
  # jqPathExpressions: ['.spec.replicas']}` onto EVERY Application (44 of 45 on
  # 2026-08-29), so ArgoCD never reconciles a Deployment's replica count here.
  # It exists for HPA-managed Deployments, and root-app's own comment calls it
  # "a no-op" for apps without an HPA. That is true only until someone wants git
  # to CHANGE a replica count -- then the ignore silently prevents it.
  #
  # Measured the hard way during the 2026-08-29 keepers migration: a
  # `quiesced` flag rendering replicas 0/1 was added on the theory that selfHeal
  # would revert an out-of-band `oc scale`. It does not -- and because ArgoCD
  # ignores the field, flipping the flag back could not scale transmission UP
  # again after the cutover. The Deployment sat at 0 while ArgoCD reported
  # Synced/Healthy, and service was restored with the very `oc scale` the flag
  # was meant to replace.
  #
  # So: quiesce and un-quiesce with `oc scale`. It is safe here precisely
  # BECAUSE ArgoCD ignores the field -- there is nothing to fight.
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
        - name: transmission
          image: {{ $app.image }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transmission-config
            - secretRef:
                name: vpn-creds
          ports:
            - containerPort: {{ $app.port }}
          readinessProbe:
            tcpSocket:
              port: {{ $app.port }}
            initialDelaySeconds: 30
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exit $(test $(date +%H) -eq 3 && echo 1 || echo 0)
            failureThreshold: 1
            initialDelaySeconds: 3600
            periodSeconds: 60
          resources:
            requests:
              cpu: {{ $app.resources.requests.cpu }}
              memory: {{ $app.resources.requests.memory }}
            limits:
              memory: {{ $app.resources.limits.memory }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config-pvc
        - name: data
          persistentVolumeClaim:
            {{- if .Values.sharedData.truenasMigration.cutover }}
            {{- if not .Values.sharedData.truenasMigration.stagePvc }}
            {{- fail "sharedData.truenasMigration.cutover requires stagePvc=true -- the target PVC would not exist" }}
            {{- end }}
            # CUT OVER to TrueNAS. mountPath stays /data and the directory layout
            # is preserved by the copy, so transmission's torrent paths are
            # unchanged and it does not need to re-verify. Rollback = set cutover
            # back to false; keepers-data-pvc still holds the data (PV is Retain).
            claimName: keepers-data-nfs
            {{- else }}
            claimName: keepers-data-pvc
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - port: {{ $app.port }}
  selector:
    app: transmission
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: transmission
  namespace: {{ .Values.namespace }}
spec:
  host: {{ $app.host }}.{{ .Values.domain }}
  port:
    targetPort: {{ $app.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: transmission
{{- end }}
