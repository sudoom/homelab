apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keepers-data-pvc
  namespace: {{ .Values.namespace }}
spec:
  storageClassName: {{ .Values.sharedData.storageClassName }}
  accessModes:
    # RWX: the shared download volume is NFS (nfs-csi), and transmission/webtlo
    # schedule onto different nodes — RWO could never be co-mounted across them.
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedData.size }}
