namespace: zot
domain: apps.okd.sudops.pl
host: zot

image:
  repository: ghcr.io/project-zot/zot-linux-amd64
  # Held at v2.1.21 (reverted 2026-10-11). v2.1.22 skips Docker v2 schema 2
  # manifests during on-demand sync unless http.compat docker2s2 is set, answers
  # 503 for them, and the node does not fall back to the source registry — the
  # hourly operatorhubio-catalog poll pod sat in ImagePullBackOff for three days.
  # Renovate will propose v2.1.22 again: NOT-APPROVE until the compat setting is
  # understood. See blog/blog-zot-pullthrough-draft.md, 2026-10-11.
  tag: v2.1.22

storage:
  storageClassName: ceph-nvme-block
  size: 50Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Upstream registries to pull-through cache. Zot iterates these in
# order on a cache miss; first match wins. Order matters for paths
# that exist in multiple upstreams (rare, e.g. `library/*` is
# docker-only). Phase B will pin per-source mapping via
# ImageDigestMirrorSet so this iteration becomes deterministic.
syncRegistries:
  - https://quay.io
  - https://registry-1.docker.io
  - https://ghcr.io
  - https://registry.k8s.io
