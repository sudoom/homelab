apiVersion: v2
name: immich
description: |
  Immich photo/video library. Wraps the official OCI chart
  (oci://ghcr.io/immich-app/immich-charts/immich) and adds a DEDICATED
  CloudNativePG Postgres on the VectorChord image (Immich needs the vchord
  extension; the stock CNPG image can't run it — so this is NOT reusing the
  shared media-postgres) plus the RWX library PVC on the Synology NAS (nfs-csi).
  Redis is the chart-bundled single Valkey (decided 2026-06-18: not an
  operator — it's a disposable BullMQ queue). restricted-v2 securityContext
  overlay in values; vchord extensions created via CNPG postInitApplicationSQL.
version: 1.0.0
type: application
dependencies:
  - name: immich
    version: 0.13.1
    repository: oci://ghcr.io/immich-app/immich-charts
