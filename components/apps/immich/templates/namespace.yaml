apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  # Immich's official image takes no PUID/PGID and the no-accel path fits
  # restricted-v2 (no privileged needed — unlike the media/keepers stacks).
  # The real requirement is that the CephFS library volume is GID-0 writable;
  # handled via the pod securityContext + fsGroup, not a privileged namespace.
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
