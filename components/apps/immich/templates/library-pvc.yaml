apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: {{ .Values.namespace }}
  annotations:
    # Before the subchart Deployments (wave 0) that mount it.
    argocd.argoproj.io/sync-wave: "-2"
    # nfs-csi is reclaimPolicy: Retain — guard the PVC object from a stray prune
    # the same way the media data PVC is guarded (irreplaceable photos).
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: {{ .Values.library.storageClass }}
  accessModes:
    # RWX: the chart mounts the library into both the server and ML pods, which
    # schedule independently across nodes.
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.library.size }}
