{{- $pg := .Values.postgres }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave -1: the Cluster (and its auto-generated immich-postgres-app secret) must
    # exist + be Healthy BEFORE the subchart Deployments at wave 0 — they reference
    # that secret for DB_PASSWORD. ArgoCD waits for the Cluster health gate.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: {{ $pg.instances }}
  imageName: {{ $pg.image }}
  # vchord must be preloaded for the extension to load.
  postgresql:
    shared_preload_libraries:
      - vchord.so
  storage:
    size: {{ $pg.storage.size }}
    storageClass: {{ $pg.storage.storageClass }}
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: immich
      owner: immich
      # CNPG runs postInitApplicationSQL as the postgres SUPERUSER against the
      # immich app DB (all postInit* hooks are superuser; they differ only by
      # target DB — application/template1/postgres). So these not-trusted
      # (superuser-only) extensions succeed here even though the immich owner role
      # is NON-superuser, and Immich's own startup migrations re-run CREATE
      # EXTENSION IF NOT EXISTS as a no-op. shared_preload_libraries: vchord.so
      # (above) must be loaded before CREATE EXTENSION vchord — CNPG applies it at
      # initdb. Order: vector before vchord, cube before earthdistance.
      # NOTE: a future vchord operand-tag bump needs a one-off SUPERUSER
      # `ALTER EXTENSION vchord UPDATE` + `REINDEX INDEX face_index; clip_index`.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  {{- if and $pg.backup $pg.backup.enabled }}
  backup:
    volumeSnapshot:
      className: {{ $pg.backup.volumeSnapshotClassName }}
      snapshotOwnerReference: cluster
      {{- if and $pg.backup.objectStore $pg.backup.objectStore.enabled }}
      # With the barman-cloud plugin as WAL archiver (→ R2), don't block the
      # local snapshot on WAL archive — an R2 outage must not stall it too.
      online: true
      onlineConfiguration:
        waitForArchive: false
      {{- end }}
    retentionPolicy: {{ $pg.backup.retentionPolicy | quote }}
  {{- end }}
  {{- if and $pg.backup $pg.backup.objectStore $pg.backup.objectStore.enabled }}
  # WAL archiver → Cloudflare R2: a SECOND offsite copy (on top of Immich's built-in
  # pg_dumpall → NFS). Doesn't gate startup — the wave -1 gate keys on Postgres
  # being up, not WAL-archive success. ObjectStore CR below holds the R2 config.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $pg.backup.objectStore.name }}
  {{- end }}
{{- if and $pg.backup $pg.backup.enabled $pg.backup.schedule }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgres-daily
  namespace: {{ .Values.namespace }}
  annotations:
    # After the Cluster is up; not on the Deployments' critical path.
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: {{ $pg.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: immich-postgres
  method: volumeSnapshot
{{- end }}
{{- if and $pg.backup $pg.backup.objectStore $pg.backup.objectStore.enabled }}
{{- $os := $pg.backup.objectStore }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $os.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave -2: before the Cluster (wave -1) reconciles its plugins reference.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  configuration:
    destinationPath: s3://{{ $os.bucket }}/immich-postgres/
    endpointURL: {{ $os.endpointURL }}
    serverName: immich-postgres
    s3Credentials:
      accessKeyId:
        name: {{ $os.credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $os.credentialsSecret }}
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
    # No `encryption:` — R2 encrypts at rest already and rejects barman's SSE header.
  retentionPolicy: {{ $os.retentionPolicy | quote }}
  instanceSidecarConfiguration:
    env:
      - name: AWS_REGION
        value: "auto"
      # R2's #1 gotcha: it rejects boto3 ≥1.36 default checksums
      # (XAmzContentSHA256Mismatch). Required — don't remove; re-check on plugin bumps.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: "when_required"
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: "when_required"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgres-r2-daily
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # 6-field cron (sec min hour dom mon dow). 03:30 UTC — offset from the
  # volumeSnapshot -daily (04:00) so base backup + snapshot don't co-schedule.
  schedule: {{ $os.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: immich-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
