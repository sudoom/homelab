{{- if .Values.hpa.enabled }}
# CPU-based autoscaler for immich-server. The server runs the API + the
# microservices job workers (thumbnail/transcode/ML-orchestration), so CPU rises
# under import/job load — scale out, then back in when quiet. Needs the metrics
# API (metrics-server, present). selfHeal is kept off this Deployment's replicas
# via root-app ignoreDifferences so ArgoCD and the HPA don't fight.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-server
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-server
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Import bursts are spiky — require 5 min of sustained low CPU before
      # scaling in, so we don't thrash pods mid-import.
      stabilizationWindowSeconds: 300
{{- end }}
