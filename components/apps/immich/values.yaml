namespace: immich

# OpenShift Route to the immich-server (the chart's own ingress stays disabled).
# Edge TLS on the *.apps.okd.sudops.pl wildcard cert.
route:
  host: immich.apps.okd.sudops.pl

# ─────────────────────────────────────────────────────────────────────────────
# Values for THIS chart's own templates (CNPG cluster + library PVC).
# ─────────────────────────────────────────────────────────────────────────────
postgres:
  # Dedicated CNPG cluster on the VectorChord operand image. Immich requires the
  # vchord extension (>=0.3,<2.0) + pgvector — a stock CNPG image CANNOT run it,
  # so this is a separate cluster, NOT the shared media-postgres. Single instance
  # (homelab; DB is recoverable from the daily snapshot — bump to 2 for HA later).
  instances: 1
  image: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1
  storage:
    size: 10Gi
    # DB on fast RBD block, NEVER CephFS/NFS (corruption risk).
    storageClass: ceph-nvme-block
  # Extensions are created in templates/cnpg-cluster.yaml postInitApplicationSQL,
  # which CNPG runs as the postgres SUPERUSER against the immich app DB — so the
  # not-trusted vchord/cube extensions succeed with NO superuser app role needed
  # (verified 2026-06-20). shared_preload_libraries: vchord.so is set there too.
  backup:
    enabled: true
    volumeSnapshotClassName: ceph-rbd-snapshot
    retentionPolicy: "7d"
    schedule: "0 30 4 * * *"   # 04:30 UTC daily (offset from media-postgres 04:00)
    # Offsite backup → Cloudflare R2 via the barman-cloud plugin — a SECOND offsite
    # copy on top of Immich's built-in pg_dumpall → NFS → NAS.
    objectStore:
      enabled: true
      name: immich-postgres-r2
      bucket: "psql-backup"
      endpointURL: "https://456a40c7992affd80bd4d4086456c48c.eu.r2.cloudflarestorage.com"
      credentialsSecret: immich-postgres-r2-creds
      retentionPolicy: "30d"
      schedule: "0 0 3 * * *"   # 03:00 UTC base backup (offset from 04:30 snapshot)

library:
  # RWX photo/video library on the SYNOLOGY NAS via NFS (nfs-csi). Decided
  # 2026-06-18: photos are irreplaceable, so they live where the existing 3-2-1
  # pipeline already is (Synology -> cloud + offsite) — NOT on the shared
  # cephfs-hdd EC tier (which would need a brand-new Ceph->NAS backup path and
  # competes with media/RGW for ~6.9 TiB). NFS local-RAID also serves the
  # thumbnail-heavy phone workload (small random reads) at least as well as
  # EC-2+1-on-HDD, whose worst profile IS small random reads. The Postgres DB
  # stays on ceph-nvme-block (fast RBD, never NFS). nfs-csi reclaimPolicy=Retain.
  storageClass: nfs-csi
  size: 500Gi

# HPA for immich-server (CPU-based). Possible now that thumbs no longer pin the
# server to one node via an RWO PVC — its only PVC is the RWX NFS library, so >1
# replica + RollingUpdate are fine. Scales on the server's job/transcode CPU
# (heaviest during imports). ArgoCD ignores Deployment .spec.replicas (root-app
# applications.yaml) so selfHeal doesn't fight the HPA. maxReplicas kept modest —
# each replica can burst to the 8Gi mem limit, and the cluster runs memory-tight.
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

# ─────────────────────────────────────────────────────────────────────────────
# Values passed THROUGH to the official immich subchart (bjw-s common-lib based).
# Schema confirmed against immich-charts 0.12.0 (helm show values, 2026-06-18).
# ─────────────────────────────────────────────────────────────────────────────
immich:
  # restricted-v2 / PSA-restricted hardening applied to ALL components (server,
  # machine-learning, valkey) — the chart merges top-level defaultPodOptions +
  # controllers.main into each component. NO custom SCC / anyuid binding needed.
  # runAsUser is deliberately UNSET so OpenShift assigns the namespace UID range.
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      # Do NOT pin runAsUser/runAsGroup/fsGroup — restricted-v2 REJECTS fsGroup:0
      # ("0 is not an allowed group") and injects UID + fsGroup from the namespace's
      # allocated high range. fsGroupChangePolicy avoids a recursive chgrp over the
      # large NFS library on every pod start.
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # Immich images are Alpine/musl — OpenShift's ndots:5 + search-domains trips a
    # musl resolver bug on short Service names (REDIS_HOSTNAME, ML URL, DB host).
    # Cap ndots to 2 to avoid intermittent in-cluster DNS failures.
    dnsConfig:
      options:
        - name: ndots
          value: "2"
  # The server container (bjw-s controllers.main). repository is set EXPLICITLY
  # (== the chart 0.12.0 default) so Renovate's helm-values manager can resolve a
  # datasource and track app bumps — a bare `tag:` with no sibling `repository:`
  # is invisible to Renovate. Running v2.7.5 (ahead of the chart's appVersion
  # v2.6.3 — supported, same-major). Renovate groups server+ML (see renovate.json);
  # take the bumps as reviewable PRs. MAJOR (v3.x) is breaking (OAuth/API/env +
  # DB schema migrations, forward-only) AND wants a matching newer chart — do it
  # by hand, after a verified DB backup, never a blind Renovate merge.
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v2.7.5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Immich/ML write cache dirs on rootfs
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Point Immich at the dedicated CNPG cluster (merges with the chart's
            # default REDIS_HOSTNAME / IMMICH_MACHINE_LEARNING_URL env).
            DB_HOSTNAME: immich-postgres-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-app
                  key: password
  immich:
    # Storage template pinned declaratively — renders the {release}-immich-config
    # ConfigMap, auto-mounted as IMMICH_CONFIG_FILE. ENABLED BEFORE the bulk import
    # so managed uploads land organized from the first asset (avoids the heavy
    # retroactive Storage Template Migration job over NFS). Applies to MANAGED
    # (uploaded) assets only. NOTE: keys present here are READ-ONLY in the admin UI
    # (per-key lock) — change the template via this value (git -> ArgoCD -> server
    # restart), not the UI. Scoped to storageTemplate only; rest stays UI-tunable.
    configurationKind: ConfigMap
    configuration:
      storageTemplate:
        enabled: true
        hashVerificationEnabled: true
        template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
    persistence:
      library:
        # The RWX library PVC this chart templates (see templates/library-pvc.yaml).
        existingClaim: immich-library
  # Bundled single Valkey (BullMQ queue). enabled per the 2026-06-18 decision
  # (no Redis operator). emptyDir is fine — the queue is reconstructable.
  valkey:
    enabled: true
  # immich-server. Thumbs live on the NFS library at /data/thumbs (Immich default —
  # no env relocates them). The dedicated NVMe-RBD thumbs PVC was removed 2026-06-27:
  # nested-mounting RBD over /data/thumbs crashlooped startup, and the NVMe win over
  # NFS for the thumb workload is marginal. With no RWO volume left (only the RWX
  # NFS library + a ConfigMap), the server now uses RollingUpdate + a CPU HPA (below).
  server:
    enabled: true
    # Keep the server off whatever node runs machine-learning — spreads the two
    # RAM-heavy Immich pods across nodes. Hard anti-affinity (trivially satisfiable
    # on 3 nodes); scoped to the server component, NOT top-level defaultPodOptions
    # (which would also push ML/valkey around).
    defaultPodOptions:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: machine-learning
                  app.kubernetes.io/instance: immich
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 8Gi   # thumbnail + ffmpeg transcode jobs spike during import
  # CPU-only ML for v1 (the RAM sink — give it headroom, it OOMKills if starved).
  # cache stays the chart-default emptyDir for now; switch to a PVC later so the
  # HuggingFace model download survives a reschedule.
  machine-learning:
    enabled: true
    controllers:
      main:
        containers:
          main:
            image:
              # repository explicit (== chart default) for Renovate tracking; MUST
              # stay version-locked to the server above — Renovate groups them.
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.7.5
            resources:
              requests:
                cpu: 500m
                memory: 3000Mi
              # Bumped for the bulk import (CLIP + face detection on every asset).
              # Plenty of host RAM, so a generous ceiling avoids OOMKills mid-import;
              # no CPU limit so inference can burst. Dial back after the import if wanted.
              limits:
                memory: 10000Mi
