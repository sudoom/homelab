namespace: homebox

image:
  # Rootless variant: USER nonroot (65532) in the image, but any UID works under
  # restricted-v2 as long as /data is writable (fsGroup is injected).
  repository: ghcr.io/sysadminsmedia/homebox
  tag: 0.27.1-rootless
  # Must match the tag: the runtime pulls by digest and ignores the tag. Renovate's
  # #205 bumped only the tag (2026-10-24); look the digest up with
  # GET https://ghcr.io/v2/sysadminsmedia/homebox/manifests/<tag> (Docker-Content-Digest).
  digest: sha256:6bb4472e91d3084d292ce654772e26df765d01aa0d38aa7077a7bb07b7d44ac7

# Open registration was needed to create the first account; closed 2026-10-24 once
# it existed, so nobody else on the LAN can sign up. Set true only to add a user.
allowRegistration: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

data:
  # Attachments/photos only (the rootless image keeps them under /data). The
  # inventory records live in Postgres, and attachments are rare, so this PVC is
  # deliberately NOT backed up.
  size: 1Gi
  storageClass: ceph-nvme-block

route:
  host: homebox.apps.okd.sudops.pl
  targetPort: 7745

postgres:
  # Two instances for the same reason as immich-postgres (2026-09-15): a
  # 1-instance CNPG cluster carries a `minAvailable: 1` primary PDB that can never
  # be satisfied, and it stalls every master-pool drain. With 2 instances CNPG
  # switches over ahead of the drain and the old primary is evicted as a replica;
  # the replica PDB only exists at >=3 instances. Recovery is covered by the daily
  # snapshot + R2 WAL archive, not by the replica.
  instances: 2
  # Stock CNPG operand (same image as media-postgres), PostgreSQL minor pinned; the
  # same 18.6 minor immich runs. Homebox needs no extensions.
  image: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 2Gi
    # DB on fast RBD block, NEVER CephFS/NFS (corruption risk).
    storageClass: ceph-nvme-block
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  backup:
    enabled: true
    volumeSnapshotClassName: ceph-rbd-snapshot
    retentionPolicy: "7d"
    schedule: "0 0 5 * * *"   # 05:00 UTC daily (offset from media 04:00, immich 04:30)
    # Offsite backup -> Cloudflare R2 via the barman-cloud plugin.
    objectStore:
      enabled: true
      name: homebox-postgres-r2
      bucket: "psql-backup"
      endpointURL: "https://456a40c7992affd80bd4d4086456c48c.eu.r2.cloudflarestorage.com"
      # Sealed copy of immich's R2 credential (same bucket), committed as
      # templates/sealed-homebox-postgres-r2-creds.yaml at sync wave -2 so it
      # exists before the Cluster starts archiving. Keys ACCESS_KEY_ID / ACCESS_SECRET_KEY.
      credentialsSecret: homebox-postgres-r2-creds
      # 23d, not 30d: the psql-backup bucket has an R2 lifecycle rule deleting every object
      # after 31 days. With weekly bases a 23d recovery window needs a base up to 30 days old,
      # so barman never counts on an object R2 has already removed (2026-10-24).
      retentionPolicy: "23d"
      # Weekly since 2026-10-24; WAL archiving stays continuous (see cnpg-clusters values).
      schedule: "0 30 2 * * 0"   # Sundays 02:30 UTC base backup (before immich 03:00, media 03:30)
