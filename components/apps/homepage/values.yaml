namespace: homepage
host: home.apps.okd.sudops.pl

image:
  repository: ghcr.io/gethomepage/homepage
  # v2.7.0 was a day old when this shipped; the release before it.
  tag: v2.6.0

# OpenShift's oauth-proxy, from the release payload: the image behind the
# `openshift/oauth-proxy:v4.4` ImageStream tag on OKD 4.21.0-okd-scos.11. Pinned by
# digest so ArgoCD has a plain image to apply; refresh it after an OKD upgrade with
#   oc -n openshift get is oauth-proxy -o jsonpath='{.status.tags[0].items[0].dockerImageReference}'
oauthProxy:
  image: quay.io/okd/scos-content@sha256:bd59d8b888c8a0c38f48ca78d8164b55833a333c6dfed81b731e07cd48ff0054
  # Who may open the page: anyone allowed to `get services` in this namespace,
  # i.e. cluster admins. oauth-proxy runs the check with the user's own token.
  sar: '{"namespace":"homepage","resource":"services","verb":"get"}'

# Homepage has no login of its own and shows cluster resource usage, so it only
# listens on localhost; oauth-proxy is the only way in.
# A literal block, not a map: Homepage orders groups by `layout`, and Helm's
# toYaml would sort its keys alphabetically.
settings: |
  title: sudops lab
  theme: dark
  color: slate
  headerStyle: clean
  hideVersion: true
  layout:
    Media:
      style: row
      columns: 4
    Keepers:
      style: row
      columns: 4
    Photos & inventory:
      style: row
      columns: 4
    Platform:
      style: row
      columns: 4
    Network & NAS:
      style: row
      columns: 4

# Links only for now. Per-app widgets need each app's API key as a SealedSecret
# and can be added one at a time.
