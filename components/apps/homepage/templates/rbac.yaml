apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: {{ .Values.namespace }}
  annotations:
    # Registers this SA as an OAuth client whose redirect URI is the Route's host,
    # which is what lets oauth-proxy (--openshift-service-account) log users in.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"homepage"}}'
---
# Read-only access for the kubernetes info widget (cluster and node CPU/memory).
# Service discovery is off (kubernetes.yaml), so no ingress/route permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: {{ .Values.namespace }}
