namespace: rook-ceph

masterInterface: enp1s0f0np0
mtu: 1500

ipam:
  range: 192.168.10.0/24
  # Pods live in the upper /25 (192.168.10.128 – .254). The matching per-node
  # route 192.168.10.128/25 dev ceph-shim in nmstate-nncp directs host→pod
  # traffic through the macvlan shim, avoiding the bridge-mode hairpin drop
  # that breaks pod↔own-host reachability on the master interface.
  rangeStart: 192.168.10.128
  rangeEnd: 192.168.10.254
  exclude: []
  networkName: ceph-storage

# Both attachments share one IPAM pool deliberately. A 2026-05-14 attempt
# to split them into disjoint /26s (commit 1e522df, then reverted) hit a
# kRBD mount regression on node4: with public_network narrowed to
# 192.168.10.128/26, the host-side ceph-shim source IP (192.168.10.16) sits
# outside that CIDR, so msgr2 connections from kRBD silently hung and
# every libaio test PVC stuck in ContainerCreating. Bandwidth gain from
# the split would have been marginal anyway (both NADs share the same
# 10G NIC; the write bottleneck is msgr2 single-stream + replication
# amplification, not the wire). See blog/blog-multus-ceph-migration-draft.md
# "Phase 6.5 (reverted)".
attachments:
  - ceph-public
  - ceph-cluster
