{{- range .Values.attachments }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": {{ $.Values.masterInterface | quote }},
      "mode": "bridge",
      "mtu": {{ $.Values.mtu }},
      "ipam": {
        "type": "whereabouts",
        "network_name": {{ .networkName | quote }},
        "range": {{ .range | quote }},
        "range_start": {{ .rangeStart | quote }},
        "range_end": {{ .rangeEnd | quote }},
        "exclude": [
          {{- range $i, $cidr := .exclude }}
          {{- if $i }},{{ end }}
          {{ $cidr | quote }}
          {{- end }}
        ]
      }
    }
{{- end }}
