apiVersion: v1
kind: ConfigMap
metadata:
  name: synology-cert-sync-script
  namespace: {{ .Values.namespace }}
data:
  sync.sh: |
    #!/bin/sh
    # Sync the cert at /tls/tls.crt + /tls/tls.key to a Synology DSM via
    # DSM's web API. Idempotent: fingerprint-compares the in-cluster cert
    # vs the cert DSM is currently serving on https://$DSM_HOST:$DSM_PORT
    # and only POSTs the import endpoint when they differ.
    #
    # Auth via DSM user with admin-group membership (DSM 7.x doesn't have
    # per-section delegation for Certificate management — see the note in
    # blog/blog-homelab-sudops-zone-draft.md). Credentials come from the
    # SealedSecret-decoded `dsm-credentials` Secret in env vars.
    set -eu

    : "${DSM_HOST:?DSM_HOST not set}"
    : "${DSM_PORT:?DSM_PORT not set}"
    : "${DSM_USER:?DSM_USER not set}"
    : "${DSM_PASS:?DSM_PASS not set}"
    : "${DSM_CERT_DESC:?DSM_CERT_DESC not set}"

    BASE="https://${DSM_HOST}:${DSM_PORT}"

    # ---- Compare cluster cert vs DSM's currently-served cert -----------
    # `openssl s_client | x509 -fingerprint` gives a stable per-cert hash.
    cluster_fp=$(openssl x509 -in /tls/tls.crt -noout -fingerprint -sha256 | cut -d= -f2)
    dsm_fp=$(echo | openssl s_client -connect "${DSM_HOST}:${DSM_PORT}" -servername "${DSM_HOST}" -showcerts 2>/dev/null \
      | openssl x509 -noout -fingerprint -sha256 2>/dev/null \
      | cut -d= -f2)

    echo "cluster cert fp: ${cluster_fp}"
    echo "dsm     cert fp: ${dsm_fp:-<none>}"

    if [ -n "${dsm_fp}" ] && [ "${cluster_fp}" = "${dsm_fp}" ]; then
      echo "Fingerprints match; no upload needed."
      exit 0
    fi

    echo "Fingerprints differ; uploading."

    # ---- DSM auth (cookie-based session) -------------------------------
    # `format=cookie` makes DSM set an `id=<SID>` cookie we carry on
    # subsequent requests. `format=sid` returns the SID as JSON instead;
    # cookie is cleaner because curl handles the persistence.
    cookie_jar=$(mktemp)
    trap 'rm -f "${cookie_jar}"' EXIT

    login_resp=$(curl -sk -c "${cookie_jar}" \
      --data-urlencode "api=SYNO.API.Auth" \
      --data-urlencode "version=6" \
      --data-urlencode "method=login" \
      --data-urlencode "account=${DSM_USER}" \
      --data-urlencode "passwd=${DSM_PASS}" \
      --data-urlencode "format=cookie" \
      "${BASE}/webapi/auth.cgi")

    if ! echo "${login_resp}" | grep -q '"success":true'; then
      echo "DSM login failed:"
      echo "${login_resp}" | head -c 500
      exit 1
    fi
    echo "DSM login OK."

    # ---- Look up existing cert by description --------------------------
    # Without this, each run creates a new DSM cert entry — duplicates
    # accumulate. With it: pass `id=<existing>` on the import call, DSM
    # replaces in place. Result is one cert in DSM regardless of how many
    # times this CronJob has run.
    list_resp=$(curl -sk -b "${cookie_jar}" \
      --data-urlencode "api=SYNO.Core.Certificate.CRT" \
      --data-urlencode "method=list" \
      --data-urlencode "version=1" \
      "${BASE}/webapi/entry.cgi")

    EXISTING_ID=$(printf '%s' "$list_resp" | python3 -c '
    import json, sys, os
    desc = os.environ["DSM_CERT_DESC"]
    try:
        d = json.load(sys.stdin)
        certs = d.get("data", {}).get("certificates", [])
        matches = [c for c in certs if c.get("desc") == desc]
        if matches:
            defaults = [c for c in matches if c.get("is_default")]
            chosen = (defaults[0] if defaults else matches[0])
            print(chosen.get("id", ""))
            if len(matches) > 1:
                sys.stderr.write(
                    f"WARN: {len(matches)} certs with desc={desc!r}; "
                    f"replacing id={chosen.get(\"id\")}, leaving {len(matches)-1} duplicate(s) alone.\n"
                )
        else:
            sys.stderr.write("INFO: no existing cert with matching desc; creating new.\n")
    except Exception as e:
        sys.stderr.write(f"WARN: failed to parse cert list ({e!r}); creating new.\n")
    ')

    if [ -n "${EXISTING_ID}" ]; then
      echo "Replacing existing DSM cert id=${EXISTING_ID}."
    else
      echo "Creating new DSM cert entry."
    fi

    # ---- Build cert + chain --------------------------------------------
    # cert-manager bundles leaf + intermediate in tls.crt (no separate
    # ca.crt). DSM wants them SPLIT:
    #   - cert:       leaf only (first PEM block in tls.crt)
    #   - key:        private key
    #   - inter_cert: intermediate(s) (remaining PEM blocks)
    # Sending the bundle in `cert` with an empty `inter_cert` returns
    # DSM error 5512 ("Invalid certificate"). Splitting fixes it.
    awk '
      /-----BEGIN CERTIFICATE-----/ { blockno++ }
      blockno == 1                  { print > "/tmp/cert.pem" }
      blockno >= 2                  { print > "/tmp/chain.pem" }
    ' /tls/tls.crt
    cp /tls/tls.key /tmp/key.pem

    # Sanity check — empty chain would also trigger 5512 on some DSM versions
    if [ ! -s /tmp/chain.pem ]; then
      echo "WARN: no intermediate certs extracted from tls.crt — DSM may reject."
    fi

    # ---- Upload via multipart POST -------------------------------------
    # `id=<EXISTING_ID>` if found above → DSM replaces in place. Empty `id` →
    # DSM creates a new entry. `as_default=true` preserves the service
    # bindings already established for the cert with this `desc`.
    upload_resp=$(curl -sk -b "${cookie_jar}" \
      -F "api=SYNO.Core.Certificate" \
      -F "method=import" \
      -F "version=1" \
      -F "id=${EXISTING_ID}" \
      -F "desc=${DSM_CERT_DESC}" \
      -F "as_default=true" \
      -F "key=@/tmp/key.pem" \
      -F "cert=@/tmp/cert.pem" \
      -F "inter_cert=@/tmp/chain.pem" \
      "${BASE}/webapi/entry.cgi")

    # ---- Logout (best effort; don't fail the job if it errors) ---------
    curl -sk -b "${cookie_jar}" \
      --data-urlencode "api=SYNO.API.Auth" \
      --data-urlencode "version=6" \
      --data-urlencode "method=logout" \
      "${BASE}/webapi/auth.cgi" >/dev/null || true

    if echo "${upload_resp}" | grep -q '"success":true'; then
      echo "DSM cert import OK."
      exit 0
    fi

    echo "DSM cert import FAILED:"
    echo "${upload_resp}" | head -c 1000
    exit 1
