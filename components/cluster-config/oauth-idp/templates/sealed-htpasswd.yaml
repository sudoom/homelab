{{- if .Values.htpasswd.enabled }}
# Replace this stub with the real SealedSecret produced by kubeseal.
#
# Generate the htpasswd file content first (bcrypt-style):
#
#   htpasswd -c -B -b /tmp/users.htpasswd '{{ .Values.htpasswd.username }}' '<password>'
#
# Then seal:
#
#   oc -n openshift-config create secret generic htpasswd-secret \
#     --from-file=htpasswd=/tmp/users.htpasswd \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-namespace sealed-secrets --format yaml \
#     > components/cluster-config/oauth-idp/templates/sealed-htpasswd.yaml
#
#   rm /tmp/users.htpasswd
#
# Until replaced, this stub is a no-op (htpasswd IdP will fail to load).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: htpasswd-secret
  namespace: openshift-config
  annotations:
    placeholder: "REPLACE-ME-WITH-KUBESEAL-OUTPUT"
spec:
  encryptedData:
    htpasswd: "REPLACE-ME"
  template:
    metadata:
      name: htpasswd-secret
      namespace: openshift-config
    type: Opaque
{{- end }}
