{{- if .Values.github.clusterAdminUsers }}
# Cluster-admin grant for the GitHub-authenticated users above, via the
# `cluster-admins` Group rendered in group-cluster-admins.yaml. Group-bound
# (rather than per-User) so adding a user is a one-line edit in values.yaml,
# and so the same Group can drive Argo's group-keyed RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: cluster-admins
{{- end }}
