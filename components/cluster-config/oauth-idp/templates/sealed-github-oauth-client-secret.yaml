# Replace this stub with the real SealedSecret produced by kubeseal.
#
# See README.md in this chart for the full registration + sealing flow. Quick
# version once you have the GitHub OAuth App's client secret value:
#
#   oc -n openshift-config create secret generic github-oauth-client-secret \
#     --from-literal=clientSecret='<the-client-secret>' \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-namespace sealed-secrets --format yaml \
#     > components/cluster-config/oauth-idp/templates/sealed-github-oauth-client-secret.yaml
#
# Until that's done, this stub is a no-op. The OAuth/cluster CR will reference
# `github-oauth-client-secret` but the Secret won't exist, so the GitHub IdP
# will fail to load — kubeadmin still works.
{{- if .Values.github.clientID }}
{{- /* Stub kept under the same condition as the IdP so empty values don't render dangling resources. */ -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-oauth-client-secret
  namespace: openshift-config
  annotations:
    placeholder: "REPLACE-ME-WITH-KUBESEAL-OUTPUT"
spec:
  encryptedData:
    clientSecret: "REPLACE-ME"
  template:
    metadata:
      name: github-oauth-client-secret
      namespace: openshift-config
    type: Opaque
{{- end }}
