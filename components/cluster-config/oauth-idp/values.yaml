github:
  # OAuth client ID from the GitHub OAuth App registration. NOT a secret — fine
  # to commit. The matching clientSecret goes in templates/sealed-github-oauth-client-secret.yaml
  # via kubeseal (see README.md).
  clientID: "Ov23liQqd9kPTUq1G7XC"

  # Restrict logins to specific GitHub organizations. Required when using a
  # multi-tenant GitHub OAuth App; users not in any of these orgs are rejected
  # at login. Leave empty to allow any GitHub user (NOT RECOMMENDED).
  organizations:
    - sudoom-homelab

  # Optional: further restrict to specific teams within the orgs above.
  # Format: ["<org>/<team-slug>"]. Empty = any member of an org above.
  teams: []

  # GitHub username (case-sensitive) that gets cluster-admin once login works.
  # The ClusterRoleBinding template grants cluster-admin to this user.
  # Add more users by editing templates/clusterrolebinding-github.yaml.
  clusterAdminUser: "sudoom"

# Break-glass: kubeadmin remains the built-in fallback (not gated by
# OAuth.spec.identityProviders), so no additional htpasswd IdP is configured.
