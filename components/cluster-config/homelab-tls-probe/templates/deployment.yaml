apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-tls-probe
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-tls-probe
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: homelab-tls-probe
  annotations:
    # The exporter reads its config at start only; a changed ConfigMap needs a restart.
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-tls-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-tls-probe
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: homelab-tls-probe
      securityContext:
        # restricted-v2 injects the UID; the exporter writes nothing to disk.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homelab-tls-probe
