namespace: openshift-adp

obc:
  name: oadp
  # Deterministic bucket name (vs generateBucketName) so the DPA can
  # reference the bucket by name in its rendered manifest without a
  # post-bind patch step.
  bucketName: oadp

secretTranslator:
  image: quay.io/openshift/origin-cli:4.22
  destinationSecretName: cloud-credentials

# In-cluster S3 endpoint — bypasses Route + edge TLS, faster + reliable.
s3Url: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80

dpa:
  defaultPlugins:
    - aws
    - csi
    - openshift
  nodeAgent:
    enable: true
    uploaderType: kopia

schedule:
  # Daily at 02:00 UTC (= 04:00 local CEST in summer).
  cron: "0 2 * * *"
  # Retain 14 days of backups; older are GC'd by Velero.
  ttl: "336h"
  # CSI snapshot via the existing ceph-rbd-snapshot VolumeSnapshotClass;
  # datamover uploads the snapshot to S3 so loss of Ceph still leaves
  # restorable copies in RGW.
  snapshotMoveData: true
  # Narrow scope: only the `media` namespace, where the CNPG `media-postgres`
  # cluster lives. Everything else either has regeneratable data (Loki WAL,
  # Prometheus TSDB) or is reproducible from GitOps manifests.
  #
  # The 2026-06-08 incident showed why a default "back up every namespace"
  # Schedule is wrong on a single-cluster Ceph homelab: the daily backup
  # snapshotted Loki's 2× 150 GiB WAL PVCs (~233 GiB actual) into the same
  # Ceph the backup is supposed to protect → cluster hit 97% full → writes
  # blocked → cascading outage. See blog/blog-oadp-draft.md.
  #
  # FUTURE: CNPG ships its own barman-based continuous WAL streaming +
  # base-backup mechanism, which is better suited for Postgres PITR than
  # OADP's PVC-snapshot approach. When that ships (see TODO in
  # blog/blog-oadp-draft.md), this Schedule may be retired entirely.
  includedNamespaces:
    - media
