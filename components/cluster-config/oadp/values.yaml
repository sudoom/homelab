namespace: openshift-adp

obc:
  name: oadp
  # Deterministic bucket name (vs generateBucketName) so the DPA can
  # reference the bucket by name in its rendered manifest without a
  # post-bind patch step.
  bucketName: oadp

secretTranslator:
  image: quay.io/openshift/origin-cli:4.22
  destinationSecretName: cloud-credentials

# In-cluster S3 endpoint — bypasses Route + edge TLS, faster + reliable.
s3Url: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80

dpa:
  defaultPlugins:
    - aws
    - csi
    - openshift
  nodeAgent:
    enable: true
    uploaderType: kopia

schedule:
  # Daily at 02:00 UTC (= 04:00 local CEST in summer).
  cron: "0 2 * * *"
  # Retain 14 days of backups; older are GC'd by Velero.
  ttl: "336h"
  # CSI snapshot via the existing ceph-rbd-snapshot VolumeSnapshotClass;
  # datamover uploads the snapshot to S3 so loss of Ceph still leaves
  # restorable copies in RGW.
  snapshotMoveData: true
  # Namespaces excluded from the daily backup. PVCs in these namespaces are
  # either regeneratable scratch data (Loki/Prometheus WAL, TSDB blocks) or
  # contain content already durable elsewhere — backing them up wastes RBD
  # pool capacity and doubles cluster footprint for no DR benefit.
  #
  # The 2026-06-08 incident proved this: the daily backup tried to snapshot
  # + S3-upload Loki's 2× 150 GiB WAL PVCs (~233 GiB of actual data) into
  # the same Ceph cluster the backup is supposed to protect — filling Ceph
  # to 97% and blocking writes cluster-wide. See blog/blog-oadp-draft.md.
  excludedNamespaces:
    # Loki — chunks already in RGW; ingester WAL/storage PVCs are regeneratable.
    - openshift-logging
    # Prometheus TSDB — regeneratable from scrape targets on restart.
    - openshift-monitoring
    # User-workload Prometheus — same reasoning.
    - openshift-user-workload-monitoring
    # OADP itself — backing up the backup tool is circular.
    - openshift-adp
