{{- if .Values.garageBsl.enabled }}
# Credential for the garage BSL. The plaintext is an AWS shared-credentials INI
# ([default] / aws_access_key_id / aws_secret_access_key) under the key `cloud`
# -- that exact shape is what velero-plugin-for-aws reads, and `profile: default`
# in the BSL config must match the INI stanza name.
#
# The garage S3 secret is never stored in this repo. garage holds it; re-read it
# with GetKeyInfo?showSecretKey=true when re-sealing. See values.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.garageBsl.credentialSecret }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"   # before the DPA (wave 5) that consumes it
spec:
  encryptedData:
    cloud: {{ required "garageBsl.sealedCloud must be set when garageBsl.enabled=true" .Values.garageBsl.sealedCloud | quote }}
  template:
    metadata:
      name: {{ .Values.garageBsl.credentialSecret }}
      namespace: {{ .Values.namespace }}
    type: Opaque
{{- end }}
