apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schedule: {{ .Values.schedule.cron | quote }}
  paused: {{ .Values.schedule.paused }}
  template:
    ttl: {{ .Values.schedule.ttl }}
    # Follows whichever BSL is default rather than naming "default" literally.
    # The literal was a latent trap: "default" is a BSL NAME here, not a
    # reference to the default flag, so flipping the flag would have left this
    # Schedule still pointed at RGW while everything else moved -- and it is
    # paused, so nothing would have failed loudly to reveal it.
    storageLocation: {{ .Values.schedule.storageLocation }}
    snapshotMoveData: {{ .Values.schedule.snapshotMoveData }}
    defaultVolumesToFsBackup: false
    includeClusterResources: true
    {{- with .Values.schedule.includedNamespaces }}
    includedNamespaces:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- with .Values.schedule.excludedNamespaces }}
    excludedNamespaces:
{{ toYaml . | indent 6 }}
    {{- end }}
