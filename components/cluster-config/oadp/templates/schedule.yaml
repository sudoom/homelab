apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schedule: {{ .Values.schedule.cron | quote }}
  paused: {{ .Values.schedule.paused }}
  template:
    ttl: {{ .Values.schedule.ttl }}
    # Names the BSL explicitly rather than "default" literally. The literal was
    # a latent trap: "default" is a BSL NAME here, not a reference to the
    # default flag, so moving the flag to another BSL would have left this
    # Schedule pointed at the old one -- and it is paused, so nothing would
    # have failed loudly to reveal it.
    storageLocation: {{ .Values.schedule.storageLocation }}
    snapshotMoveData: {{ .Values.schedule.snapshotMoveData }}
    defaultVolumesToFsBackup: false
    includeClusterResources: true
    {{- with .Values.schedule.includedNamespaces }}
    includedNamespaces:
{{ toYaml . | indent 6 }}
    {{- end }}
    {{- with .Values.schedule.excludedNamespaces }}
    excludedNamespaces:
{{ toYaml . | indent 6 }}
    {{- end }}
