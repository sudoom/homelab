apiVersion: batch/v1
kind: Job
metadata:
  name: oadp-secret-translator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oadp-secret-translator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: oadp-secret-translator
      containers:
        - name: translator
          image: {{ .Values.secretTranslator.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NS
              value: {{ .Values.namespace }}
            - name: OBC_NAME
              value: {{ .Values.obc.name }}
            - name: DEST
              value: {{ .Values.secretTranslator.destinationSecretName }}
          command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              echo "Waiting for OBC $OBC_NAME in $NS to be Bound..."
              PHASE=""
              for i in $(seq 1 60); do
                PHASE=$(oc -n "$NS" get obc "$OBC_NAME" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                echo "  obc.phase=$PHASE (try $i/60)"
                [ "$PHASE" = "Bound" ] && break
                sleep 5
              done
              [ "$PHASE" = "Bound" ] || { echo "OBC never reached Bound"; exit 1; }

              AKID=$(oc -n "$NS" get secret "$OBC_NAME" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}'     | base64 -d)
              SAK=$(oc -n "$NS"  get secret "$OBC_NAME" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

              # Velero credential format: INI file with key "cloud".
              CLOUD=$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "$AKID" "$SAK")

              echo "Reconciling Secret/$DEST in $NS (Velero cloud-credentials shape)"
              oc create secret generic "$DEST" \
                --namespace="$NS" \
                --from-literal=cloud="$CLOUD" \
                --dry-run=client -o yaml | oc apply -f -
              echo "done"
