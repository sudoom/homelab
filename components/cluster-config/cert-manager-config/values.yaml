email: "submenu.prow-1o@icloud.com"
cloudflare:
  # The cloudflare-api-token Secret is provisioned via the SealedSecret in
  # templates/sealed-cloudflare-api-token.yaml — Argo applies the sealed
  # blob, the sealed-secrets controller in the cluster decrypts it to a
  # regular Secret named below, and cert-manager's DNS-01 issuer reads it.
  #
  # To rotate the token: regenerate at Cloudflare, then re-seal locally
  # (kubeseal must run against the live sealed-secrets controller in this
  # cluster, since the public key is per-controller):
  #
  #   oc -n cert-manager create secret generic cloudflare-api-token \
  #     --from-literal=api-token='<new-token>' \
  #     --dry-run=client -o yaml | \
  #   kubeseal --controller-namespace sealed-secrets --format yaml \
  #     > components/cluster-config/cert-manager-config/templates/sealed-cloudflare-api-token.yaml
  #
  # Commit the new sealed blob; Argo applies it and sealed-secrets rolls
  # the underlying Secret in place.
  secretName: cloudflare-api-token
  secretKey: api-token

certificates:
  - name: okd-wildcard
    namespace: openshift-ingress
    secretName: okd-wildcard-tls
    dnsNames:
      - "*.apps.okd.sudops.pl"
      - "apps.okd.sudops.pl"
  - name: api-cert
    namespace: openshift-config
    secretName: api-cert-tls
    dnsNames:
      - "api.okd.sudops.pl"
  # LAN-only zone (split-horizon: Technitium serves real A records on the
  # LAN; Cloudflare doesn't carry any). DNS-01 challenge still works because
  # the parent sudops.pl zone IS on Cloudflare and the API token has scope
  # there. Consumed by the Synology cert-sync CronJob (Phase 3 of the
  # homelab.sudops.pl rollout — see blog/blog-homelab-sudops-zone-draft.md).
  - name: homelab-wildcard
    namespace: cert-manager
    secretName: homelab-wildcard-tls
    dnsNames:
      - "*.homelab.sudops.pl"
      - "homelab.sudops.pl"
