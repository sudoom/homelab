{{- range .Values.nodes }}
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: storage-{{ .name }}
spec:
  nodeSelector:
    kubernetes.io/hostname: {{ .hostname }}
  desiredState:
    interfaces:
      - name: {{ $.Values.storageInterface }}
        type: ethernet
        state: up
        mtu: {{ $.Values.storageMtu }}
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: {{ .ip }}
              prefix-length: {{ .prefix }}
        ipv6:
          enabled: false
      - name: {{ $.Values.unusedInterface }}
        type: ethernet
        state: up
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: {{ $.Values.shimInterface }}
        type: mac-vlan
        state: up
        mtu: {{ $.Values.storageMtu }}
        mac-vlan:
          base-iface: {{ $.Values.storageInterface }}
          mode: bridge
          promiscuous: true
        ipv4:
          enabled: true
          dhcp: false
          address:
            - ip: {{ .shimIp }}
              prefix-length: {{ .prefix }}
        ipv6:
          enabled: false
    routes:
      config:
        - destination: {{ $.Values.podRangeCidr }}
          next-hop-interface: {{ $.Values.shimInterface }}
          table-id: 254
{{- end }}
