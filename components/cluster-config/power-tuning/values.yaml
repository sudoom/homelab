# Powersave profile applied at the cluster level.
#
# Sub-step A (runtime knobs, shipped 2026-05-23) — kept for nodes
# carrying the label `power-tuning/profile=experimental`. The 48h
# measurement (2026-05-25) confirmed runtime knobs alone deliver no
# measurable gain on this hardware/driver combo.
#
# Sub-step B (boot args, shipped 2026-05-25) — the real lever. Tuned's
# `[bootloader]` section generates a MachineConfig with kernel cmdline
# args. NTO-rendered MC is MCP-scoped, not node-scoped, so this applies
# to every node in the `master` pool (all 3 on this cluster). Triggers
# a serial reroll of all 3 masters; cascade pre-flight per CLAUDE.md.
#
# Knobs in B:
#   - intel_pstate=passive: switch the driver to passive mode so the
#     cpufreq governor (powersave from sub-step A) actually drives freq
#     decisions instead of intel_pstate's internal logic.
#   - processor.max_cstate=9: allow the CPU to enter the deepest idle
#     C-states. RHCOS default may cap at C6; 9 gives access to C7/C8/C10
#     on Intel server SKUs that expose them.
experimental:
  enabled: true
  priority: 20
  include: openshift-control-plane
  matchLabel: power-tuning/profile
  matchValue: experimental
  # Sub-step B: kernel boot args. Empty string disables the bootloader
  # section entirely (use this to roll back without deleting the chart).
  bootArgs: "intel_pstate=passive processor.max_cstate=9"
