# MachineConfig: drop `okd.sudops.pl` from /etc/resolv.conf search list on every node.
#
# Why this exists:
#   - okd.sudops.pl is the cluster ingress wildcard (`*.apps.okd.sudops.pl`), not a
#     search-domain suffix. RHCOS nodes inherit it from DHCP into /etc/resolv.conf,
#     and pods inherit it via kubelet's resolv.conf merge under dnsPolicy=ClusterFirst.
#   - `options ndots:5` (kubelet/pod default) means any host name with < 5 dots
#     triggers search-list permutations BEFORE the FQDN is tried as-is. The fourth
#     permutation (`<name>.okd.sudops.pl`) goes to the upstream DNS (Technitium on
#     dns-master since the 2026-05-12 migration; pi-hole pre-cutover) and stalls
#     ~5 seconds because nothing legitimately resolves under that suffix.
#   - gRPC clients (Loki querier ↔ index-gateway, Argo repo-server, etc.) use a
#     default 5 s dial deadline. Every connection attempt to a service FQDN hits
#     the search-list timeout before falling through to the working FQDN, so the
#     gRPC client gives up before the gateway is ever contacted.
#   - Verified 2026-05-08 from inside the Loki querier pod: FQDN connect 6003 ms,
#     short-name connect 0.3 ms, direct pod-IP connect 0–0.4 ms.
#
# How it works:
#   - NetworkManager dispatcher script under /etc/NetworkManager/dispatcher.d/.
#     NM fires this on every connection `up`, `dhcp4-change`, `dhcp6-change`.
#     The script strips `okd.sudops.pl` from any `search` line in resolv.conf
#     idempotently and in-place. Survives DHCP lease renewals.
#   - The MachineConfig itself is a one-time install of the dispatcher script.
#     Already on-cluster since 2026-05-08 (manually applied from tests/); this
#     chart adopts ownership via ArgoCD SSA with bit-identical spec — no MCO
#     reroll.
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: {{ .Values.machineConfigName }}
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        - path: /etc/NetworkManager/dispatcher.d/99-strip-okd-search.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
