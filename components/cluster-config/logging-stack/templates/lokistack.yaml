apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: {{ .Values.lokistack.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Carrier for the secret-translator Job's inputs. The Job is an Argo CD
    # Sync hook and hooks are outside the app's diff, so a change that only
    # touches its inputs (endpoint, bucket, region, credentials Secret name,
    # destination Secret name) never made the app OutOfSync: auto-sync did not
    # run and the hook never rewrote loki-storage (the 2026-11-06 endpoint
    # change did not reach Loki for that reason). This hash changes with any of
    # them, so the app goes OutOfSync, syncs, and the hook runs.
    sudops.pl/storage-secret-inputs: {{ list .Values.garage.endpoint .Values.garage.bucket .Values.garage.region .Values.garage.credentialsSecret .Values.secretTranslator.destinationSecretName | join "|" | sha256sum | trunc 16 | quote }}
spec:
  size: {{ .Values.lokistack.size }}
  storage:
    schemas:
      - effectiveDate: {{ .Values.lokistack.storageSchemaEffectiveDate | quote }}
        version: {{ .Values.lokistack.storageSchemaVersion }}
    secret:
      name: {{ .Values.secretTranslator.destinationSecretName }}
      type: s3
  storageClassName: {{ .Values.lokistack.storageClassName }}
  tenants:
    mode: {{ .Values.lokistack.tenantsMode }}
  {{- if .Values.lokistack.retentionDays }}
  limits:
    global:
      retention:
        days: {{ .Values.lokistack.retentionDays }}
  {{- end }}
  {{- if .Values.lokistack.ingesterReplicas }}
  template:
    ingester:
      replicas: {{ .Values.lokistack.ingesterReplicas }}
  {{- end }}
