apiVersion: batch/v1
kind: Job
metadata:
  name: loki-secret-translator
  namespace: {{ .Values.namespace }}
  annotations:
    # Argo Sync hook — re-runs on every sync, prior run is deleted first.
    # Sync-wave puts it after the OBC (wave 0) and before LokiStack (wave 2).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-secret-translator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: loki-secret-translator
      containers:
        - name: translator
          image: {{ .Values.secretTranslator.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NS
              value: {{ .Values.namespace }}
            - name: OBC_NAME
              value: {{ .Values.obc.name }}
            - name: DEST
              value: {{ .Values.secretTranslator.destinationSecretName }}
            - name: REGION
              value: {{ .Values.secretTranslator.region }}
          command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              echo "Waiting for OBC $OBC_NAME in $NS to be Bound..."
              PHASE=""
              for i in $(seq 1 60); do
                PHASE=$(oc -n "$NS" get obc "$OBC_NAME" -o jsonpath='{.status.phase}' 2>/dev/null || true)
                echo "  obc.phase=$PHASE (try $i/60)"
                [ "$PHASE" = "Bound" ] && break
                sleep 5
              done
              [ "$PHASE" = "Bound" ] || { echo "OBC never reached Bound"; exit 1; }

              BUCKET=$(oc -n "$NS" get cm "$OBC_NAME" -o jsonpath='{.data.BUCKET_NAME}')
              HOST=$(oc -n "$NS"   get cm "$OBC_NAME" -o jsonpath='{.data.BUCKET_HOST}')
              PORT=$(oc -n "$NS"   get cm "$OBC_NAME" -o jsonpath='{.data.BUCKET_PORT}')
              AKID=$(oc -n "$NS" get secret "$OBC_NAME" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}'     | base64 -d)
              SAK=$(oc -n "$NS"  get secret "$OBC_NAME" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

              echo "Reconciling Secret/$DEST: bucket=$BUCKET endpoint=http://$HOST:$PORT"
              oc create secret generic "$DEST" \
                --namespace="$NS" \
                --from-literal=endpoint="http://$HOST:$PORT" \
                --from-literal=bucketnames="$BUCKET" \
                --from-literal=access_key_id="$AKID" \
                --from-literal=access_key_secret="$SAK" \
                --from-literal=region="$REGION" \
                --dry-run=client -o yaml | oc apply -f -
              echo "done"
