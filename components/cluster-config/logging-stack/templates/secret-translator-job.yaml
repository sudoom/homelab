apiVersion: batch/v1
kind: Job
metadata:
  name: loki-secret-translator
  namespace: {{ .Values.namespace }}
  annotations:
    # Argo Sync hook — re-runs on every sync, prior run is deleted first.
    # Sync-wave puts it after the SealedSecret (wave 0) and before LokiStack (wave 2).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-secret-translator
    spec:
      restartPolicy: OnFailure
      serviceAccountName: loki-secret-translator
      containers:
        - name: translator
          image: {{ .Values.secretTranslator.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NS
              value: {{ .Values.namespace }}
            - name: SRC
              value: {{ .Values.garage.credentialsSecret }}
            - name: DEST
              value: {{ .Values.secretTranslator.destinationSecretName }}
            - name: ENDPOINT
              value: {{ .Values.garage.endpoint }}
            - name: BUCKET
              value: {{ .Values.garage.bucket }}
            - name: REGION
              value: {{ .Values.garage.region }}
          command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
          args:
            - |
              # Wait for the SealedSecret controller to have unsealed the
              # credentials. On a fresh bootstrap this Job can land before the
              # controller has decrypted, and failing fast there would leave
              # LokiStack pointed at a Secret that does not exist yet.
              echo "Waiting for Secret/$SRC in $NS..."
              for i in $(seq 1 60); do
                oc -n "$NS" get secret "$SRC" >/dev/null 2>&1 && break
                echo "  not yet (try $i/60)"
                sleep 5
              done
              oc -n "$NS" get secret "$SRC" >/dev/null 2>&1 || {
                echo "FATAL: Secret/$SRC absent after 5 minutes." >&2
                echo "  It is a SealedSecret and must be generated by hand -- this" >&2
                echo "  chart cannot create secret material. See the chart README" >&2
                echo "  for the kubeseal invocation." >&2
                exit 1; }

              AKID=$(oc -n "$NS" get secret "$SRC" -o jsonpath='{.data.access_key_id}'     | base64 -d)
              SAK=$(oc -n "$NS"  get secret "$SRC" -o jsonpath='{.data.access_key_secret}' | base64 -d)
              [ -n "$AKID" ] && [ -n "$SAK" ] || {
                echo "FATAL: Secret/$SRC lacks access_key_id / access_key_secret." >&2
                exit 1; }

              echo "Reconciling Secret/$DEST: bucket=$BUCKET endpoint=$ENDPOINT region=$REGION"
              oc create secret generic "$DEST" \
                --namespace="$NS" \
                --from-literal=endpoint="$ENDPOINT" \
                --from-literal=bucketnames="$BUCKET" \
                --from-literal=access_key_id="$AKID" \
                --from-literal=access_key_secret="$SAK" \
                --from-literal=region="$REGION" \
                --dry-run=client -o yaml | oc apply -f -
              echo "done"
