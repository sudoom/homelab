namespace: openshift-logging

# OBC against the ceph-bucket StorageClass (CephObjectStore-backed).
# The OBC controller materialises a CM (BUCKET_HOST/PORT/NAME) and a
# Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) in this namespace.
# ---- Object storage: garage on TrueNAS (moved off Ceph RGW 2026-09-07) ----
# Loki's chunks lived in ceph-objectstore.rgw.buckets.data, replicated x3 on the
# three HDD OSDs -- the tier being decommissioned. This moves them off, which
# also partially decouples logging from Ceph: the 2026-05-12 failure mode was
# dashboards going dark DURING a storage incident.
#
# ONLY PARTIAL, and worth being honest about: Loki's WAL (2x150Gi),
# index-gateways (2x50Gi) and compactor all still sit on ceph-nvme-block, so a
# Ceph incident still takes logging down. Full decoupling needs the WAL off Ceph
# too, and an NFS-backed write-heavy WAL is an open performance question.
#
# NO CHUNK MIGRATION WAS DONE (operator's call, 2026-09-07). Chunks written
# before the cutover stay in the RGW bucket and are deleted with it -- logs from
# before this change are NOT queryable afterwards. Accepted deliberately: 13 GiB
# of homelab logs against the cost of an S3->S3 copy.
#
# Endpoint is the FRONTNET address. Pods cannot reach the storage backnet
# (192.168.10.0/24) -- see CLAUDE.md -- and Loki's ingesters and queriers are
# ordinary pod-network pods, unlike the hostNetwork CSI daemons that mount NFS.
# This is the same address and port the proven Velero truenas-garage BSL uses.
garage:
  endpoint: http://192.168.1.25:30188
  bucket: loki
  region: garage
  # SealedSecret supplying ONLY access_key_id + access_key_secret. The
  # non-secret half (endpoint/bucket/region) deliberately stays in this file so
  # it stays reviewable in a diff -- sealing it would mean re-sealing to change
  # an endpoint.
  credentialsSecret: loki-garage-credentials

# Pre-sync Job that assembles the LokiStack-shaped Secret. LokiStack wants ONE
# Secret carrying endpoint, bucketnames, access_key_id, access_key_secret and
# region, so the sealed credentials and the plaintext config have to be merged
# somewhere. This Job is that somewhere; it used to read an ObjectBucketClaim's
# outputs instead, which is why it already exists and is proven.
secretTranslator:
  image: quay.io/openshift/origin-cli:4.22
  destinationSecretName: loki-storage

# LokiStack — 1x.pico is the smallest tier with HA replicas (the
# 1x.demo tier is single-replica, leaves every PDB at ALLOWED
# DISRUPTIONS=0, blocking node drains). Picked over 1x.small because
# 1x.small's per-pod requests (4 CPU / 20 GiB ingester) don't fit
# on this 3-node cluster. 1x.pico has identical 4 MB/s ingestion
# target but ~5× lower resource footprint (~6.8 CPU / ~18 GiB
# cluster-wide) and ships 3-replica ingesters that map cleanly onto
# fd-a/b/c. Tested 1x.extra-small as part of the read-path 504 chase
# (querier ↔ index-gateway gRPC pool DeadlineExceeded with the index-
# gateway logging `distinct_users_len=0`) — same symptom at the
# bigger tier, so the bug is structural, not tier-specific. Reverted.
lokistack:
  name: logging-loki
  size: 1x.pico
  storageSchemaVersion: v13
  storageSchemaEffectiveDate: "2024-01-01"
  # Persistent storage class for ingester WAL + ruler — small RBD.
  storageClassName: ceph-nvme-block
  # openshift-logging mode wires Vector's tenant-per-source push and
  # the in-cluster gateway for read-side multi-tenancy.
  tenantsMode: openshift-logging
  # Global retention. Compactor sweeps old chunks out of RGW + drops
  # corresponding WAL ranges. Without this set, chunks accumulate
  # forever — the 2026-05-20 OSD_FULL incident traced back to no
  # retention here: 5 days of unbounded WAL growth ate 1 TiB raw on
  # the RBD pool before Ceph hit the 95% backstop and blocked all
  # writes (including the very RGW writes Loki needed to flush WAL).
  # 3 days is generous for a homelab; tune up if audit/debugging
  # needs the window.
  retentionDays: 3
  # 1x.pico ships 3 ingester replicas with 150Gi WAL PVCs each
  # (450Gi logical, 1.35 TiB raw replicated 3×) — way more than this
  # homelab needs. The LokiStack CRD does NOT expose per-component
  # storage size overrides (spec.template.ingester only exposes
  # replicas/nodeSelector/podAntiAffinity/tolerations), so the
  # 150Gi WAL size is locked in until upstream loki-operator adds it
  # or we move off LokiStack entirely. Reducing replicas to 2 is the
  # one knob we have to cut WAL footprint: saves 1× 150Gi + 1× 10Gi
  # storage PVC = ~480 GiB raw. Tradeoff: 50% capacity hit if one
  # ingester is rolling vs 33% with 3 replicas; acceptable for
  # homelab ingest rate (<100 KB/s vs 1x.pico's 4 MB/s target).
  ingesterReplicas: 2

# ClusterLogForwarder — Vector pipeline that picks up app + audit +
# infra logs and pushes them to the LokiStack via its gateway.
clusterLogForwarder:
  name: instance
  serviceAccount: logcollector
  inputs:
    - application
    - infrastructure
    - audit
