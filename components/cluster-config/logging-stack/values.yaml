namespace: openshift-logging

# OBC against the ceph-bucket StorageClass (CephObjectStore-backed).
# The OBC controller materialises a CM (BUCKET_HOST/PORT/NAME) and a
# Secret (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) in this namespace.
obc:
  name: loki

# Pre-sync Job that translates OBC outputs -> LokiStack-shaped Secret.
# LokiStack wants a Secret with keys: endpoint, bucketnames,
# access_key_id, access_key_secret, region. The Job loops until the OBC
# is Bound, then writes the Secret idempotently (apply-from-stdin).
secretTranslator:
  image: quay.io/openshift/origin-cli:4.20
  destinationSecretName: loki-storage
  region: us-east-1

# LokiStack — 1x.pico is the smallest tier with HA replicas (the
# 1x.demo tier is single-replica, leaves every PDB at ALLOWED
# DISRUPTIONS=0, blocking node drains). Picked over 1x.small because
# 1x.small's per-pod requests (4 CPU / 20 GiB ingester) don't fit
# on this 3-node cluster. 1x.pico has identical 4 MB/s ingestion
# target but ~5× lower resource footprint (~6.8 CPU / ~18 GiB
# cluster-wide) and ships 3-replica ingesters that map cleanly onto
# fd-a/b/c. Tested 1x.extra-small as part of the read-path 504 chase
# (querier ↔ index-gateway gRPC pool DeadlineExceeded with the index-
# gateway logging `distinct_users_len=0`) — same symptom at the
# bigger tier, so the bug is structural, not tier-specific. Reverted.
lokistack:
  name: logging-loki
  size: 1x.pico
  storageSchemaVersion: v13
  storageSchemaEffectiveDate: "2024-01-01"
  # Persistent storage class for ingester WAL + ruler — small RBD.
  storageClassName: ceph-nvme-block
  # openshift-logging mode wires Vector's tenant-per-source push and
  # the in-cluster gateway for read-side multi-tenancy.
  tenantsMode: openshift-logging

# ClusterLogForwarder — Vector pipeline that picks up app + audit +
# infra logs and pushes them to the LokiStack via its gateway.
clusterLogForwarder:
  name: instance
  serviceAccount: logcollector
  inputs:
    - application
    - infrastructure
    - audit
