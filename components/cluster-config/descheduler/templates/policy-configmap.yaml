apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy
  namespace: {{ .Values.namespace }}
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    # All eviction goes through the kube-apiserver eviction API, so
    # PDBs are respected (drains we set up — e.g. loki-pdb-override —
    # still gate this). Two profiles:
    #   1. AffinityAndTaints — fix placement violations
    #   2. LoadBalancing     — even out per-node pod count
    # Both share the conservative DefaultEvictor (ignorePvcPods + nodeFit).
    profiles:
      - name: AffinityAndTaints
        pluginConfig:
          # DefaultEvictor is the gate that ALL eviction goes through.
          # Conservative settings — never touch stateful workloads.
          - name: "DefaultEvictor"
            args:
              # Hard floor — ANY pod with a PVC is skipped. Covers
              # CNPG primary/standby, Loki ingesters, Prometheus TSDB,
              # Grafana, ArgoCD repo cache, anything stateful.
              ignorePvcPods: true
              # Defaults; restated for clarity.
              evictLocalStoragePods: false
              evictSystemCriticalPods: false
              evictFailedBarePods: false
              evictDaemonSetPods: false
              # Skip pods that have nowhere to go — descheduler tries
              # to schedule them somewhere before evicting; with
              # nodeFit: true it won't evict a pod that would just
              # land back where it came from.
              nodeFit: true

          - name: "RemovePodsViolatingNodeAffinity"
            args:
              nodeAffinityType:
                - "requiredDuringSchedulingIgnoredDuringExecution"

          - name: "RemovePodsViolatingNodeTaints"

          - name: "RemovePodsViolatingInterPodAntiAffinity"

        plugins:
          deschedule:
            enabled:
              - "RemovePodsViolatingNodeAffinity"
              - "RemovePodsViolatingNodeTaints"
              - "RemovePodsViolatingInterPodAntiAffinity"

      # LowNodeUtilization redistributes pods from over-utilized to
      # under-utilized nodes. CRITICAL: descheduler classifies on
      # request-based utilization (sum of pod CPU/mem requests vs
      # node allocatable), NOT actual usage. On this cluster the gap
      # is large — node4/6 sit at ~80% CPU REQUESTS while ACTUAL CPU
      # is ~8%, because most pods over-request CPU.
      #
      # Observed values 2026-05-21 (request-based, from descheduler logs):
      #   node4: cpu 81%, mem 32%, pods 39%
      #   node5: cpu 46%, mem 16%, pods 22%
      #   node6: cpu 78%, mem 26%, pods 52%
      #
      # Thresholds tuned so node5 (the lone under-loaded node) qualifies
      # as "under" without making the band trivially loose. Gap between
      # under and over thresholds prevents oscillation:
      #   under (AND): cpu<55%, mem<25%, pods<30%
      #   over  (OR):  cpu>70%, mem>60%, pods>50%
      - name: LoadBalancing
        pluginConfig:
          - name: "DefaultEvictor"
            args:
              ignorePvcPods: true
              evictLocalStoragePods: false
              evictSystemCriticalPods: false
              evictFailedBarePods: false
              evictDaemonSetPods: false
              nodeFit: true

          - name: "LowNodeUtilization"
            args:
              thresholds:
                cpu: 55
                memory: 25
                pods: 30
              targetThresholds:
                cpu: 70
                memory: 60
                pods: 50
              # Absolute (not deviation-relative) thresholds. With this
              # cluster's stable pod set, fixed thresholds are easier to
              # reason about than chasing a moving cluster-wide average.
              useDeviationThresholds: false

        plugins:
          balance:
            enabled:
              - "LowNodeUtilization"
