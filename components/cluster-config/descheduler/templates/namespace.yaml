apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    # Mark this as an OpenShift-managed-style namespace so descheduler's
    # own pods are excluded from its eviction sweep (matches upstream
    # default-evictor filtering of openshift-* / kube-* prefixed ns).
    openshift.io/cluster-monitoring: "true"
  annotations:
    workload.openshift.io/allowed: "management"
