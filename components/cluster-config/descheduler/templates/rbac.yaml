---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: descheduler
  namespace: {{ .Values.namespace }}
---
# Cluster-scoped read access for descheduler to enumerate pods/nodes
# across the cluster, plus the eviction subresource to actually
# evict pods. Matches kubernetes-sigs/descheduler's upstream
# cluster-role.yaml verbatim for v0.33.x.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: descheduler
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: descheduler
subjects:
  - kind: ServiceAccount
    name: descheduler
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: descheduler
---
# OpenShift SCC: descheduler runs unprivileged (no host network, no
# host mounts), but as a non-default ServiceAccount it needs an
# explicit SCC binding. `restricted-v2` is the default SCC for new
# pods in OpenShift 4.x and is the right baseline.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: descheduler-scc
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v2
subjects:
  - kind: ServiceAccount
    name: descheduler
    namespace: {{ .Values.namespace }}
