---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
  annotations:
    # Never delete or prune the Driver: deleting it removes the controller
    # plugin and ceph-csi-config ConfigMap that running mounts depend on.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  controllerPlugin:
    hostNetwork: {{ .Values.hostNetwork }}
