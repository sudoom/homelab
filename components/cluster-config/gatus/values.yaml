namespace: gatus

image:
  repository: ghcr.io/twin/gatus
  tag: v5.36.0

port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

persistence:
  enabled: true
  size: 5Gi
  storageClass: ceph-nvme-block

route:
  enabled: true
  host: gatus.apps.okd.sudops.pl

# Endpoint set monitored by Gatus. Mirror the human-meaningful URLs first
# (the things you'd want to know are down at 02:00), infrastructure second.
config:
  storage:
    type: sqlite
    path: /data/data.db
  endpoints:
    # External — internet path / DNS sanity
    - name: github
      group: external
      url: https://github.com
      interval: 60s
      conditions:
        - "[STATUS] == 200"

    - name: sudops-blog
      group: external
      url: https://sudops.pl
      interval: 60s
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 168h"

    # OKD platform
    - name: okd-api
      group: platform
      url: https://api.okd.sudops.pl:6443/healthz
      interval: 30s
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 168h"

    # ingress canary uses passthrough TLS with its own self-signed cert,
    # so the wildcard cert-expiry check doesn't apply here. Just check 200.
    - name: okd-ingress
      group: platform
      url: https://canary-openshift-ingress-canary.apps.okd.sudops.pl
      interval: 60s
      client:
        insecure: true
      conditions:
        - "[STATUS] == 200"

    # Cluster apps
    - name: argocd
      group: cluster-apps
      url: https://openshift-gitops-server-openshift-gitops.apps.okd.sudops.pl
      interval: 60s
      conditions:
        - "[STATUS] == 200"

    - name: grafana
      group: cluster-apps
      url: https://grafana.apps.okd.sudops.pl
      interval: 60s
      conditions:
        - "[STATUS] == 200"

    - name: ceph-dashboard
      group: cluster-apps
      url: https://ceph.apps.okd.sudops.pl
      interval: 60s
      conditions:
        - "[STATUS] == 200"

    # Network gear (frontnet) — TCP probes on the mktxp/RouterOS API port
    # because OpenShift's restricted-v2 SCC denies CAP_NET_RAW, which
    # disables Gatus's ICMP probe. Both devices already have tcp/8728
    # open for the mktxp scrape.
    - name: mikrotik-router
      group: network
      url: tcp://192.168.1.1:8728
      interval: 60s
      conditions:
        - "[CONNECTED] == true"

    - name: mikrotik-switch
      group: network
      url: tcp://192.168.1.220:8728
      interval: 60s
      conditions:
        - "[CONNECTED] == true"

    # DNS — pi-hole on its way out (technetium migration), but keep it
    # visible until cutover so we can see the day it stops being authoritative.
    - name: pihole-dns
      group: network
      url: udp://192.168.1.12:53
      interval: 60s
      conditions:
        - "[CONNECTED] == true"
