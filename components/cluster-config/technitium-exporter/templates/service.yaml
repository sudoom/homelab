apiVersion: v1
kind: Service
metadata:
  # The Service name becomes the scrape `job` label; the upstream dashboard and
  # rules select job=~"technitium.*".
  name: technitium-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: technitium-exporter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: technitium-exporter
  ports:
    - name: metrics
      port: {{ .Values.port }}
      targetPort: metrics
      protocol: TCP
