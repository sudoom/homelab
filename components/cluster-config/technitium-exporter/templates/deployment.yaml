apiVersion: v1
kind: ServiceAccount
metadata:
  name: technitium-exporter
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: technitium-exporter
spec:
  replicas: 1
  # One poller at a time against the Pis.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium-exporter
    spec:
      serviceAccountName: technitium-exporter
      securityContext:
        # The image (python:3.13-slim) has no USER; restricted-v2 injects one and
        # the exporter writes nothing to disk.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: EXPORTER_PORT
              value: {{ .Values.port | quote }}
            - name: TECHNITIUM_BASE_URL
              value: {{ .Values.technitium.baseUrl | quote }}
            - name: TECHNITIUM_NODES
              value: {{ .Values.technitium.nodes | quote }}
            - name: TECHNITIUM_STATS_RANGE
              value: {{ .Values.technitium.statsRange | quote }}
            - name: TECHNITIUM_TOP_LIMIT
              value: {{ .Values.technitium.topLimit | quote }}
            - name: TECHNITIUM_TOKEN
              valueFrom:
                secretKeyRef:
                  # templates/sealed-technitium-exporter-token.yaml; the token comes
                  # from the technitium-config role (README).
                  name: technitium-exporter-token
                  key: TECHNITIUM_TOKEN
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
