namespace: shelly-exporter

image:
  repository: quay.io/prometheuscommunity/json-exporter
  tag: "v0.8.0"

# json_exporter default port
port: 7979

scrapeInterval: 30s

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Plugs to scrape. Each entry becomes one ServiceMonitor endpoint targeting
# the json_exporter's /probe?target=<rpcUrl> for that plug. The `instance`
# label is what shows up on every metric — keep it stable + descriptive.
plugs:
  - instance: node6
    rpcUrl: http://192.168.1.50/rpc/Switch.GetStatus?id=0
  # Rack-level Shelly upstream of the PDU — measures the whole homelab
  # (3 nodes + Mac mini + Synology + RPi + switch + router + drives).
  # This is the meaningful denominator for cluster-wide power-lever
  # decisions; node6's plug only captures ~1/3 of total draw.
  # Pre-sub-step-B 24h reference (2026-05-23 → 2026-05-24, captured
  # manually from the Shelly web UI before this scrape config existed):
  # avg 372.5 W, max 377.5 W, min 370 W.
  - instance: rack
    rpcUrl: http://192.168.1.77/rpc/Switch.GetStatus?id=0
  # TrueNAS NAS box (Supermicro X11SCH-F / Xeon E-2146G / 6x HGST 4TB).
  # Added 2026-08-25 when the box came up. Like node6, this is a SUB-METER
  # of `rack` if the plug sits downstream of the rack feed -- do not sum
  # instances blindly. Baseline worth capturing before the pool is built
  # and again once 6 spinning HDDs are under load: the ~15-30 W delta for
  # 3.5" drives is the number the README's "NVMe-only compact nodes"
  # power argument turns on.
  - instance: truenas
    rpcUrl: http://192.168.1.55/rpc/Switch.GetStatus?id=0
