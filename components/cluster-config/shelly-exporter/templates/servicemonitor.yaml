apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shelly-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: shelly-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shelly-exporter
  endpoints:
    {{- range .Values.plugs }}
    - port: metrics
      path: /probe
      interval: {{ $.Values.scrapeInterval }}
      scheme: http
      # Multi-target probe pattern: Prometheus scrapes the json_exporter and
      # asks it to probe a specific Shelly RPC URL. The `target` query param
      # tells json_exporter which URL to fetch + extract from.
      params:
        target:
          - {{ .rpcUrl | quote }}
      # The default scrape rewrites __address__ to the exporter Service. We
      # keep that, but stamp an `instance` label per plug so multi-plug
      # deployments stay distinguishable. The default `instance=<podIP>:7979`
      # would collapse all plugs onto the same series.
      relabelings:
        # `action: replace` is the default but Prometheus-operator stamps it
        # on the live SM, which then drifts vs the rendered manifest and
        # leaves ArgoCD reporting OutOfSync. Setting it explicitly here
        # keeps the diff empty.
        - action: replace
          sourceLabels: []
          targetLabel: instance
          replacement: {{ .instance | quote }}
      # Drop the exporter's own identity from the sample. A Shelly plug is a
      # PHYSICAL device; `pod` and `container` describe the thing that read it,
      # not the thing being measured -- and `pod` CHANGES every time the
      # exporter is rescheduled. That silently forks the series: Grafana then
      # renders two legend entries both labelled `rack`, and any
      # avg_over_time/predict_linear over a window spanning the restart sees a
      # brand-new series with almost no history. Both were observed 2026-09-08
      # (duplicate legend entries, and a range query that had to be split by
      # pod to be readable). Dropping them makes the series continuous across
      # restarts, which is the correct shape for an external-device metric.
      #
      # `namespace` is deliberately KEPT: OpenShift user-workload monitoring
      # uses it for tenancy/RBAC, so dropping it is not safe here.
      metricRelabelings:
        - action: labeldrop
          regex: "pod|container"
    {{- end }}
