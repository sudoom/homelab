namespace: smartctl-exporter

image:
  repository: quay.io/prometheuscommunity/smartctl-exporter
  tag: v0.14.0

port: 9633

scrapeInterval: 60s

devices:
  # Devices to expose to the exporter container. The exporter auto-discovers
  # block devices under /dev that smartctl can query; we list explicitly so
  # rbd*/loop* devices stay out and the per-node device set stays predictable.
  # Every node has exactly three real disks — list ALL of them so the HDD is
  # covered regardless of which /dev/sdX it enumerated as. Post-2026-06-10 HDD
  # install the names differ per node: HDD is sda on node4 but sdb on node5/node6
  # (boot SSD + HDD swap /dev/sd* names because the bay isn't hot-swap and each
  # node was power-cycled to seat the drive). Scraping nvme0n1+sda+sdb covers
  # NVMe OSD + boot SSD + HDD on every node; rbd*/loop* stay out (not listed).
  - /dev/nvme0n1   # Ceph NVMe OSD
  - /dev/sda       # SATA disk 1 (HDD on node4, boot SSD on node5/node6)
  - /dev/sdb       # SATA disk 2 (boot SSD on node4, HDD on node5/node6)

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# SMART degradation alerts (PrometheusRule, evaluated by user-workload-monitoring
# since this namespace is cluster-monitoring=false). This is the production safety
# net for the used HDD tier in place of pre-install badblocks — degradation is
# caught live + a burned-in shelf spare swapped in. See blog/blog-hdd-tier-rollout-draft.md.
smartAlerts:
  enabled: true
