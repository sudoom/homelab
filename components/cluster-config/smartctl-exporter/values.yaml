namespace: smartctl-exporter

image:
  repository: quay.io/prometheuscommunity/smartctl-exporter
  tag: v0.14.0

port: 9633

scrapeInterval: 60s

devices:
  # Devices to expose to the exporter container. The exporter auto-discovers
  # block devices under /dev that smartctl can query; we list explicitly so
  # rbd*/loop* devices stay out and the per-node device set stays predictable.
  # Every node has exactly two real disks since the HDD bays were emptied on
  # 2026-09-08: the NVMe OSD and the SATA boot/etcd SSD, which is sda on all
  # three nodes (confirmed 2026-09-13 from the exporters' own smartctl_device
  # series). A /dev/sdX name can move whenever a SATA disk is added or removed
  # -- the 2026-06-10 HDD install put the HDD at sda on node4 and sdb on the
  # others -- so re-check the enumeration after any bay change.
  - /dev/nvme0n1   # Ceph NVMe OSD
  - /dev/sda       # SATA boot/etcd SSD

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# SMART degradation alerts (PrometheusRule, evaluated by user-workload-monitoring
# since this namespace is cluster-monitoring=false). Written as the safety net for
# the used HDD tier in place of pre-install badblocks; the HDDs are gone and the
# same rules now watch the boot SSDs and NVMe OSDs. See blog/blog-hdd-tier-rollout-draft.md.
smartAlerts:
  enabled: true
