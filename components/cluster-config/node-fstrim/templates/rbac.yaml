apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-fstrim
  namespace: {{ .Values.namespace }}
---
# Privileged SCC is required for hostPID + privileged container (to nsenter into
# PID 1's mount namespace). Bound only to this DaemonSet's SA, not the namespace
# default SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-fstrim-privileged-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: node-fstrim
    namespace: {{ .Values.namespace }}
