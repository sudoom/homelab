apiVersion: v2
name: truenas-exporter
description: |
  Scrape path for the node_exporter running ON the TrueNAS box (192.168.1.25).
  The exporter itself is an Ansible-managed custom app on the NAS; this chart is
  a minimal socat L4 forwarder plus the Service and ServiceMonitor that let
  user-workload Prometheus reach it.
version: 0.2.0
