namespace: truenas-exporter

# ---------------------------------------------------------------------------
# The scrape target: node_exporter running ON the NAS.
#
# THIS ADDRESS MUST BE THE FRONTNET ONE. TrueNAS also sits on the 10G storage
# backnet at 192.168.10.10, and that address is unreachable from a pod: a pod on
# the OVN pod network cannot route to 192.168.10.0/24 (everything reaching the
# backnet today does so from the HOST stack -- Ceph is network.provider: host,
# the NFS CSI pods are hostNetwork). Pointing this at .10 gives a silent scrape
# timeout with ZERO inbound SYNs on the NAS -- exactly how the Velero
# BackupStorageLocation broke on 2026-08-28. Pod -> frontnet LAN is proven to
# work (synology-cert-sync reaches 192.168.1.2 nightly).
#
# The exporter is bound to this same address on the NAS side
# (`truenas_node_exporter.listen_address` in ansible/truenas/group_vars), so the
# two must move together.
# ---------------------------------------------------------------------------
target:
  address: 192.168.1.25
  port: 9100

# Pure TCP forwarder. socat, not nginx, deliberately: Prometheus speaks plain
# HTTP over TCP and needs nothing rewritten, so an L4 forward is the whole job.
# socat needs no config file, no writable directory and no privileged port,
# which makes it trivially compatible with OpenShift's restricted-v2 arbitrary
# UID -- an nginx image would need a ConfigMap plus writable temp paths to do
# strictly less.
image:
  repository: docker.io/alpine/socat
  tag: "1.8.1.3"

# Port the proxy listens on in-cluster. Same as the target's for symmetry;
# nothing requires it.
port: 9100

# Deliberately NOT the default `<podIP>:9100`. Stamping `truenas` makes
# node_exporter's series share an `instance` value with the existing
# `shelly_power_watts{instance="truenas"}` plug metric, so one dashboard can put
# the box's power draw next to its ZFS and NFS behaviour with no join hack.
# That is the actual content of "single pane".
instanceLabel: truenas

scrapeInterval: 30s

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi
