apiVersion: v1
kind: Service
metadata:
  name: truenas-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: truenas-exporter
  ports:
    - name: metrics
      port: {{ .Values.port }}
      targetPort: metrics
      protocol: TCP
