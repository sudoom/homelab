# ---------------------------------------------------------------------------
# Off-cluster scrape target, wired the only way this cluster supports.
#
# A ServiceMonitor selects Services, and Prometheus scrapes whatever their
# Endpoints point at. A Service with NO `spec.selector` gets no endpoint
# controller, which means WE own its Endpoints object and can point it at an
# arbitrary IP -- including one outside the cluster. That is the standard
# prometheus-operator idiom for an external target.
#
# WHY NOT A ScrapeConfig: prometheus-operator's `ScrapeConfig` CRD (a static
# target list, which is the more direct expression of this) is NOT INSTALLED on
# this cluster -- `oc get crd | grep scrapeconfig` returns nothing; only
# `servicemonitors.monitoring.coreos.com` exists. So the selectorless-Service
# wrapper is not a stylistic choice, it is the available route. Re-check after
# an OKD minor upgrade: if ScrapeConfig ever lands, this pair collapses into one
# object.
#
# This is the repo's FIRST off-cluster scrape target. shelly-exporter and
# mikrotik-exporter both run the exporter as a pod IN the cluster and reach out
# from there; that shape does not work for the NAS, because ARC/ZIL/SMART only
# exist on the box itself. The MECHANISM is well-precedented though, just not
# here: `kube-system/kubelet` and `default/kubernetes` are both selectorless
# Services with hand-managed Endpoints pointing at raw node IPs.
#
# `helm lint` WILL WARN: "v1 Endpoints is deprecated in v1.33+; use
# discovery.k8s.io/v1 EndpointSlice". DO NOT ACT ON IT. This cluster's
# user-workload Prometheus has `spec.serviceDiscoveryRole` UNSET, which means
# prometheus-operator's default -- the `Endpoints` service-discovery role. It
# watches the Endpoints API. Mirroring only runs Endpoints -> EndpointSlice,
# never the reverse, so replacing this object with an EndpointSlice leaves
# nothing for that role to find and the target disappears SILENTLY: the
# ServiceMonitor stays valid, ArgoCD stays Synced+Healthy, and the series just
# stop. Deprecated-but-correct beats modern-but-undiscovered.
#
# The condition to re-check before switching: `oc -n
# openshift-user-workload-monitoring get prometheus user-workload -o
# jsonpath='{.spec.serviceDiscoveryRole}'` returning `EndpointSlice`.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: truenas-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  # No selector, deliberately -- see above. Do not "fix" this by adding one.
  ports:
    - name: metrics
      port: {{ .Values.target.port }}
      targetPort: {{ .Values.target.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: truenas-exporter
subsets:
  - addresses:
      - ip: {{ .Values.target.address | quote }}
    ports:
      - name: metrics
        port: {{ .Values.target.port }}
        protocol: TCP
