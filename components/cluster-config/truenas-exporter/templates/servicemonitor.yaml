apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.scrapeInterval }}
      scheme: http
      # Stamp a stable, human `instance` instead of the default
      # `192.168.1.25:9100`. Two reasons: dashboard 1860's host selector reads
      # `instance`, and matching the Shelly plug's `instance="truenas"` lets one
      # dashboard show power beside ZFS/NFS for the same box.
      #
      # `action: replace` is spelled out even though it is the default --
      # prometheus-operator stamps it onto the live object, and omitting it here
      # leaves ArgoCD permanently OutOfSync against the rendered manifest (the
      # same drift already documented in shelly-exporter).
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: instance
          replacement: {{ .Values.instanceLabel | quote }}
      # There is no exporter pod here -- the target is a bare IP -- so unlike
      # shelly-exporter there are no `pod`/`container` labels to drop. Nothing
      # to do, noted so a future reader does not go looking for the labeldrop
      # that chart needed.
