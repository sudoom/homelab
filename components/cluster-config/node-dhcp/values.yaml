# MachineConfig name. 99- prefix sorts after the installer's own configs,
# matching the existing 99-master-nm-strip-okd-search.
machineConfigName: 99-master-frontnet-dhcp

# Role selector. All three nodes are control-plane+worker on this compact
# cluster and live in the MASTER pool — same as nm-search-strip.
role: master

# Path being replaced. configure-ovs.sh reads THIS file at boot and copies its
# ipv4 settings onto the runtime ovs-if-br-ex connection, so this is the real
# source of truth for node addressing — not anything visible in `nmcli` at
# runtime.
profilePath: /etc/NetworkManager/system-connections/enp0s31f6.nmconnection

# base64 of the DHCP profile. Regenerate with:
#   base64 < enp0s31f6.nmconnection | tr -d '\n'
profileB64: ""
