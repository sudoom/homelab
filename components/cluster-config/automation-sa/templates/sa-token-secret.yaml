# Long-lived SA-token Secret. On OKD 4.11+ the auto-generated SA-token Secret
# was removed, but explicitly creating a Secret of type
# kubernetes.io/service-account-token with the SA's name in the
# kubernetes.io/service-account.name annotation triggers the
# kube-controller-manager to populate `data.token` with a long-lived JWT.
# This token has no expiry — rotation = delete this Secret, controller will
# re-populate a fresh one on the next reconcile.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccount.name }}-token
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccount.name }}
type: kubernetes.io/service-account-token
