apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: {{ .Values.userWorkload.enabled }}
    prometheusK8s:
      retention: {{ .Values.prometheus.retention }}
      # Size cap; prunes on whichever of the two limits trips first. Must
      # carry a `B` suffix (38GiB, not 38Gi) -- see values.yaml. CMO parses
      # this ConfigMap with UnmarshalStrict, so a mis-cased or unknown key
      # rejects the WHOLE config and degrades the `monitoring` CO.
      retentionSize: {{ .Values.prometheus.retentionSize }}
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-nvme-block
          resources:
            requests:
              storage: {{ .Values.prometheus.volumeSize }}
    alertmanagerMain:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-nvme-block
          resources:
            requests:
              storage: {{ .Values.alertmanager.volumeSize }}
{{- if .Values.userWorkload.enabled }}
---
# The openshift-user-workload-monitoring namespace is created by the
# cluster-monitoring-operator only after enableUserWorkload=true above is
# observed. Use intra-app sync-wave so this lands after the
# cluster-monitoring-config ConfigMap (default wave 0); ArgoCD retry +
# SkipDryRunOnMissingResource handle the brief gap before the namespace
# exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  config.yaml: |
    prometheus:
      retention: {{ .Values.userWorkload.retention }}
      # NOTE the different parent key: the platform cap hangs off
      # `prometheusK8s`, the user-workload one off `prometheus`. Same field
      # name, same units.
      retentionSize: {{ .Values.userWorkload.retentionSize }}
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-nvme-block
          resources:
            requests:
              storage: {{ .Values.userWorkload.volumeSize }}
{{- end }}
