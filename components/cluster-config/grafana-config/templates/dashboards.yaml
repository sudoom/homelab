# Shelly power telemetry (custom)
# Per-plug power / voltage / current / energy / temperature. Template var
# `instance` queries `label_values(shelly_power_watts, instance)`, so adding
# new plugs to components/cluster-config/shelly-exporter/values.yaml makes
# them appear here automatically.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: shelly-power
  namespace: {{ .Values.namespace }}
spec:
  folder: metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  json: |
{{ .Files.Get "files/shelly-power.json" | indent 4 }}
---
# TrueNAS — Node Exporter Full (grafana.com 1860)
#
# The generic half of the NAS single pane, for free. 1860 is the canonical
# node_exporter dashboard: CPU, memory, load, filesystem, disk IO, network --
# all of which now exist for the NAS because a node_exporter runs on it as an
# Ansible-managed custom app (ansible/truenas/roles/truenas-apps).
#
# Its template variables are `job` and `instance`; the ServiceMonitor in
# components/cluster-config/truenas-exporter stamps `instance="truenas"`, which
# is also the label the Shelly plug uses -- so this dashboard and the
# shelly-power one describe the same box under the same name.
#
# NOT covered by 1860, and therefore still hand-built (README TODO phase 2):
# ZFS pool health/capacity/fragmentation, scrub recency, per-disk SMART,
# ARC hit ratio, zil_commit rate, NFS op latency.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: truenas-node-exporter
  namespace: {{ .Values.namespace }}
spec:
  folder: metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  grafanaCom:
    id: 1860
---
# TrueNAS — single pane (custom)
#
# The NAS-specific half that grafana.com 1860 does not cover: pool health,
# capacity and scrub recency, ARC hit ratio / size, ZIL commit rate, per-disk
# SMART keyed by SERIAL, NFS server ops, and the Shelly power draw.
#
# The power panel is the reason this dashboard justifies the name: node_exporter
# and shelly-exporter are different jobs, but the ServiceMonitor in
# components/cluster-config/truenas-exporter stamps `instance="truenas"` to match
# the plug's label, so "how hard is the NAS working" and "what is it drawing"
# sit on one page with no join.
#
# Metrics prefixed `truenas_` come from the textfile collector at
# ansible/truenas/roles/truenas-tasks/files/node-exporter-textfile.py; those
# prefixed `node_` are node_exporter's own collectors.
#
# EVERY `node_*` QUERY IN THIS DASHBOARD IS SCOPED `{instance="truenas"}`, and
# that is load-bearing rather than tidy. Grafana's Prometheus datasource is
# `thanos-querier.openshift-monitoring.svc:9091` (see the GrafanaDatasource),
# which merges PLATFORM metrics with user-workload ones -- so the three OKD
# nodes' own node_exporter is in scope too. An unscoped `node_network_*` query
# silently blends their interfaces (ceph-shim, ovs-system, genev_sys_6081,
# enp0s31f6) into a panel that claims to be about the NAS. Observed on the first
# render, 2026-09-08. Note that querying `prometheus-user-workload-0` directly
# does NOT reproduce it -- UWM alone sees only `job="truenas-exporter"` -- so
# this is only visible through Grafana's own datasource.
#
# The power panel additionally needs `avg by (instance)`: the shelly series
# forked before its pod/container labeldrop landed the same day, so any window
# spanning that change still holds several series all labelled `truenas`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: truenas-single-pane
  namespace: {{ .Values.namespace }}
spec:
  folder: metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  json: |
{{ .Files.Get "files/truenas-single-pane.json" | indent 4 }}
