{{- $bindings := include "grafana-config.datasourceBindings" . | nindent 4 -}}
# Ceph — Cluster overview
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-cluster
  namespace: {{ .Values.namespace }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  grafanaCom:
    id: 2842
---
