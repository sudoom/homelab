# Kubernetes — global / cluster view (kube-prometheus-stack mixin)
# Replaces broken k8s-cluster (7249) and k8s-comprehensive (15661); 15757 ships
# with kube-prom-stack and works against standard kube-state-metrics labels.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-views-global
  namespace: {{ .Values.namespace }}
spec:
  folder: metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  grafanaCom:
    id: 15757
---
