{{- $bindings := include "grafana-config.datasourceBindings" . | nindent 4 -}}
# ---------------------------------------------------------------------------
# Folder: metrics — everything that's a Prometheus-backed visualization.
# Logs dashboards live in dashboards-logs.yaml under folder "logs".
# ---------------------------------------------------------------------------
# Ceph — Cluster overview
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-cluster
  namespace: {{ .Values.namespace }}
spec:
  folder: metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:{{ $bindings }}
  grafanaCom:
    id: 2842
---
