---
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  defaultNetwork:
    type: OVNKubernetes
    ovnKubernetesConfig:
      mtu: {{ .Values.mtu }}
      gatewayConfig:
        routingViaHost: {{ .Values.routingViaHost }}
      {{- if .Values.ipsec.mode }}
      ipsecConfig:
        mode: {{ .Values.ipsec.mode }}
      {{- end }}
