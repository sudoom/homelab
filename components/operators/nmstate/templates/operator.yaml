---
# The okderators operator applies this Namespace itself (its deploy/handler/namespace.yaml;
# HANDLER_NAMESPACE = the Subscription's namespace), forcing these labels and this annotation.
# They must stay identical here, or ArgoCD selfHeal and the operator ping-pong them, and a
# `restricted` enforce label rejects the privileged handler pods.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/node-selector: ""
  labels:
    name: {{ .Values.namespace }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kubernetes-nmstate-operator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: {{ .Values.channel }}
  installPlanApproval: {{ .Values.installPlanApproval }}
  name: kubernetes-nmstate-operator
  source: {{ .Values.source }}
  sourceNamespace: {{ .Values.sourceNamespace }}
  {{- with .Values.startingCSV }}
  startingCSV: {{ . }}
  {{- end }}
---
apiVersion: nmstate.io/v1
kind: NMState
metadata:
  name: nmstate
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec: {}
