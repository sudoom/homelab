---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cert-manager-operator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: {{ .Values.channel }}
  # Manual, deliberately (set 2026-09-08, before the 4.21 catalog flip).
  # The okderators CatalogSource is pinned per-OKD-minor and these subscriptions
  # carry no startingCSV, so the moment its tag moves 4.20 -> 4.21 OLM re-resolves
  # this channel head. On Automatic that upgrade lands unsupervised, and it does so
  # for ALL FIVE okderators operators at once -- cert-manager, gitops (ArgoCD
  # itself), cluster-logging, loki and oadp. CNPG already showed how this ends:
  # it auto-advanced 1.29.1 -> 1.30.0 with nobody deciding to.
  # Manual means the InstallPlan waits: `oc -n <ns> get installplan` then patch
  # `spec.approved: true` one operator at a time, verifying between each.
  installPlanApproval: Manual
  name: cert-manager-operator
  source: {{ .Values.source }}
  sourceNamespace: {{ .Values.sourceNamespace }}
---
apiVersion: operator.openshift.io/v1alpha1
kind: CertManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  controllerConfig:
    overrideArgs:
      - "--dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53"
      - "--dns01-recursive-nameservers-only"
