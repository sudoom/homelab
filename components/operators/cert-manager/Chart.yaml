apiVersion: v2
name: cert-manager
description: |
  cert-manager, installed from the UPSTREAM Helm chart rather than via OLM.

  Migrated off the okderators OLM operator on 2026-09-08. Reason, recorded here
  because it is the whole justification for the change: okderators ships
  cert-manager-operator v1.18.0 (upstream cert-manager 1.18.2), which supports
  Kubernetes 1.29-1.33 and went EOL 2026-03-10 -- and OKD 4.21 is Kubernetes
  1.34. No catalog available to this cluster offers anything newer
  (okderators:4.21 = 1.18.0, community-operators:v4.21 = 1.16.5,
  operatorhubio:latest = 1.16.5), so OLM had no upgrade path at all. Upstream
  issue drafted at bugs/upstream-okderators-421-ships-cert-manager-incompatible-with-421.md.

  1.20.x covers Kubernetes 1.32-1.35 = OKD 4.19-4.22, so this single version
  clears the 4.21 cluster we are on AND the 4.22 hop, with no second bump.
version: 1.0.0
type: application
dependencies:
  - name: cert-manager
    version: v1.20.3
    repository: https://charts.jetstack.io
