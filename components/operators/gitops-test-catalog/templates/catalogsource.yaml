# No updateStrategy: the image is pinned by digest, so there is nothing to poll.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: okd-test-gitops
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: {{ .Values.image | quote }}
  displayName: "OKD test — GitOps 1.22"
  publisher: OKD Community
