# The CSV suggests this namespace and runs its operand (the descheduler
# Deployment, metrics Service, ServiceMonitor) in it.
namespace: openshift-kube-descheduler-operator

subscription:
  channel: alpha
  source: okderators
  sourceNamespace: openshift-marketplace
  # Manual like the other okderators subscriptions (see templates/operator.yaml).
  installPlanApproval: Manual

kubeDescheduler:
  # Automatic since 2026-10-24 (Predictive = dry run: logs and counts what it
  # would evict, evicts nothing). The same commit removed the vendored CronJob
  # chart it replaced. Pods in openshift-*, kube-system and hypershift are never
  # evicted; the operator keeps that protection whatever the CR says.
  mode: Automatic
  deschedulingIntervalSeconds: 3600
  # AffinityAndTaints = the vendored chart's first profile, same three plugins.
  # LongLifecycle = LowNodeUtilization + RemovePodsHavingTooManyRestarts (100),
  # without the PodLifeTime eviction that LifecycleAndUtilization adds.
  profiles:
    - AffinityAndTaints
    - LongLifecycle
  # The vendored thresholds (under cpu 55 / mem 25 / pods 30, over 70 / 60 / 50)
  # cannot be expressed here; the operator only has presets that apply one
  # under/over pair to cpu, memory and pods alike: Low 10/30, Medium 20/50,
  # High 40/70. High is the closest, and a node emptied by a reboot still falls
  # under 40 on all three.
  lowNodeUtilizationThresholds: High
