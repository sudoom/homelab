# Upstream SCCs from rook/rook release-1.19:
# https://github.com/rook/rook/blob/release-1.19/deploy/examples/operator-openshift.yaml

# SCC for Rook operator and Ceph daemons (mons, OSDs, mgr, rgw)
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: rook-ceph
allowPrivilegedContainer: true
allowHostDirVolumePlugin: true
allowHostPID: false
allowHostNetwork: true
allowHostPorts: true
priority:
allowedCapabilities: ["MKNOD", "SYS_ADMIN", "NET_RAW"]
allowHostIPC: true
readOnlyRootFilesystem: false
requiredDropCapabilities: ["All"]
defaultAddCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-system
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-default
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-mgr
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-osd
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-rgw
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-nvmeof
  - system:serviceaccount:{{ .Values.namespace }}:default
  - system:serviceaccount:{{ .Values.namespace }}:rook-ceph-tools
---
# SCC for CSI driver pods
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: rook-ceph-csi
allowPrivilegedContainer: true
allowHostNetwork: true
allowHostDirVolumePlugin: true
priority:
allowedCapabilities: ["SYS_ADMIN"]
allowHostPorts: true
allowHostPID: true
allowHostIPC: true
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - emptyDir
  - hostPath
  - projected
users:
  # Pre-cephcsi operator service accounts
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-rbd-plugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-rbd-provisioner-sa
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-cephfs-plugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-cephfs-provisioner-sa
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-nfs-plugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:rook-csi-nfs-provisioner-sa
  - system:serviceaccount:{{ .Values.namespace }}:nvmeof-csi-provisioner
  # CSI operator service accounts
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-cephfs-ctrlplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-cephfs-nodeplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-nfs-ctrlplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-nfs-nodeplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-nvmeof-ctrlplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-nvmeof-nodeplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-rbd-ctrlplugin-sa
  - system:serviceaccount:{{ .Values.namespace }}:ceph-csi-rbd-nodeplugin-sa
