# Grant extra service accounts access to the rook-ceph SCC
# (provided by the rook-ceph subchart). The subchart only covers
# core SAs; these are additional SAs used by the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-scc-extra
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["rook-ceph"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rook-ceph-scc-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rook-ceph-scc-extra
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: rook-ceph-tools
    namespace: {{ .Values.namespace }}
