# Grant the CSI plugin ServiceAccounts of the ceph-csi-drivers chart access to
# the rook-ceph-csi SCC (rendered by the rook-ceph subchart). That SCC's users
# list names only the old ceph-csi-*-plugin-sa accounts, so without this
# binding the plugin pods under the new names fail SCC admission. A RoleBinding
# keeps the grant to this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rook-ceph-csi-scc-use
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["rook-ceph-csi"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rook-ceph-csi-scc-use
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rook-ceph-csi-scc-use
subjects:
  - kind: ServiceAccount
    name: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: rook-ceph-rbd-csi-ceph-com-nodeplugin-sa
    namespace: {{ .Values.namespace }}
