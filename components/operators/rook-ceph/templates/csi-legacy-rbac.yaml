# Rook v1.20 hop only; delete in the legacy-cleanup commit, once no pod in
# rook-ceph runs under an old name.
#
# The old RBD CSI ServiceAccounts and their RBAC, copied verbatim from the
# rook-ceph v1.19.5 render (its ceph-csi-operator 0.6.0 subchart; only the
# helm "# Source:" comments dropped). The v1.20.9 render no longer contains
# them, and the running plugin pods use these accounts until ceph-csi-operator
# rolls them onto the ceph-csi-drivers names. Deleting an SA invalidates the
# tokens of pods still running under it (2026-06-12 outage), so these must
# outlive the last old pod. Their SCC grant is the rook-ceph-csi SCC's users
# list, which the v1.20.9 rook-ceph chart still renders.
