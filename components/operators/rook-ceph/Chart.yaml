apiVersion: v2
name: rook-ceph-operator
description: Rook-Ceph Operator wrapper chart
version: 1.0.0
type: application
dependencies:
  - name: rook-ceph
    version: 1.21.1
    repository: https://charts.rook.io/release
  # Since Rook v1.20 the CSI Driver and OperatorConfig CRs, and the CSI plugin
  # ServiceAccounts and RBAC, come from this chart, not from rook-ceph.
  # Pairs with rook-ceph 1.21.1 (its ceph-csi-operator subchart is 1.1.0).
  - name: ceph-csi-drivers
    version: 1.1.0
    repository: https://ceph.github.io/ceph-csi-operator
