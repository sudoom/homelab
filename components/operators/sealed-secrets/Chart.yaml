apiVersion: v2
name: sealed-secrets
description: Bitnami Sealed Secrets controller
version: 1.0.0
dependencies:
  - name: sealed-secrets
    # appVersion 0.37.0 — matches the running controller. Pure source-fix; not a
    # controller upgrade (latest is 2.19.0 / 0.37.0->0.38.1, deferred as a separate
    # supervised bump). The chart is VENDORED (committed charts/*.tgz + Chart.lock)
    # so a fresh bootstrap never depends on the remote — sealed-secrets is in the
    # bootstrap-critical path (it decrypts the Cloudflare token).
    version: 2.19.3
    # Repo moved bitnami-labs.github.io -> bitnami.github.io 2026 (the old URL
    # 404s after the Bitnami repo overhaul). Do NOT use the oci bitnamicharts ref:
    # that's the frozen/deprecated downstream catalog with bitnamilegacy images.
    repository: https://bitnami.github.io/sealed-secrets
