apiVersion: v2
name: sealed-secrets
description: Bitnami Sealed Secrets controller
version: 1.0.0
dependencies:
  - name: sealed-secrets
    # 2.19.1 → controller appVersion 0.38.4 (bump from 2.18.6/0.37.0 via Renovate
    # #141 2026-07-08, then RE-VENDORED: #141 bumped Chart.yaml+Chart.lock only, so
    # the vendored charts/*.tgz had to be regenerated (`helm dependency update`) to
    # match — else a fresh-bootstrap `helm dependency build` fails the digest check.
    # Image `docker.io/bitnami/sealed-secrets-controller:0.38.4` verified pullable
    # (published 2026-07-03, multi-arch) — bitnami still ships THIS repo to
    # docker.io/bitnami, so the catalog freeze doesn't bite here. The chart is
    # VENDORED (committed charts/*.tgz + Chart.lock) so a fresh bootstrap never
    # depends on the remote — sealed-secrets is bootstrap-critical (decrypts the
    # Cloudflare token). Keys persist across the controller roll (stored as Secrets).
    version: 2.19.1
    # Repo moved bitnami-labs.github.io -> bitnami.github.io 2026 (the old URL
    # 404s after the Bitnami repo overhaul). Do NOT use the oci bitnamicharts ref:
    # that's the frozen/deprecated downstream catalog with bitnamilegacy images.
    repository: https://bitnami.github.io/sealed-secrets
